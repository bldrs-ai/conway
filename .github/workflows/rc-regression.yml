name: RC regression (full corpus + baseline bless)

# The once-per-release full regression pass. Pushing an `rc-*` tag runs the
# digest batch over the ENTIRE public and private corpora with conway's
# PINNED toolchain, gates on failures, and opens a baseline PR in each
# test-models repo whose diff IS the release's regression report:
#
#   - NEW failed.csv rows        -> this workflow goes RED, the rc is bad. A
#                                   model already failing in the committed
#                                   baseline (a known-failer that still loads
#                                   in prod, or a not-yet-fixed input) does NOT
#                                   block the rc — otherwise no rc could ever go
#                                   green while any known-failer exists.
#   - digest/errors churn        -> shows up as the baseline PR diff; review
#                                   it (with the per-PR visual evidence that
#                                   motivated the change) and MERGE to bless.
#   - merging the baseline PRs   -> baselines now track this release exactly,
#                                   so per-PR smoke diffs mean "this PR moved
#                                   geometry", not accumulated drift.
#
# Per-PR CI (build.yml run-ifc-regression) runs only the smoke subset in
# regression/smoke_models.txt — this workflow is where the whole corpus gets
# tested, once per blessed release candidate.
#
# WHY IT MIRRORS run-ifc-regression's BUILD
# The blessed digests MUST be byte-reproducible by a later PR's smoke run, or
# the baseline drifts again immediately. That job builds conway from source
# and restores the WASM Dist from a cache keyed on the conway-geom submodule
# SHA. This workflow restores the SAME cache (same key) and runs the SAME
# batch CLI. Do NOT switch this to install the published npm package instead —
# it can lag main's conway-geom SHA and reintroduce drift.
#
# PREREQUISITE — secret `REBLESS_TOKEN` (stored in conway's repo secrets):
# a PAT/App token with `contents: write` + `pull_requests: write` on BOTH
# bldrs-ai/test-models and bldrs-ai/test-models-private. GITHUB_TOKEN is
# conway-scoped and cannot push to those repos. Also requires LFS bandwidth
# budget on the test-models org — this workflow materializes the full model
# set fresh, once per rc.

on:
  push:
    tags:
      - 'rc-*'
  # On-demand runs (e.g. re-bless after fixing one model, or public-only)
  # without cutting a new tag.
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which corpora to run'
        type: choice
        options: [both, public, private]
        default: both
      # The gc-settle A/B (the control pass + its comparison), OFF by default.
      # The question it was built to answer has been answered — see "The gc-off
      # control pass" below — so a release does not pay for it any more, but
      # the machinery is the only way to ask again and stays one checkbox away.
      # Turn it on when the settle changes, or when a timing movement needs
      # explaining. A tag push supplies no inputs, so the default applies and
      # both steps skip.
      perf_ab:
        description: 'Also run the gc-off control pass and A/B comparison'
        type: boolean
        default: false
      # IN-JOB PAIRING (design/new/perf-run-comparability.md), ON by default.
      # The rc's timing delta used to compare this run against numbers frozen
      # into a previous run's committed snapshot. That comparison has a
      # MEASURED 13.66% median noise floor — two attempts of one job, same
      # commit, byte-identical digests, all 97 models faster on the second
      # attempt — against a 9.40% median regression it was reporting. The
      # signal was smaller than the noise. Timing the previous pin in THIS
      # job, on THIS machine, cancels the machine factor exactly. What it
      # leaves is MEASURED, by an A/A null test of this exact configuration
      # (run 33192612782, .github/workflows/perf-aa-null.yml): the corpus
      # AGGREGATE is stable to 0.13-0.24%, while PER MODEL the floor is ~1.4%
      # median absolute change with p10/p90 near -3%/+4%. The median of the
      # paired delta is the gate; a single model moving less than ~5% is
      # still inside the floor.
      #
      #   full  — pair over the whole corpus. The default, and what a release
      #           should use: it is the only setting under which every row of
      #           the paired delta is a measurement.
      #   smoke — pair over regression/smoke_models.txt only (~12 models).
      #           A NARROWER GATE, and the snapshot README says so. For a
      #           dispatch where 20 minutes of private-corpus pairing is not
      #           worth it, never as a silent fallback.
      #   off   — no paired pass. Only the legacy cross-run delta is written,
      #           which is a lead and not a gate. Use with `perf_ab`, or when
      #           npm is unreachable.
      #
      # A tag push supplies no inputs, so `full` applies and every release is
      # gated on a paired delta.
      perf_pair:
        description: 'Pair the previous pin in-job (full corpus / smoke subset / off)'
        type: choice
        options: [full, smoke, off]
        default: full

env:
  EMSDK_VERSION: '6.0.2'
  EMSDK_CACHE_FOLDER: 'cache/emsdk'

jobs:
  # Build the matrix from the `targets` input. Done in a job (not a job-level
  # `if` on the matrix) because the `matrix` context is NOT available in a
  # job-level `if` — referencing it there is a workflow-validation error.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # Fail here (cheap runner) before the matrix jobs allocate, so a
      # missing secret doesn't burn large-runner minutes.
      - name: Fail fast if REBLESS_TOKEN missing
        env:
          TOKEN_PRESENT: ${{ secrets.REBLESS_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::REBLESS_TOKEN secret is not set. It needs contents:write + pull_requests:write on bldrs-ai/test-models and bldrs-ai/test-models-private."
            exit 1
          fi

      - name: Pick target repos
        id: pick
        env:
          # Empty on rc-* tag pushes (no dispatch inputs) -> both corpora.
          TARGETS: ${{ github.event.inputs.targets || 'both' }}
        run: |
          PUBLIC='{"name":"public","repo":"bldrs-ai/test-models"}'
          PRIVATE='{"name":"private","repo":"bldrs-ai/test-models-private"}'
          case "$TARGETS" in
            public)  MATRIX="[$PUBLIC]" ;;
            private) MATRIX="[$PRIVATE]" ;;
            *)       MATRIX="[$PUBLIC,$PRIVATE]" ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Re-blessing: $MATRIX"

  rebless:
    needs: setup
    # One entry per selected test-models repo; public and private run in
    # parallel. The list is already filtered by the setup job, so no per-job
    # skipping is needed.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.matrix) }}
    # Same heavy runner as run-ifc-regression: the batch drives the MT WASM
    # engine over ~100 models with --parallel and reserves multi-GB shared.
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    # Outer backstop against a wedged run. A healthy run is
    # build-from-warm-cache + LFS checkout + ONE serial (--concurrency 1) pass
    # over the corpus, plus a SECOND identical pass only when the `perf_ab`
    # input is set (see "The gc-off control pass" below) — each pass with its
    # own 35-min cap, the batch self-exits, and per-model work is
    # timeout-bounded, so this rarely fires.
    #
    # THIS 90 IS SIZED FOR A TWO-HEAVY-PASS RUN, not for a one-pass release.
    # The budget, PRIVATE (the binding corpus — it is ~4x the public one in
    # wall time), measured on run 32601886424 unless noted:
    #
    #   checkout + node + deps + tsc, warm WASM cache   1m57s  -> budget  5m
    #   private corpus LFS checkout                     1m33s  -> budget  5m
    #   blessed digest pass                            ~20m30s -> cap    35m
    #   previous-pin install (npm, perf_pair only)      <1m     -> budget  2m
    #   paired perf pass       (perf_pair only)        ~20m30s -> cap    35m
    #   gc-off control pass    (perf_ab only)          ~20m    -> cap    35m
    #   gates, summaries, artifact, bless, PR, post       ~15s  -> budget  3m
    #                                                            --------
    #                              perf_pair=full run (default):  70m
    #                              perf_ab run (perf_pair=off) :  83m
    #                              neither                     :  48m
    #
    # PAIRING AND perf_ab CANNOT BOTH RUN, and the job refuses the
    # combination in its first step rather than discovering it 70 minutes in:
    # four heavy passes is ~104m against this 90m ceiling. They ask different
    # questions and neither is urgent, so serialising them into two dispatches
    # is the cheap answer. See "Reject an over-budget pass combination" below.
    #
    # 90 leaves ~7 min over the larger of the two two-pass budgets, and every
    # heavy pass is separately capped, so a wedge is cancelled inside its own
    # step long before this ceiling — this number only has to bound the
    # untimed steps.
    #
    # NOT sized for a cold WASM-cache rebuild on top of two long passes: that
    # combination is already pathological and should be cancelled. A cold
    # rebuild on a normal-speed run still fits. Bump it if a legitimate cold
    # rebuild is ever cancelled here.
    timeout-minutes: 90
    steps:
      # Fail in seconds, on the cheapest step in the job, rather than at
      # minute 70. Four heavy corpus passes (blessed + paired + control, plus
      # the paired pass's install) budget at ~104 minutes against this job's
      # 90-minute ceiling, so the combination cannot complete — it would be
      # killed mid-control-pass, after the re-bless PR had already been
      # opened, leaving a green-looking release whose A/B silently produced
      # nothing. The two questions are independent and neither is urgent:
      # dispatch twice.
      #
      # Same two-representation read of `perf_ab` as the control pass below —
      # a `type: boolean` input is a real boolean in `inputs` and the string
      # 'true' in `github.event.inputs`, and testing only one fails silently
      # against the other. `perf_pair` is `type: choice`, i.e. a string in
      # both contexts, so one read is enough for it.
      - name: Reject an over-budget pass combination
        env:
          PERF_PAIR: ${{ github.event.inputs.perf_pair || 'full' }}
          # A boolean expression renders as the string 'true'/'false', so the
          # shell test below is a plain string compare with no quoting games.
          PERF_AB: ${{ inputs.perf_ab == true || github.event.inputs.perf_ab == 'true' }}
        run: |
          echo "perf_pair=$PERF_PAIR perf_ab=$PERF_AB"
          if [ "$PERF_AB" = "true" ] && [ "$PERF_PAIR" != "off" ]; then
            echo "::error::perf_ab and perf_pair are both on. That is four heavy corpus passes (~104 min) against this job's 90-minute cap. Re-dispatch with perf_pair=off for the A/B, or with perf_ab unticked for the paired gate."
            exit 1
          fi

      # --- Build conway from source (identical to run-ifc-regression) ---
      - name: Checkout conway
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same cache key as build.yml -> hits the Dist that job populated for
      # this conway-geom SHA, so the digests match run-ifc-regression exactly
      # and (on a hit) no WASM rebuild happens.
      - name: Restore WASM build cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      # --- WASM build fallback on cache miss (mirrors build.yml) ---
      - name: Restore GENie cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        id: genie-cache
        uses: actions/cache@v4
        with:
          path: bin/linux/genie
          key: genie-${{ runner.os }}

      - name: Build GENie
        if: steps.wasm-cache.outputs.cache-hit != 'true' && steps.genie-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/bkaradzic/GENie.git GENie
          (cd GENie && make)
          mkdir -p bin/linux
          cp GENie/bin/linux/genie bin/linux/genie

      - name: Cache Emscripten system libraries
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK_CACHE_FOLDER }}
          key: ${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}

      - name: Export EMSDK paths for subsequent steps
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          EMSDK=$(which em++ | sed 's|upstream/emscripten/em++||')
          EMSCRIPTEN=$(which em++ | sed 's|/em++||')
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSCRIPTEN=$EMSCRIPTEN" >> "$GITHUB_ENV"

      - name: Extract WASM build dependencies
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn extract-wasm-dependencies

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build-GHA-all

      - name: TypeScript build
        run: yarn build-incremental

      # --- Regenerate the target repo's baseline ---
      # Checkout the models repo into `models` with LFS materialized (the batch
      # reads the real model bytes, not pointer stubs). REBLESS_TOKEN so the
      # later create-pull-request can push a branch to it.
      - name: Checkout ${{ matrix.target.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          token: ${{ secrets.REBLESS_TOKEN }}
          lfs: true
          path: models

      # Regenerate every digest CSV (+ main/errors/failed) in place, exactly as
      # run-ifc-regression does: same exclude, same parallelism. `-t HEAD`
      # points the batch's changes summary at the current committed baseline.
      # NOT --dryrun: dryrun git-checkouts the output folder back, discarding
      # the regeneration — we want it to persist so the PR carries it.
      #
      # --concurrency 1: run ONE model at a time. Each child is itself
      # multi-threaded, so any concurrency oversubscribes the cores, and serial
      # execution is what makes the per-model perf numbers usable at all (see
      # --perf below). Digests are deterministic regardless of concurrency, so
      # the blessed output is unchanged.
      #
      # This flag was originally justified by ISSUE_159 timing out at
      # --concurrency 2, blamed on core oversubscription. That diagnosis was
      # wrong (#473 — it was a non-terminating CDT loop, fixed in
      # conway-geom#165), but the flag earns its place on the perf-measurement
      # grounds above regardless.
      #
      # --timeout 300000 (5 min): generous over the slowest model's true
      # standalone time (~80s) now that nothing is starved, and catches a
      # genuine hang faster than the old 600s.
      #
      # The retry-once that used to live here has been REMOVED. It was added
      # because ISSUE_159 timed out again at --concurrency 1, which was read as
      # "a per-model timeout is a nondeterministic infra event". It was not:
      # CDT::insertEdges under TryResolve did not terminate on that model's
      # revolution unwrap, allocating until the wasm heap died (#473, fixed in
      # conway-geom#165). The model was bimodal — 2s or 35-92s or past any
      # timeout — and retrying a coin flip once comes up green often enough to
      # look like transient infra, so the retry laundered a real bug into a
      # passing run for months. If a timeout returns, treat it as a bug and
      # diagnose it; do not re-add a retry.
      #
      # -e also drops cg4*-cylinder.stp: LLM-generated files (their FILE_NAME
      # credits ChatGPT) with no PRODUCT, no shape representation and invalid
      # entity types, so producing zero geometry is correct and they only add
      # noise. Same reasoning as the sp-* concatenations. See #477.
      #
      # --perf: with the run already serial, capture every model's steady
      # parse/geometry/total + RSS in one pass. Written to the conway workspace
      # root (NOT the models checkout, so it never touches the diffed baseline)
      # — actions/hashFiles only matches paths under GITHUB_WORKSPACE, so the
      # upload step below can gate on it. No separate perf pass needed. This is
      # conway-native load timing, distinct from the perf-three-* render jobs.
      #
      # THIS IS THE BLESSED PASS. It runs the shipped configuration and its
      # perf.csv is the only one that reaches bless_perf_snapshot.cjs and the
      # re-bless PR. `CONWAY_PERF_EXPOSE_GC: '1'` is that default written down
      # rather than changed: `exposeGcRequested()` in
      # ifc_regression_batch_main.ts returns true when the variable is unset,
      # so this pins the condition being blessed against the control pass
      # below, which sets it to '0'. Keep it pinned even though that control
      # pass is now opt-in — the point of writing the default down is that the
      # blessed configuration does not move when the A/B is off. Do NOT make
      # the control pass the blessed one — that would put a release's numbers
      # under a configuration nobody ships.
      #
      # THE 35 IS DERIVED, NOT ROUND. This step is the longest thing in the
      # job and the private corpus is what sizes it. Measured wall times for
      # this step (GitHub Actions step timestamps):
      #
      #   private, run 32550854090 (@1e55a8e0, no settle)       19m55s  passed
      #   private, run 32601766596 (@1e55a8e0, no settle)       19m12s  passed
      #   private, run 32601886424 (@4c0d768b, #556 settle)     20m01s  KILLED
      #   public,  run 32601886424 (@4c0d768b, #556 settle)      5m15s  passed
      #
      # The private step had been running at 19m55s against a 20-min cap —
      # 5 seconds of headroom — before this workflow gained a second pass.
      # conway#556's retention settle (two forced GCs per model, 107 private
      # models) is what pushed it over: the within-run A/B on public measures
      # the settle at 5m15s vs the control's 5m06s, +2.9%, which puts private
      # at ~20m30s, and a cross-run read of public (5m15s vs 4m48s) puts it
      # nearer 21m45s. Either way it no longer fits under 20.
      #
      # 35 is ~1.6x the estimate. Whole-pass wall time is actually stable —
      # the three private runs above span 3.7% — but PER-MODEL times across
      # runs are not, and design/new/perf-measurement.md records a 1.55x
      # median between-run scale factor on one model set. 35 covers even a
      # whole pass landing at that factor (19m55s x 1.55 = 30m52s) with
      # ~13% left. Do not trim this back toward the measured 20m: that is the
      # 99.6%-of-budget state this cap was raised to get out of.
      - name: Regenerate baseline digests
        timeout-minutes: 35
        env:
          CONWAY_PERF_EXPOSE_GC: '1'
        run: |
          node --experimental-specifier-resolution=node \
            ./compiled/src/ifc/ifc_regression_batch_main.js \
            -e "sp-.*\.ifc|cg4.*-cylinder\.stp" \
            -t HEAD \
            --concurrency 1 \
            --timeout 300000 \
            --perf "${GITHUB_WORKSPACE}/perf.csv" \
            models \
            models/regression/test_models \
            --parallel --mem-utilization 90

      # zero_geometry.csv lands in the model checkout next to the baselines the
      # re-bless PR commits (add-paths: regression/test_models), but it is a
      # derived per-run diagnostic, not part of the blessed baseline — leaving
      # it there would commit it and churn it on every rc. Move it up to the
      # workspace: out of the PR, and readable by the gate at the end of the
      # job. `!cancelled()` so it survives an earlier hard-gate failure, which
      # is precisely the run where the diagnostic is worth having.
      - name: Move zero_geometry.csv out of the baseline checkout
        if: ${{ !cancelled() }}
        run: |
          SRC=models/regression/test_models/zero_geometry.csv
          if [ -f "$SRC" ]; then
            mv "$SRC" "${GITHUB_WORKSPACE}/zero_geometry.csv"
            echo "Moved zero_geometry.csv to the workspace."
          else
            echo "No zero_geometry.csv produced."
          fi

      # Hard gate: fail the rc only on NEW parse/extract failures — models that
      # were NOT already failing in the committed baseline. Pre-existing,
      # already-blessed failures (a model that crashes here but loads in prod,
      # or a known-bad input we haven't fixed yet) must NOT block every future
      # rc; gating on failed.csv being non-empty means no rc can ever go green
      # while any known-failer exists.
      #
      # The baseline is the failed.csv committed at the target repo's HEAD — the
      # regeneration above overwrote the working copy in place, so `git show
      # HEAD:` still yields the pre-run committed set. The diff is keyed on the
      # `file` column, so a model is simply "failing" or not: robust to a
      # known-failer's exact exit code/signal wobbling between runs (e.g. an OOM
      # kill, which surfaces as an empty code/signal here). A brand-new failing
      # model reds the rc; resolved failures are reported (and drop out of
      # failed.csv in the baseline PR below) but never gate. Digest/errors churn
      # is likewise not gated here — it lands in the baseline PR diff, where a
      # human reviews and blesses it.
      - name: Fail on NEW regression failures
        run: |
          cd models/regression/test_models
          python3 - "${{ matrix.target.repo }}" <<'EOF'
          import csv, io, subprocess, sys
          from collections import Counter

          repo = sys.argv[1]

          def read_csv(text):
              rows = list(csv.reader(io.StringIO(text)))
              if not rows:
                  return [], []
              return rows[0], [r for r in rows[1:] if r]

          # Current (freshly regenerated) failed.csv.
          try:
              with open("failed.csv", newline="") as f:
                  cur_header, current = read_csv(f.read())
          except FileNotFoundError:
              cur_header, current = [], []

          # Committed baseline at the target repo's HEAD.
          base_run = subprocess.run(
              ["git", "-C", "../..", "show", "HEAD:regression/test_models/failed.csv"],
              capture_output=True, text=True)
          has_baseline = base_run.returncode == 0
          base_header, baseline = read_csv(base_run.stdout) if has_baseline else ([], [])

          def file_of(row, header):
              if header and "file" in header:
                  idx = header.index("file")
                  return row[idx] if len(row) > idx else ""
              return row[0] if row else ""

          # Keep a representative full row per failing file for readable output.
          cur_rows = {}
          for r in current:
              cur_rows.setdefault(file_of(r, cur_header), r)

          cur_files = Counter(file_of(r, cur_header) for r in current)
          base_files = Counter(file_of(r, base_header) for r in baseline)

          new_failures = sorted((cur_files - base_files).elements())
          resolved = sorted((base_files - cur_files).elements())
          preexisting = sorted((cur_files & base_files).elements())

          print(f"Failing models in {repo} — current: {len(list(cur_files.elements()))}, "
                f"baseline: {len(list(base_files.elements()))}")
          if not has_baseline:
              print("  (no failed.csv at the target repo's HEAD — every failure counts as new)")
          print(f"  pre-existing (blessed): {len(preexisting)}")
          print(f"  resolved since baseline: {len(resolved)}")
          print(f"  NEW: {len(new_failures)}")

          if resolved:
              print("\nResolved (no longer failing — drops from failed.csv on bless):")
              for name in resolved:
                  print(f"  - {name}")

          if new_failures:
              print(f"\n::error::{repo} has NEW regression failures "
                    "(not in the blessed baseline) — this rc is bad.")
              print("New failures (file,code,signal):")
              for name in new_failures:
                  print("  " + ",".join(cur_rows.get(name, [name])))
              sys.exit(1)

          print("\nNo new failures. Pre-existing known-failers do not block the rc.")
          EOF

      # --- IN-JOB PAIRING (design/new/perf-run-comparability.md) ---
      #
      # WHY. Everything below this point used to compare `engine2` — the
      # corpus this run just timed — against `engine1`, a column of numbers a
      # PREVIOUS run froze into the committed snapshot, on a machine nobody
      # recorded. Run 33128910045 was re-run, so its two attempts are the same
      # workflow, the same commit and the same runner label; their bless
      # commits (4d2b174, 7d7cf39) differ in the two perf CSVs and in NOTHING
      # else — every digest file is byte-identical, and `engine1TotalTimeMs`
      # matches on all 97 rows. Yet all 97 models were faster on attempt 2, by
      # a median 13.66%, 87% of them by more than 10%. The regression that
      # same delta was reporting had a median of 9.40%. The signal was
      # smaller than the noise.
      #
      # It is not contention: bucketed by model duration the drift is flat
      # (-11.43% / -14.04% / -13.52% / -13.88% from 13 ms to 27.5 s,
      # correlation with log duration -0.009), which is a uniform machine
      # scale factor. The probe workflow found why —
      # `ubuntu-24.04-4vcpu-8gb-150gbssd` is a LABEL, not a machine: six VMs
      # came back as AMD EPYC 7763, AMD EPYC 9V74 and Intel Xeon Platinum
      # 8370C, with an 11.24% CV of job means and a 32.8% max/min spread.
      # Two engines timed on ONE machine in ONE job divide that factor out
      # exactly, leaving a floor of 0.13-0.24% on the corpus aggregate and
      # ~1.4% per model (A/A null test, run 33192612782).
      #
      # WHICH PIN. The same predecessor the cross-run delta already uses —
      # `findPreviousSnapshot()` in scripts/bless_perf_snapshot.cjs, i.e. the
      # newest committed `conway<version>-ci_<repo>` sorting strictly below
      # this release, ordered by scripts/version_order.cjs.
      # scripts/resolve_previous_pin.cjs delegates to that function rather
      # than re-deriving the choice, so the paired delta and the cross-run
      # delta can never describe different comparisons under the same column
      # layout.
      #
      # WHERE THE ENGINE COMES FROM. The published npm package at that
      # version, running ITS OWN `ifc_regression_batch_main.js`. That keeps
      # both halves in the SAME HARNESS — the regression child, not
      # headless-three — which is what stops gen_delta_csv.cjs withholding
      # every measurement column as `crossHarness` (see its MEASUREMENT_COLUMNS
      # header). This is also why the workflow-header rule "do NOT install the
      # published package instead of building from source" is not violated
      # here: that rule protects the BLESSED DIGESTS, which must be
      # byte-reproducible by a later smoke run. Nothing this pass produces is
      # blessed — its digests go to a scratch folder and are deleted, and only
      # its perf CSV survives.
      #
      # WHAT PAIRING DOES NOT FIX. It cancels the machine, not a change of
      # methodology. If the previous pin predates the #554 settle, the #562
      # `totalTimeMs` redefinition or the #557 engine-init move, the paired
      # delta carries that step exactly as the cross-run delta did. Those
      # boundaries are enumerated in design/new/perf-measurement.md
      # §"Changelog of methodology changes".
      #
      # continue-on-error for the same reason the passes below carry it: an
      # unreadable benchmarks/ or a malformed directory name must cost the
      # release its paired delta, not its re-bless PR. A failed step publishes
      # no outputs, so `found` is unset and the install step skips.
      - name: Resolve the previous pin to pair against
        id: pin
        if: ${{ success() && (github.event.inputs.perf_pair || 'full') != 'off' }}
        continue-on-error: true
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ matrix.target.repo }}
        run: |
          # Same rc-tag gate the bless step applies: a dispatch from `main`
          # has no release version, so it has nothing to name a predecessor
          # relative to and pairing is meaningless there.
          case "$REF_NAME" in
            rc-*) VERSION="${REF_NAME#rc-}" ;;
            *)
              echo "::notice::Ref '$REF_NAME' is not an rc-* tag; skipping the paired pass."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          node scripts/resolve_previous_pin.cjs models "$VERSION" "${REPO_NAME##*/}" \
            >> "$GITHUB_OUTPUT"

      # Installed into its own directory, with --no-save and no package.json of
      # ours, so nothing about this can perturb the tree that produced the
      # blessed pass. `npm pack`-then-extract would work too; `npm install`
      # into a scratch prefix is fewer moving parts.
      #
      # continue-on-error, and a preflight on the batch entry point: a package
      # old enough to predate `ifc_regression_batch_main` or the `--perf` flag
      # would otherwise fail this step and, with it, every later step that
      # rides the implicit success() — including the re-bless PR that IS the
      # release's regression report. The paired delta is the most valuable
      # thing this job produces and still the most expendable: without it the
      # release falls back to the cross-run delta it has always had.
      - name: Install the previous pin (published package)
        id: pin_install
        if: ${{ success() && steps.pin.outputs.found == 'true' }}
        continue-on-error: true
        env:
          PIN_VERSION: ${{ steps.pin.outputs.npm_version }}
        run: |
          set -e
          PREV_ROOT="${GITHUB_WORKSPACE}/prev-engine"
          mkdir -p "$PREV_ROOT"
          cd "$PREV_ROOT"
          npm install --no-save --no-audit --no-fund \
            "@bldrs-ai/conway@${PIN_VERSION}"
          PKG="$PREV_ROOT/node_modules/@bldrs-ai/conway"
          BATCH="$PKG/compiled/src/ifc/ifc_regression_batch_main.js"
          if [ ! -f "$BATCH" ]; then
            echo "::warning::@bldrs-ai/conway@${PIN_VERSION} ships no ifc_regression_batch_main.js; the paired pass cannot run against it."
            exit 1
          fi
          if [ ! -d "$PKG/compiled/dependencies/conway-geom/Dist" ]; then
            echo "::warning::@bldrs-ai/conway@${PIN_VERSION} ships no conway-geom Dist; the paired pass cannot run against it."
            exit 1
          fi
          RESOLVED=$(node -p "require('$PKG/package.json').version")
          echo "Resolved @bldrs-ai/conway@$RESOLVED"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      # THE PAIRED PASS. Runs with cwd INSIDE the installed package, because
      # the batch spawns its per-model children as `node
      # ./compiled/src/{ifc,AP214E3_2010}/*_regression_main.js` — a path
      # relative to process.cwd(), not to the batch script. From the workspace
      # root that would silently spawn THIS release's children under the
      # previous release's batch driver, i.e. measure the wrong engine and
      # look like it worked. The package's own `compiled/dependencies/
      # conway-geom/Dist` comes along for the same reason: the engine imports
      # it by a path relative to the compiled module.
      #
      # `model_folder` is absolute (the corpus is in the workspace, not in the
      # package) but `output_folder` STAYS RELATIVE, for the reason spelled
      # out on the control pass below: runDiff ends every run with
      # `git diff -- <output_folder>` executed inside the model checkout, and
      # an absolute path makes git exit 128 with "is outside repository".
      # A relative `perf-paired-out` resolves to nothing there and diffs
      # empty, exactly as `perf-control-out` does.
      #
      # CONWAY_PERF_EXPOSE_GC='1' pins the same configuration the blessed pass
      # runs under. On a pin old enough to predate conway#554 the variable is
      # simply unread, and that pin's retention columns come out N/A and its
      # parse column carries the pre-settle methodology — a real limitation of
      # pairing against an old release, not a defect in this step.
      #
      # ORDER IS DELIBERATE: this runs AFTER the blessed pass, so the warmer
      # machine belongs to the PREVIOUS pin. Any residual warming therefore
      # makes the pin look faster and this release look slower — the delta is
      # biased toward flagging a regression, which is the safe direction for a
      # gate.
      #
      # NO PRE-WARM AND NO COUNTERBALANCING, and that is measured rather than
      # assumed. `totalTimeMs` contains the model file read (conway#562 moved
      # `loadStartMs` before `readFileSync`), so the pass-order page-cache
      # objection was real in principle. The A/A null test (run 33192612782)
      # says it is not there in practice: `actions/checkout` with LFS has
      # already written the whole corpus through the page cache before pass 1
      # (vmtouch: 100% resident, 7G/7G, on a runner with 16 GB despite the
      # `8gb` label), and a deliberately evicted pass costs +0.13% of corpus
      # total and 0.000% on the median model. A discarded pre-warm pass would
      # cost a full ~5 min public / ~20 min private against the 90-minute cap
      # to remove that. See design/new/perf-run-comparability.md Evidence 4.
      - name: Paired perf pass (previous pin, same machine)
        id: paired
        if: ${{ success() && steps.pin_install.outcome == 'success' }}
        timeout-minutes: 35
        continue-on-error: true
        env:
          CONWAY_PERF_EXPOSE_GC: '1'
          PERF_PAIR: ${{ github.event.inputs.perf_pair || 'full' }}
          PKG: ${{ steps.pin_install.outputs.pkg }}
        run: |
          set -e
          # `smoke` narrows the paired gate to regression/smoke_models.txt.
          # Same exclude-regex construction build.yml's smoke job uses: the
          # batch CLI has no include list, and the regex must be
          # extension-anchored so the directory walk is not cut off (the walk
          # applies the same regex to directories).
          EXCLUDE='sp-.*\.ifc|cg4.*-cylinder\.stp'
          if [ "$PERF_PAIR" = "smoke" ]; then
            EXCLUDE=$(python3 - <<'EOF'
          import re
          names = [l.strip() for l in open('regression/smoke_models.txt')
                   if l.strip() and not l.strip().startswith('#')]
          assert names, 'smoke_models.txt selected no models'
          alts = '|'.join(re.escape(n) for n in names)
          print(rf"^(?!.*/(?:{alts})$).*\.(?:[iI][fF][cC]|[sS][tT][eE][pP]|[sS][tT][pP])$")
          EOF
          )
            echo "Pairing over the smoke subset only."
          fi
          cd "$PKG"
          node --experimental-specifier-resolution=node \
            ./compiled/src/ifc/ifc_regression_batch_main.js \
            -e "$EXCLUDE" \
            --concurrency 1 \
            --timeout 300000 \
            --perf "${GITHUB_WORKSPACE}/perf-paired.csv" \
            "${GITHUB_WORKSPACE}/models" \
            perf-paired-out \
            --parallel --mem-utilization 90
          rm -rf "$PKG/perf-paired-out"

      # --- The gc-off control pass (conway#554) — OPT-IN, DEFAULT OFF ---
      #
      # THE COMPARISON HAS BEEN MADE. Run 32601886424's public job executed
      # both passes on one runner: blessed (settle on) 5m15s, control (settle
      # off) 5m06s — the settle costs about +2.9% of pass wall-clock, on one
      # corpus, and does not move the timing columns it was feared to move.
      # The call off that measurement (Pablo, conway#554) is that the settle
      # is ALWAYS ON going forwards, so the control condition is no longer
      # something a release needs to re-measure every time. It now runs only
      # when the `perf_ab` dispatch input is set — see the input's comment at
      # the top of this file. That is why this step and the comparison below
      # both carry an `if:`, and why an rc tag runs ONE pass, not two.
      #
      # Everything below this line is why the pass is built the way it is, and
      # still applies on the runs where it is switched back on.
      #
      # The second half of an A/B whose only variable is whether the retention
      # settle runs. conway#554 defines the retention columns so that both of
      # their samples sit outside the timed region — baseline before the load,
      # retained sample after teardown — which makes "the settle costs no
      # timing" a property that can be MEASURED rather than asserted: identical
      # code, run once with `--expose-gc` reaching the children and once
      # without, must produce the same parse/geometry/total columns.
      #
      # WHY IT IS HERE AND NOT A SECOND rc RUN. The original plan was to tag,
      # run, flip the switch and run again. That does not work. Two
      # `run-ifc-regression` jobs an hour apart on near-identical code came out
      # with EVERY model faster in the later run, median 1.55x, and MB-Khaya's
      # totalTimeMs across three such runs read 8039 / 4745 / 7621 ms
      # (conway#554, comment 5381287618). The effect under test is ~1%, so a
      # between-run comparison measures which runner the job landed on and
      # nothing else. Both conditions therefore run in ONE job, sharing a
      # runner, a machine and a moment, so that scale factor cancels.
      #
      # WHAT THIS PASS MUST NOT TOUCH:
      #   - it writes its digests to `perf-control-out` in the workspace, NOT
      #     to models/regression/test_models, so the blessed baseline the
      #     previous steps produced is not overwritten by numbers taken under
      #     a configuration we do not ship;
      #   - its perf CSV is `perf-nogc.csv`, and only `perf.csv` is passed to
      #     bless_perf_snapshot.cjs below;
      #   - the failure gate and the zero-geometry gate above are NOT repeated
      #     — a second identical digest run yields no extra signal, and the
      #     re-bless PR carries the first pass's output only.
      #
      # THE OUTPUT PATH MUST STAY RELATIVE. The batch's runDiff ends every run
      # with `git diff -- <output_folder>` from inside the model checkout, and
      # nothing catches its rejection. A relative `perf-control-out` resolves
      # (to a path that does not exist) inside that repo and diffs to nothing,
      # exactly as the blessed pass's `models/regression/test_models` already
      # does from that cwd. An ABSOLUTE path makes git exit 128 with "is
      # outside repository", which fails this step. Verified both ways
      # locally.
      #
      # No new checkout: the corpus is already materialized in `models`, so
      # this doubles the perf compute and costs zero extra LFS bandwidth.
      #
      # THE `if:` SPELLS OUT `success()` DELIBERATELY. Actions inserts
      # `success()` implicitly only when an `if:` contains NO status function,
      # so the `perf_ab` test alone would still carry it —
      # but that behaviour is exactly the load-bearing kind that should not be
      # implicit here. The `success()` half is what makes a reddened rc skip
      # this: when the failure gate above failed, the release is already bad
      # and a methodology control is not worth another ~20 minutes of
      # large-runner time. It gets its chance on the re-run.
      #
      # WHY THE INPUT IS READ TWO WAYS. A `type: boolean` dispatch input
      # arrives as a real boolean in the typed `inputs` context and as the
      # string 'true'/'false' in the raw `github.event.inputs` payload, and
      # Actions' comparison rules make each test fail against the OTHER
      # representation (a boolean/string compare casts both to numbers, and
      # 'true' is NaN). Guessing wrong here fails SILENTLY — the A/B would
      # simply never run when someone ticked the box, and nothing would say
      # so. Neither could be verified without dispatching this workflow, which
      # needs REBLESS_TOKEN and both corpora, so both forms are tested. Either
      # one alone would work if the representation is what it is assumed to
      # be; together they do not depend on the assumption. On a tag push both
      # contexts are empty, both halves are false, and the step skips — which
      # is the path every release takes.
      #
      # continue-on-error for the mirror-image reason, and it still earns its
      # place now that this step is usually skipped: a SKIPPED step cannot
      # fail, so it changes nothing on the default path, but on a `perf_ab`
      # run every step after this one that carries no `if:` — dropping
      # changes.csv, the churn summary, and the re-bless PR that IS the
      # release's regression report — runs on the implicit success(), so
      # without this a control pass that timed out or crashed would silently
      # withhold the rc's entire deliverable. The control is the least
      # important thing in this job and must never be able to block the most
      # important.
      #
      # SAME 35-MIN CAP AS THE BLESSED PASS, for the same reason: this pass
      # IS a second full digest run over the same corpus, so it costs what
      # that one costs. Public, run 32601886424, shows them near-equal —
      # digest 5m15s, control 5m06s (the control is the cheaper half; it is
      # the one without the settle). Left at 20 it would have blown the same
      # cap the digest step blew, one step later and after another full LFS
      # pass.
      #
      # The cap stays at 35 even though this step is now usually skipped, and
      # it stays UNPROVEN on private: this pass has still never executed there
      # (the first two-pass rc died in the digest step above), so the only
      # private evidence is that a near-identical pass takes ~20 minutes. A
      # `perf_ab` run is deliberate and infrequent; sizing its cap down to
      # save minutes it does not spend would just re-run the failure this
      # workflow was fixed for, on the run where someone is trying to measure
      # something.
      - name: Control perf pass (CONWAY_PERF_EXPOSE_GC=0)
        if: ${{ success() && (inputs.perf_ab == true || github.event.inputs.perf_ab == 'true') }}
        timeout-minutes: 35
        continue-on-error: true
        env:
          CONWAY_PERF_EXPOSE_GC: '0'
        run: |
          node --experimental-specifier-resolution=node \
            ./compiled/src/ifc/ifc_regression_batch_main.js \
            -e "sp-.*\.ifc|cg4.*-cylinder\.stp" \
            --concurrency 1 \
            --timeout 300000 \
            --perf "${GITHUB_WORKSPACE}/perf-nogc.csv" \
            models \
            perf-control-out \
            --parallel --mem-utilization 90
          rm -rf "${GITHUB_WORKSPACE}/perf-control-out"

      # Summarize + upload the steady per-model perf the regen captured (one
      # model at a time, full cores). Runs even when the gate failed — a new
      # failure elsewhere shouldn't cost us the timing data — hence
      # `if: ${{ !cancelled() }}` (skips only on an explicit cancel). The top
      # slowest rows go to the job summary; the full CSV is an artifact.
      - name: Summarize steady conway-native perf
        if: ${{ !cancelled() }}
        run: |
          PERF="${GITHUB_WORKSPACE}/perf.csv"
          echo "### Steady conway-native perf (${{ matrix.target.repo }}, --concurrency 1)" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$PERF" ]; then
            echo "_No perf.csv produced._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$PERF" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1], newline="")))
          def ms(r):
              try: return float(r.get("totalTimeMs") or 0)
              except ValueError: return 0.0
          rows.sort(key=ms, reverse=True)
          print(f"\n{len(rows)} models timed. Top 15 by total time:\n")
          print("| model | parse ms | geometry ms | total ms | RSS MB |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for r in rows[:15]:
              print(f"| {r.get('file','')} | {r.get('parseTimeMs','')} | "
                    f"{r.get('geometryTimeMs','')} | {r.get('totalTimeMs','')} | "
                    f"{r.get('rssMb','')} |")
          EOF

      # Difference the two passes and put the answer in the job summary, where
      # "did the settle move the timing columns, and by how much against the
      # scatter between models" is readable without downloading anything.
      #
      # Gated on the same `perf_ab` input as the control pass, so the two move
      # together: with the A/B off there is no second pass and nothing to
      # difference, and an ungated compare step would print a "not run" panel
      # into every release's summary for a question that is settled. The
      # missing-CSV branch below is kept anyway — on a `perf_ab` run the
      # control pass is continue-on-error, so it can be enabled and still
      # produce no perf-nogc.csv. `!cancelled()` rather than `success()` for
      # the same reason as the summary step above: a reddened gate elsewhere
      # should not cost the comparison, and when the gate is what reddened,
      # the control pass skipped and this reports exactly that.
      #
      # continue-on-error, and the script itself never exits non-zero on a
      # finding: this runs BEFORE the steps that bless the snapshot and open
      # the re-bless PR, both of which are gated on the steps before them
      # succeeding. A methodology check must not be able to withhold the
      # release's regression report. An A/B that came out invalid (the control
      # pass measured retention, i.e. the env switch never reached the
      # children) is reported as a ::warning:: and said plainly in the table
      # header instead.
      - name: Compare the two perf passes
        if: ${{ !cancelled() && (inputs.perf_ab == true || github.event.inputs.perf_ab == 'true') }}
        continue-on-error: true
        run: |
          PERF="${GITHUB_WORKSPACE}/perf.csv"
          CONTROL="${GITHUB_WORKSPACE}/perf-nogc.csv"
          if [ ! -f "$PERF" ] || [ ! -f "$CONTROL" ]; then
            echo "### GC-settle A/B (${{ matrix.target.repo }})" >> "$GITHUB_STEP_SUMMARY"
            echo "_Not run: perf_ab was set, but the control pass produced no perf-nogc.csv — it failed, timed out, or the rc's failure gate skipped it._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/perf_ab_compare.cjs \
            "$PERF" "$CONTROL" \
            "${GITHUB_WORKSPACE}/perf-gc-ab.md" \
            "${GITHUB_WORKSPACE}/perf-gc-ab.csv" \
            --label "${{ matrix.target.repo }}"
          cat "${GITHUB_WORKSPACE}/perf-gc-ab.md" >> "$GITHUB_STEP_SUMMARY"

      # Both passes' CSVs plus the joined per-model comparison. Missing paths
      # only warn in upload-artifact@v4 as long as one matches, so a skipped
      # control pass still uploads the blessed perf.csv — which since the A/B
      # became opt-in is the NORMAL case, not the degraded one: on a release
      # this uploads perf.csv and warns about the other three. The `if:` gates
      # on perf.csv specifically for that reason; do not tighten it to require
      # the A/B files, and do not set if-no-files-found: error here.
      - name: Upload steady perf CSVs
        if: ${{ !cancelled() && hashFiles('perf.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-serial-${{ matrix.target.name }}-${{ github.run_id }}
          path: |
            perf.csv
            perf-paired.csv
            perf-nogc.csv
            perf-gc-ab.csv
            perf-gc-ab.md

      # Bless the run's perf numbers alongside the digests, and diff them
      # against the previous blessed snapshot.
      #
      # Until now the only durable record of a release's timings was the
      # perf-serial artifact above, which expires in 90 days, so a blessed
      # baseline had nothing to compare against its predecessor. This writes
      # perf.csv into the model repo under the same
      # `benchmarks/<engine>_<repo>/` convention the committed snapshots use
      # and reuses scripts/gen_delta_csv.cjs for the delta; see the header of
      # bless_perf_snapshot.cjs for the column mapping and the
      # conway-native-vs-headless-three harness boundary.
      #
      # ONLY THE BLESSED PASS REACHES HERE. `$PERF` is the workspace's
      # perf.csv, written by the digest regen under the shipped configuration.
      # The control pass's numbers live in perf-nogc.csv and are never passed
      # to this script, so a release's record cannot end up carrying timings
      # taken with the settle disabled.
      #
      # rc-* tags only. The blessed benchmark directory is named for a release
      # and is part of a release's record; an ad-hoc workflow_dispatch re-run
      # should not mint one. `!cancelled()` so a run that the failure gate
      # reddened still writes (and logs) its numbers — the PR step below stays
      # gated on success, so a bad rc still cannot bless anything.
      #
      # THE PAIRED CSV IS OPTIONAL HERE, and that is what keeps the release's
      # deliverable independent of the pairing experiment: `--paired` is passed
      # only when perf-paired.csv actually exists, and bless_perf_snapshot.cjs
      # warns and writes the cross-run delta alone when it does not. Every way
      # the paired pass can fail — no predecessor, npm unreachable, a pin too
      # old to carry the batch entry point, a step timeout — lands in that
      # branch, and so does the one failure that leaves a FILE behind: a pass
      # that lost per-model children and aggregated the survivors. See the
      # coverage check below.
      - name: Bless perf snapshot and delta
        # Named so the summary and PR-body step below can read this script's
        # own verdict on the paired gate — `paired` / `withheld` / `absent`,
        # plus the clause completing "withheld because ...". Nothing
        # downstream can re-derive the REASON from the files on disk.
        id: bless_perf
        if: ${{ !cancelled() }}
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ matrix.target.repo }}
          PIN_NPM_VERSION: ${{ steps.pin.outputs.npm_version }}
          PERF_PAIR: ${{ github.event.inputs.perf_pair || 'full' }}
        run: |
          PERF="${GITHUB_WORKSPACE}/perf.csv"
          if [ ! -f "$PERF" ]; then
            echo "No perf.csv produced; skipping the perf snapshot."
            exit 0
          fi
          case "$REF_NAME" in
            rc-*) VERSION="${REF_NAME#rc-}" ;;
            *)
              echo "::notice::Ref '$REF_NAME' is not an rc-* tag; skipping the blessed perf snapshot."
              exit 0
              ;;
          esac
          # An ARRAY, not a string: --corpus-exclude's value is a regex with
          # `*` and `|` in it, and an unquoted string expansion would let the
          # shell glob it before node ever sees it.
          PAIRED_ARGS=()
          PAIRED="${GITHUB_WORKSPACE}/perf-paired.csv"
          if [ -f "$PAIRED" ]; then
            # `-paired`, not `-ci`: these rows come from the published package
            # measured by THIS job, not from that release's own blessed
            # snapshot. Two files sharing a column layout must not also share
            # an engine label.
            PAIRED_ARGS=(--paired "$PAIRED"
              --paired-engine "conway${PIN_NPM_VERSION}-paired"
              --paired-scope "$PERF_PAIR")
            # WHICH MODELS THAT FILE HAD TO CONTAIN. Existence is not a test:
            # a per-model child that times out or is killed leaves no per-file
            # perf CSV, the batch aggregates the rows that survived and still
            # exits 0, so a truncated perf-paired.csv looks exactly like a
            # complete one from here. bless_perf_snapshot.cjs compares the
            # paired delta's row set against the models it was supposed to
            # cover and degrades to the cross-run delta on any shortfall.
            #
            # `--corpus-exclude` IS WHAT MAKES THAT COMPARISON INDEPENDENT.
            # The script derives the demand by walking `models` itself, and
            # this is the same exclude the regeneration step above hands the
            # batch, so the walk sees the same tree. It must not come from
            # either pass's output: both passes run the same batch driver and
            # share its failure modes, so a model whose child dies in BOTH is
            # missing from both CSVs and a demand read off either one is short
            # by exactly the models that went missing. The filesystem is the
            # only party here that did not run the passes. Keep this regex in
            # step with the `-e` on `Regenerate baseline digests`; if it
            # drifts, the walk over-collects and the gate degrades loudly
            # rather than narrowing quietly.
            #
            # `--paired-expected` NARROWS that demand under `smoke`, where the
            # paired pass was deliberately restricted to this list. Without
            # it the check would demand the whole corpus and degrade every
            # smoke run. It is a narrowing of the corpus walk, not a
            # substitute for it — an entry no corpus file matches is reported,
            # not dropped.
            PAIRED_ARGS+=(--corpus-exclude 'sp-.*\.ifc|cg4.*-cylinder\.stp')
            if [ "$PERF_PAIR" = "smoke" ]; then
              PAIRED_ARGS+=(--paired-expected regression/smoke_models.txt)
            fi
          else
            echo "::notice::No perf-paired.csv; writing the cross-run delta only."
          fi
          node scripts/bless_perf_snapshot.cjs \
            "$PERF" models "$VERSION" "${REPO_NAME##*/}" "${PAIRED_ARGS[@]}"

      # Put the gate's actual number in the job summary, and compose what the
      # re-bless PR says about it. Without this the paired delta exists only as
      # a file inside a PR in another repo, and the whole point of pairing is
      # that someone reads a percentage and believes it. Both distributions are
      # printed side by side on purpose: seeing the cross-run spread next to the
      # paired one is the fastest way to understand why only one of them is a
      # gate.
      #
      # BOTH SURFACES ARE RENDERED FROM WHAT IS ON DISK, not from an assumption
      # that pairing succeeded. This step used to print the gate paragraph, and
      # the PR body below used to promise "**two** deltas", whenever ANY delta
      # file summarized — so a release whose paired pass was withheld was told
      # to read a `paired` row that is not in the directory. That is not an edge
      # case: conway#633's live basename collision (`ifc/index.ifc` vs
      # `ifc/bldrs/index.ifc`) makes `withheld` the DEFAULT outcome of a
      # full-corpus release today, so the default messaging was the wrong one.
      # The `paired` verdict now comes from the `measurementBasis` column of
      # the files actually written, and the reason comes from the step output
      # bless_perf_snapshot.cjs sets — the only party that knows why.
      #
      # `!cancelled()` and a tolerant body for the same reason as the perf
      # summary above — a reporting step must never be able to withhold the
      # re-bless PR.
      - name: Summarize the paired delta
        id: paired_gate
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ matrix.target.repo }}
          # `withheld` (attempted, discarded) / `absent` (did not run) /
          # `paired`, and the clause completing "withheld because ...". Only
          # the bless script knows which; see reportPairedOutcome there. Empty
          # when that step exited before blessing, which is a fourth state and
          # is reported as unknown rather than guessed at.
          PAIRED_STATE: ${{ steps.bless_perf.outputs.paired-state }}
          PAIRED_REASON: ${{ steps.bless_perf.outputs.paired-reason }}
        run: |
          # The paragraph the re-bless PR body below uses to describe this
          # release's gate. Written to a file rather than straight to
          # $GITHUB_OUTPUT so that EVERY path out of this step leaves the PR
          # step a paragraph — including a crash inside the Python, which
          # `continue-on-error` would otherwise turn into an empty promise.
          # The seed value claims nothing.
          PARA="${GITHUB_WORKSPACE}/paired-gate.md"
          cat > "$PARA" <<'FALLBACK'
          **Whether this release has a paired performance gate could not be
          determined here** — the step that reads the blessed snapshot did not
          finish. The snapshot's own `README.md` states which case it is, in the
          same words; read that before treating any number in this diff as a gate.
          FALLBACK
          emit_paragraph() {
            {
              echo 'paragraph<<PARAGRAPH_EOF'
              cat "$PARA"
              echo 'PARAGRAPH_EOF'
            } >> "$GITHUB_OUTPUT"
          }
          trap emit_paragraph EXIT
          case "$REF_NAME" in
            rc-*) VERSION="${REF_NAME#rc-}" ;;
            *)
              echo "Not an rc-* tag; no snapshot to summarize."
              cat > "$PARA" <<'NOSNAPSHOT'
          **No perf snapshot was blessed by this run**, which was not triggered by
          an `rc-*` tag: the blessed benchmark directory is named for a release and
          a dispatch run has no release to name one after. This PR therefore carries
          digest churn only — there is no timing delta of any kind in it, paired or
          cross-run.
          NOSNAPSHOT
              exit 0
              ;;
          esac
          DIR="models/benchmarks/conway${VERSION}-ci_${REPO_NAME##*/}"
          if [ ! -d "$DIR" ]; then
            echo "No snapshot directory at $DIR."
            cat > "$PARA" <<'NODIR'
          **No perf snapshot directory was written for this release**, so this PR
          carries digest churn only — there is no timing delta of any kind in it,
          paired or cross-run. The `Bless perf snapshot and delta` step's log says
          why.
          NODIR
            exit 0
          fi
          python3 - "$DIR" "$PARA" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import csv, glob, os, statistics, sys

          snapshot = sys.argv[1]
          # The re-bless PR's paragraph, seeded by the shell above and
          # overwritten here once the files on disk have been read.
          paragraph_path = sys.argv[2]

          # WHOSE CORPUS THE A/A FLOOR WAS MEASURED ON. This step runs once
          # per matrix target, so the qualification below has to be chosen the
          # same way renderReadme()'s does in scripts/bless_perf_snapshot.cjs
          # — printed unconditionally it told a reader of the PUBLIC target's
          # summary that the only measured floor does not bound the very
          # corpus it was measured on. This literal and that file's
          # AA_NULL_CORPUS must agree; a test pins that they do.
          #
          # The discriminator is the repo's last path segment, matching how
          # the snapshot directory is named. matrix.target.name ('public' /
          # 'private') would be the exact one and is currently unused — worth
          # switching to if a target is ever added under another org, where
          # `<other-org>/test-models` would take the public branch here.
          AA_NULL_CORPUS = 'test-models'
          corpus = os.environ.get('REPO_NAME', '').rsplit('/', 1)[-1]

          # WHY there is no paired delta, when there is none. The presence of
          # one is decided below from the files themselves; this only supplies
          # the reason, and the two vocabularies are the README's: `withheld`
          # is "attempted and its result discarded", `absent` is "did not
          # run". They are different claims about a release.
          paired_state = os.environ.get('PAIRED_STATE', '').strip()
          paired_reason = os.environ.get('PAIRED_REASON', '').strip()


          def pct(row):
              """The totalTimeMs percentage change as a float, or None."""
              raw = (row.get('totalTimeMsPercentageChange') or '').strip()
              if not raw or raw.upper() == 'N/A':
                  return None
              try:
                  return float(raw.rstrip('%'))
              except ValueError:
                  return None


          def summarize(path):
              """A delta file's basis and its distribution of timing changes.

              The basis is read whether or not the file carries any numbers:
              it is what says which comparison this is, and a `paired` file
              whose every row is N/A still exists and still has to be
              reported as what it is rather than silently dropped.
              """
              with open(path, newline='') as handle:
                  rows = list(csv.DictReader(handle))
              basis = (rows[0].get('measurementBasis') or '?') if rows else '?'
              values = sorted(v for v in (pct(r) for r in rows) if v is not None)
              if not values:
                  return {'basis': basis, 'n': 0,
                          'median': None, 'p10': None, 'p90': None}
              # p10/p90 by index rather than statistics.quantiles: n can be
              # smaller than the 10 quantiles that call requires (a smoke-scope
              # pairing is ~12 rows) and it raises rather than degrading.
              lo = values[int(0.10 * (len(values) - 1))]
              hi = values[int(0.90 * (len(values) - 1))]
              return {
                  'n': len(values),
                  'median': statistics.median(values),
                  'p10': lo,
                  'p90': hi,
                  'basis': basis,
              }


          def why_no_paired():
              """One sentence naming which of the no-gate cases this is.

              The first case is decided by the files, the rest by the bless
              script's own verdict: a `paired` file that landed with nothing
              measurable in it is not something the script can report, since
              from where it stands it wrote the delta successfully.
              """
              if paired_file:
                  return ('A `paired` delta WAS produced, and every one of its '
                          'rows is `N/A` on both sides — a file with nothing in '
                          'it to gate on.')
              if paired_state == 'withheld' and paired_reason:
                  return ('A paired pass was attempted and its result was '
                          'discarded — withheld because ' + paired_reason + '.')
              if paired_state == 'withheld':
                  return ('A paired pass was attempted and its result was '
                          'discarded; the `Bless perf snapshot and delta` step '
                          'logs why.')
              if paired_state == 'absent':
                  return 'The paired pass did not run.'
              return ('Whether a paired pass ran at all is not recorded here; '
                      "the snapshot's `README.md` says which case it is.")


          print(f"### conway-to-conway timing delta ({os.path.basename(snapshot)})")
          print()
          print("| file | basis | n | p10 | median | p90 |")
          print("| --- | --- | --- | --- | --- | --- |")

          found = False
          # A `paired` file that landed AND carries at least one timing. Both
          # halves matter: `found` says only that some delta summarized, and
          # under a withheld pairing the surviving cross-run file makes it
          # true — which is exactly how this summary came to tell readers to
          # look for a `paired` row that was never written.
          paired = False
          # A `paired` file landed, with or without a usable number in it. Kept
          # apart from `paired` so an all-N/A pairing is reported as the file
          # it is rather than as one that was never written.
          paired_file = False
          paired_n = 0
          for path in sorted(glob.glob(os.path.join(snapshot, 'conway*_delta.csv'))):
              stats = summarize(path)
              found = True
              if stats['basis'] == 'paired':
                  paired_file = True
                  if stats['n'] > 0:
                      paired = True
                      paired_n = stats['n']
              cells = ('| – | – | – |' if stats['n'] == 0 else
                       f"| {stats['p10']:+.2f}% | **{stats['median']:+.2f}%** | "
                       f"{stats['p90']:+.2f}% |")
              print(f"| `{os.path.basename(path)}` | **{stats['basis']}** | "
                    f"{stats['n']} {cells}")

          print()
          if paired:
              print("Read the **`paired`** row's MEDIAN: both engines were timed in "
                    "this job on this machine, and an A/A null test of that "
                    "configuration puts the median's floor under ~0.75% "
                    "([run 33192612782](https://github.com/bldrs-ai/conway/actions/"
                    "runs/33192612782)).")
              print()
              print(f"**Its `n` is {paired_n} — the models that carry a timing on "
                    "both sides, not the models the delta has a row for.** A "
                    "regression child writes a perf row on its failure paths too, "
                    "so a model neither engine could load reaches the paired file "
                    "with `N/A` in every timing column and is outside this median. "
                    "The snapshot's `README.md` names them.")
              print()
              print("**The p10/p90 columns beside it are the noise floor, not engine "
                    "signal.** The same A/A test measured a PER-MODEL floor of ~1.4% "
                    "median absolute change with p10/p90 near -3%/+4%: differencing an "
                    "engine against itself, 10 of 97 models moved more than 5%. Treat a "
                    "per-model move below ~5% as a lead to re-run, not a regression.")
              print()
              # The null test runs on bldrs-ai/test-models only. This summary is
              # printed for whichever matrix target ran, so the qualification has
              # to travel with the numbers rather than be inferred from them.
              if corpus == AA_NULL_CORPUS:
                  print("_Those floors were measured on **this** corpus "
                        "(`bldrs-ai/test-models`, 97 of its 99 walked models, "
                        "at `baf0f87d`) — same repo, same runner label, same "
                        "harness. What is not established is the model set: "
                        "the null test pinned that commit and this job checks "
                        "the target out at its default branch, so models added "
                        "or removed since it are outside what was measured. "
                        "The snapshot's README names the commit this run "
                        "blessed._")
              else:
                  print("_Those floors were measured on the **public** corpus "
                        "(`bldrs-ai/test-models`, 97 of its 99 walked models), "
                        "not on this one. For a private-corpus release they are "
                        "the only measured floor anyone has, not a bound on "
                        "this run: see conway's "
                        "`design/new/perf-run-comparability.md` Evidence 4, "
                        "'What this does not bound'._")
              print()
              print("The `crossRun` row compares against a previous run on an unrecorded "
                    "machine and has a measured 13.66% median noise floor — it is a "
                    "lead at any scale. "
                    "See conway's `design/new/perf-run-comparability.md`.")
          elif found:
              print("**No `paired` delta with a timing in it was produced for this "
                    "release, so this release has no performance gate.** "
                    + why_no_paired())
              print()
              print("The only timings on this page are `crossRun`. A `crossRun` timing "
                    "column compares against a previous run on a machine nobody "
                    "recorded and has a measured 13.66% median noise floor, against a "
                    "9.40% median regression one such delta was reporting — the signal "
                    "was smaller than the noise. It is **explicitly not a gate**, and "
                    "being the only number on this page does not make it one. Read it "
                    "as a lead at any scale, and see conway's "
                    "`design/new/perf-run-comparability.md`.")
          else:
              print("_No conway-to-conway delta was produced for this release._")

          # THE RE-BLESS PR'S PARAGRAPH, from the same verdict. It is a
          # separate audience — the PR is read in the model repo, months
          # later, by someone who never opens this job — and it used to
          # promise "two deltas" and a `paired` median unconditionally.
          snapshot_dir = f"`benchmarks/{os.path.basename(snapshot)}/`"
          if paired:
              paragraph = (
                  f"{snapshot_dir} carries this run's steady per-model timings "
                  "plus **two** deltas against the previous release.\n"
                  "Read the `*_paired_delta.csv` one, and read its **median**: "
                  "both\nits engines were timed in the same job on the same "
                  "machine, and an\nA/A null test of that configuration puts the "
                  "median's floor under\n~0.75%. Its **p10/p90 tails are not "
                  "signal at per-model scale** —\nthe same test measured a ~1.4% "
                  "median per-model floor, with 10 of\n97 models moving more than "
                  "5% against an identical engine, so a\nsingle model under ~5% "
                  "is a lead to re-run rather than a\nregression. Both floors "
                  "were measured on the **public** corpus\n(97 of its 99 walked "
                  "models); on a private-corpus release they are\nthe best "
                  "evidence available rather than a measured bound on this\nfile, "
                  "and the snapshot's `README.md` says which case it is.\n"
                  f"That median is over **{paired_n} models** — the ones with a "
                  "timing on both\nsides. A model neither engine could load has a "
                  "row in the file and\n`N/A` in every timing column of it, so the "
                  "row count is not the\nsample size.\n\n"
                  "The plain `*_delta.csv` is the legacy cross-run\ncomparison, "
                  "kept only for continuity with the historical archive —\nits "
                  "`engine1` numbers come from a different run on a machine\n"
                  "nobody recorded, and that comparison has a measured 13.66% "
                  "median\nnoise floor. Every row states which it is in its\n"
                  "`measurementBasis` column. That directory's `README.md` says "
                  "all\nof this on its face; read it before differencing anything "
                  "here\nagainst an older snapshot.")
          elif found:
              paragraph = (
                  f"{snapshot_dir} carries this run's steady per-model timings "
                  "and no\nusable paired delta.\n\n"
                  "**This release has no performance gate.** " + why_no_paired() +
                  " A paired delta is\nthe only conway-to-conway comparison whose "
                  "two engines were timed in one\njob on one machine, and it is "
                  "the only one this workflow will call a gate.\n\n"
                  "What is here instead is the legacy cross-run delta, kept for "
                  "continuity\nwith the historical archive: its `engine1` numbers "
                  "come from a different\nrun on a machine nobody recorded, and "
                  "that comparison has a measured\n13.66% median noise floor "
                  "against a 9.40% median regression it was\nreporting. Read it "
                  "as a lead at any scale — **not** as a gate, and not as\none "
                  "merely because it is the only delta in this diff. Every row "
                  "states\nwhich it is in its `measurementBasis` column, and that "
                  "directory's\n`README.md` says all of this on its face.")
          else:
              paragraph = (
                  f"{snapshot_dir} carries this run's steady per-model timings "
                  "and **no**\ndelta at all: no previous blessed snapshot was "
                  "found to compare against,\nso neither a paired nor a cross-run "
                  "comparison was produced. This release\nhas no performance "
                  "gate. The directory's `README.md` says why.")

          with open(paragraph_path, 'w') as handle:
              handle.write(paragraph + '\n')
          EOF

      # The batch always writes regression/test_models/changes.csv via a git
      # diff whose pathspec is relative to the model folder, so under this
      # layout it resolves to nothing and the file comes out empty. It's a
      # throwaway diff artifact, NOT part of the blessed baseline (main/errors/
      # failed + the per-model digests are). Restore the committed copy if there
      # is one, else drop the empty new file, so the PR carries only real churn.
      - name: Drop the derived changes.csv
        run: |
          cd models
          git checkout -- regression/test_models/changes.csv 2>/dev/null \
            || rm -f regression/test_models/changes.csv

      # Summarize the churn in the job log before opening the PR.
      - name: Summarize baseline changes
        run: |
          cd models
          echo "### Re-bless diff for ${{ matrix.target.repo }}" >> "$GITHUB_STEP_SUMMARY"
          CHANGED=$(git status --porcelain -- regression/test_models benchmarks | wc -l | tr -d ' ')
          echo "Changed baseline files: ${CHANGED}" >> "$GITHUB_STEP_SUMMARY"
          git -c color.ui=never diff --stat -- regression/test_models benchmarks | tail -40 >> "$GITHUB_STEP_SUMMARY" || true

      # The bless PR names the release it blesses, not just the ref that
      # triggered it: on an `rc-*` tag the version is what the tag carries
      # (`rc-1.564.1548` -> `1.564.1548`), and the short SHA disambiguates a
      # version that gets re-cut after a bad rc. `workflow_dispatch` has no rc
      # version at all — `ref_name` is a branch there ('main'), so it stands in
      # for the version rather than leaving the title half-empty.
      - name: Compose the re-bless label
        id: rebless_label
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          case "$REF_NAME" in
            rc-*) VERSION="${REF_NAME#rc-}" ;;
            *)    VERSION="$REF_NAME" ;;
          esac
          echo "label=${VERSION} (${SHA:0:8})" >> "$GITHUB_OUTPUT"

      # Open (or update) a PR in the target repo with only the baseline diff.
      # add-paths scopes the commit to regression/test_models so nothing else
      # in the checkout (e.g. LFS smudge artifacts) can leak in.
      #
      # THE PERF PARAGRAPH IS INTERPOLATED, not written here. It used to be a
      # fixed block promising "**two** deltas" and telling the reader to read
      # the `paired` median — a promise this workflow cannot keep on the path
      # it takes by default, since conway#633's basename collision withholds
      # pairing on every full-corpus release today. `paired_gate` composes it
      # from the `measurementBasis` of the files actually written, so a
      # release with no gate says so in the PR that blesses it rather than
      # sending a reader to look for a row that is not there.
      - name: Open re-bless PR in ${{ matrix.target.repo }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REBLESS_TOKEN }}
          path: models
          # benchmarks/ carries the perf snapshot + delta written above.
          # Scoped rather than open-ended so nothing else in the checkout
          # (e.g. LFS smudge artifacts) can leak in.
          add-paths: |
            regression/test_models
            benchmarks
          branch: rebless/${{ github.run_id }}
          base: main
          # Subject matches the PR title; the full ref and SHA stay in the body
          # so nothing the old one-line message carried is lost.
          commit-message: |
            Bless regression baselines: ${{ steps.rebless_label.outputs.label }}

            conway ${{ github.ref_name }} @ ${{ github.sha }}
          title: "Bless regression baselines: ${{ steps.rebless_label.outputs.label }}"
          body: |
            Full-corpus digest regression for conway **`${{ github.ref_name }}`**
            ([`${{ github.repository }}@${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}),
            run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            **This diff is the release candidate's regression report.** Every
            changed digest is a model whose geometry differs from the last
            blessed baseline. No NEW parse/extract failures were detected (the
            generating workflow gates on failures added vs the committed
            `failed.csv`; pre-existing known-failers do not block the rc, and
            any that this run resolved drop out of `failed.csv` in this diff).
            Review the churn and merge to bless — from then on, per-PR smoke
            diffs in conway mean "this PR moved geometry", not accumulated
            drift.

            ${{ steps.paired_gate.outputs.paragraph }}

            Generated by conway's `rc-regression` workflow.

      # Same zero-geometry gate as the smoke job: a model that loads and emits
      # nothing exits 0 and writes no failed.csv row, so nothing else sees it
      # (#477 / #478). Anything not explicitly allowlisted, with an issue, is
      # new and fails the rc.
      #
      # Last step, `!cancelled()`, for the same reason as in build.yml: a gate
      # that exits 1 mid-job takes every later step with it, and here those
      # later steps are the rc's entire deliverable — the perf summary and the
      # re-bless PR whose diff IS the regression report. Blocking the report on
      # a finding the report is the evidence for is backwards; the re-bless PR
      # is human-reviewed and merged, and a red rc job is the signal not to
      # merge it. Reads the copy moved to the workspace earlier, since by now
      # the file is deliberately gone from the model checkout.
      - name: Fail on unexpected zero-geometry models
        if: ${{ !cancelled() }}
        run: |
          ZERO="${GITHUB_WORKSPACE}/zero_geometry.csv"
          MAIN=models/regression/test_models/main.csv
          ALLOW=regression/zero_geometry_allowlist.txt
          if [ ! -f "$ZERO" ]; then
            echo "No zero_geometry.csv produced."; exit 0
          fi
          python3 - "$ZERO" "$ALLOW" "$MAIN" <<'PYEOF'
          import csv, os, sys
          zero, allow, main = sys.argv[1], sys.argv[2], sys.argv[3]
          allowed = set()
          for line in open(allow, encoding='utf-8'):
              line = line.split('#', 1)[0].strip()
              if line:
                  allowed.add(line)
          rows = [r['file'] for r in csv.DictReader(open(zero, newline='', encoding='utf-8'))]
          unexpected = [f for f in rows if f not in allowed]
          for f in rows:
              print(f"zero geometry: {f}" + ("" if f in unexpected else "  (allowlisted)"))

          # Same anti-rot check as the smoke job; see build.yml for the
          # reasoning. It matters more here: this is the run that blesses.
          ran = set()
          if os.path.exists(main):
              ran = {r['file'] for r in csv.DictReader(open(main, newline='', encoding='utf-8'))}
          stale = sorted((allowed & ran) - set(rows))

          if unexpected:
              print("::error::Models loaded but produced NO geometry and are not allowlisted:")
              for f in unexpected:
                  print(f"::error::  {f}")
          if stale:
              print("::error::Allowlisted models that now DO produce geometry - "
                    "delete their lines from regression/zero_geometry_allowlist.txt:")
              for f in stale:
                  print(f"::error::  {f}")
          if unexpected or stale:
              sys.exit(1)
          print(f"{len(rows)} zero-geometry model(s), all allowlisted; "
                f"{len(allowed & ran)} allowlist entr(ies) exercised and still empty.")
          PYEOF
