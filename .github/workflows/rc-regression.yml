name: RC regression (full corpus + baseline bless)

# The once-per-release full regression pass. Pushing an `rc-*` tag runs the
# digest batch over the ENTIRE public and private corpora with conway's
# PINNED toolchain, gates on failures, and opens a baseline PR in each
# test-models repo whose diff IS the release's regression report:
#
#   - NEW failed.csv rows        -> this workflow goes RED, the rc is bad. A
#                                   model already failing in the committed
#                                   baseline (a known-failer that still loads
#                                   in prod, or a not-yet-fixed input) does NOT
#                                   block the rc — otherwise no rc could ever go
#                                   green while any known-failer exists.
#   - digest/errors churn        -> shows up as the baseline PR diff; review
#                                   it (with the per-PR visual evidence that
#                                   motivated the change) and MERGE to bless.
#   - merging the baseline PRs   -> baselines now track this release exactly,
#                                   so per-PR smoke diffs mean "this PR moved
#                                   geometry", not accumulated drift.
#
# Per-PR CI (build.yml run-ifc-regression) runs only the smoke subset in
# regression/smoke_models.txt — this workflow is where the whole corpus gets
# tested, once per blessed release candidate.
#
# WHY IT MIRRORS run-ifc-regression's BUILD
# The blessed digests MUST be byte-reproducible by a later PR's smoke run, or
# the baseline drifts again immediately. That job builds conway from source
# and restores the WASM Dist from a cache keyed on the conway-geom submodule
# SHA. This workflow restores the SAME cache (same key) and runs the SAME
# batch CLI. Do NOT switch this to install the published npm package instead —
# it can lag main's conway-geom SHA and reintroduce drift.
#
# PREREQUISITE — secret `REBLESS_TOKEN` (stored in conway's repo secrets):
# a PAT/App token with `contents: write` + `pull_requests: write` on BOTH
# bldrs-ai/test-models and bldrs-ai/test-models-private. GITHUB_TOKEN is
# conway-scoped and cannot push to those repos. Also requires LFS bandwidth
# budget on the test-models org — this workflow materializes the full model
# set fresh, once per rc.

on:
  push:
    tags:
      - 'rc-*'
  # On-demand runs (e.g. re-bless after fixing one model, or public-only)
  # without cutting a new tag.
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which corpora to run'
        type: choice
        options: [both, public, private]
        default: both

env:
  EMSDK_VERSION: '6.0.2'
  EMSDK_CACHE_FOLDER: 'cache/emsdk'

jobs:
  # Build the matrix from the `targets` input. Done in a job (not a job-level
  # `if` on the matrix) because the `matrix` context is NOT available in a
  # job-level `if` — referencing it there is a workflow-validation error.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # Fail here (cheap runner) before the 8-vcpu matrix jobs allocate, so a
      # missing secret doesn't burn large-runner minutes.
      - name: Fail fast if REBLESS_TOKEN missing
        env:
          TOKEN_PRESENT: ${{ secrets.REBLESS_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::REBLESS_TOKEN secret is not set. It needs contents:write + pull_requests:write on bldrs-ai/test-models and bldrs-ai/test-models-private."
            exit 1
          fi

      - name: Pick target repos
        id: pick
        env:
          # Empty on rc-* tag pushes (no dispatch inputs) -> both corpora.
          TARGETS: ${{ github.event.inputs.targets || 'both' }}
        run: |
          PUBLIC='{"name":"public","repo":"bldrs-ai/test-models"}'
          PRIVATE='{"name":"private","repo":"bldrs-ai/test-models-private"}'
          case "$TARGETS" in
            public)  MATRIX="[$PUBLIC]" ;;
            private) MATRIX="[$PRIVATE]" ;;
            *)       MATRIX="[$PUBLIC,$PRIVATE]" ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Re-blessing: $MATRIX"

  rebless:
    needs: setup
    # One entry per selected test-models repo; public and private run in
    # parallel. The list is already filtered by the setup job, so no per-job
    # skipping is needed.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.matrix) }}
    # Same heavy runner as run-ifc-regression: the batch drives the MT WASM
    # engine over ~100 models with --parallel and reserves multi-GB shared.
    runs-on: ubuntu-22.04-8vcpu-32gb-300gbssd
    timeout-minutes: 90
    steps:
      # --- Build conway from source (identical to run-ifc-regression) ---
      - name: Checkout conway
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same cache key as build.yml -> hits the Dist that job populated for
      # this conway-geom SHA, so the digests match run-ifc-regression exactly
      # and (on a hit) no WASM rebuild happens.
      - name: Restore WASM build cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      # --- WASM build fallback on cache miss (mirrors build.yml) ---
      - name: Restore GENie cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        id: genie-cache
        uses: actions/cache@v4
        with:
          path: bin/linux/genie
          key: genie-${{ runner.os }}

      - name: Build GENie
        if: steps.wasm-cache.outputs.cache-hit != 'true' && steps.genie-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/bkaradzic/GENie.git GENie
          (cd GENie && make)
          mkdir -p bin/linux
          cp GENie/bin/linux/genie bin/linux/genie

      - name: Cache Emscripten system libraries
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK_CACHE_FOLDER }}
          key: ${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}

      - name: Export EMSDK paths for subsequent steps
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          EMSDK=$(which em++ | sed 's|upstream/emscripten/em++||')
          EMSCRIPTEN=$(which em++ | sed 's|/em++||')
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSCRIPTEN=$EMSCRIPTEN" >> "$GITHUB_ENV"

      - name: Extract WASM build dependencies
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn extract-wasm-dependencies

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build-GHA-all

      - name: TypeScript build
        run: yarn build-incremental

      # --- Regenerate the target repo's baseline ---
      # Checkout the models repo into `models` with LFS materialized (the batch
      # reads the real model bytes, not pointer stubs). REBLESS_TOKEN so the
      # later create-pull-request can push a branch to it.
      - name: Checkout ${{ matrix.target.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          token: ${{ secrets.REBLESS_TOKEN }}
          lfs: true
          path: models

      # Regenerate every digest CSV (+ main/errors/failed) in place, exactly as
      # run-ifc-regression does: same exclude, same parallelism. `-t HEAD`
      # points the batch's changes summary at the current committed baseline.
      # NOT --dryrun: dryrun git-checkouts the output folder back, discarding
      # the regeneration — we want it to persist so the PR carries it.
      #
      # --concurrency 2 (down from the os.cpus() default): each child is itself
      # multi-threaded, so one child per core heavily oversubscribes the CPUs.
      # The largest models' wall-clock then balloons to several times their
      # standalone time — the biggest private model parses + fully extracts in
      # ~80s alone but blew past the old 150s per-model timeout under that
      # contention, landing in failed.csv as a bogus timeout (empty
      # code/signal), not a real crash. Two children at a time keep the cores
      # busy without starving the big models; --timeout 600000 (10 min) is
      # insurance on top of that. Both stay well inside the 90-min job budget.
      # Digests are deterministic regardless of concurrency, so this changes
      # only reliability, not the blessed output.
      - name: Regenerate baseline digests
        run: |
          node --experimental-specifier-resolution=node \
            ./compiled/src/ifc/ifc_regression_batch_main.js \
            -e "sp-.*\.ifc" \
            -t HEAD \
            --concurrency 2 \
            --timeout 600000 \
            models \
            models/regression/test_models \
            --parallel --mem-utilization 90

      # Hard gate: fail the rc only on NEW parse/extract failures — models that
      # were NOT already failing in the committed baseline. Pre-existing,
      # already-blessed failures (a model that crashes here but loads in prod,
      # or a known-bad input we haven't fixed yet) must NOT block every future
      # rc; gating on failed.csv being non-empty means no rc can ever go green
      # while any known-failer exists.
      #
      # The baseline is the failed.csv committed at the target repo's HEAD — the
      # regeneration above overwrote the working copy in place, so `git show
      # HEAD:` still yields the pre-run committed set. The diff is keyed on the
      # `file` column, so a model is simply "failing" or not: robust to a
      # known-failer's exact exit code/signal wobbling between runs (e.g. an OOM
      # kill, which surfaces as an empty code/signal here). A brand-new failing
      # model reds the rc; resolved failures are reported (and drop out of
      # failed.csv in the baseline PR below) but never gate. Digest/errors churn
      # is likewise not gated here — it lands in the baseline PR diff, where a
      # human reviews and blesses it.
      - name: Fail on NEW regression failures
        run: |
          cd models/regression/test_models
          python3 - "${{ matrix.target.repo }}" <<'EOF'
          import csv, io, subprocess, sys
          from collections import Counter

          repo = sys.argv[1]

          def read_csv(text):
              rows = list(csv.reader(io.StringIO(text)))
              if not rows:
                  return [], []
              return rows[0], [r for r in rows[1:] if r]

          # Current (freshly regenerated) failed.csv.
          try:
              with open("failed.csv", newline="") as f:
                  cur_header, current = read_csv(f.read())
          except FileNotFoundError:
              cur_header, current = [], []

          # Committed baseline at the target repo's HEAD.
          base_run = subprocess.run(
              ["git", "-C", "../..", "show", "HEAD:regression/test_models/failed.csv"],
              capture_output=True, text=True)
          has_baseline = base_run.returncode == 0
          base_header, baseline = read_csv(base_run.stdout) if has_baseline else ([], [])

          def file_of(row, header):
              if header and "file" in header:
                  idx = header.index("file")
                  return row[idx] if len(row) > idx else ""
              return row[0] if row else ""

          # Keep a representative full row per failing file for readable output.
          cur_rows = {}
          for r in current:
              cur_rows.setdefault(file_of(r, cur_header), r)

          cur_files = Counter(file_of(r, cur_header) for r in current)
          base_files = Counter(file_of(r, base_header) for r in baseline)

          new_failures = sorted((cur_files - base_files).elements())
          resolved = sorted((base_files - cur_files).elements())
          preexisting = sorted((cur_files & base_files).elements())

          print(f"Failing models in {repo} — current: {len(list(cur_files.elements()))}, "
                f"baseline: {len(list(base_files.elements()))}")
          if not has_baseline:
              print("  (no failed.csv at the target repo's HEAD — every failure counts as new)")
          print(f"  pre-existing (blessed): {len(preexisting)}")
          print(f"  resolved since baseline: {len(resolved)}")
          print(f"  NEW: {len(new_failures)}")

          if resolved:
              print("\nResolved (no longer failing — drops from failed.csv on bless):")
              for name in resolved:
                  print(f"  - {name}")

          if new_failures:
              print(f"\n::error::{repo} has NEW regression failures "
                    "(not in the blessed baseline) — this rc is bad.")
              print("New failures (file,code,signal):")
              for name in new_failures:
                  print("  " + ",".join(cur_rows.get(name, [name])))
              sys.exit(1)

          print("\nNo new failures. Pre-existing known-failers do not block the rc.")
          EOF

      # The batch always writes regression/test_models/changes.csv via a git
      # diff whose pathspec is relative to the model folder, so under this
      # layout it resolves to nothing and the file comes out empty. It's a
      # throwaway diff artifact, NOT part of the blessed baseline (main/errors/
      # failed + the per-model digests are). Restore the committed copy if there
      # is one, else drop the empty new file, so the PR carries only real churn.
      - name: Drop the derived changes.csv
        run: |
          cd models
          git checkout -- regression/test_models/changes.csv 2>/dev/null \
            || rm -f regression/test_models/changes.csv

      # Summarize the churn in the job log before opening the PR.
      - name: Summarize baseline changes
        run: |
          cd models
          echo "### Re-bless diff for ${{ matrix.target.repo }}" >> "$GITHUB_STEP_SUMMARY"
          CHANGED=$(git status --porcelain -- regression/test_models | wc -l | tr -d ' ')
          echo "Changed baseline files: ${CHANGED}" >> "$GITHUB_STEP_SUMMARY"
          git -c color.ui=never diff --stat -- regression/test_models | tail -40 >> "$GITHUB_STEP_SUMMARY" || true

      # Open (or update) a PR in the target repo with only the baseline diff.
      # add-paths scopes the commit to regression/test_models so nothing else
      # in the checkout (e.g. LFS smudge artifacts) can leak in.
      - name: Open re-bless PR in ${{ matrix.target.repo }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REBLESS_TOKEN }}
          path: models
          add-paths: regression/test_models
          branch: rebless/${{ github.run_id }}
          base: main
          commit-message: "Bless regression baselines (conway ${{ github.ref_name }} @ ${{ github.sha }})"
          title: "Bless regression baselines: conway ${{ github.ref_name }}"
          body: |
            Full-corpus digest regression for conway **`${{ github.ref_name }}`**
            ([`${{ github.repository }}@${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}),
            run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            **This diff is the release candidate's regression report.** Every
            changed digest is a model whose geometry differs from the last
            blessed baseline. No NEW parse/extract failures were detected (the
            generating workflow gates on failures added vs the committed
            `failed.csv`; pre-existing known-failers do not block the rc, and
            any that this run resolved drop out of `failed.csv` in this diff).
            Review the churn and merge to bless — from then on, per-PR smoke
            diffs in conway mean "this PR moved geometry", not accumulated
            drift.

            Generated by conway's `rc-regression` workflow.
