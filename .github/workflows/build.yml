name: CI

on:
  pull_request:
    # ready_for_review is what makes the draft gate on run-ifc-regression
    # usable: without it, flipping a draft to ready fires no event and the PR
    # would sit with no regression result until the next push.
    #
    # converted_to_draft is the other half of that gate, and it works by
    # cancellation: pushing a PR back to draft fires an event in the same
    # concurrency group below, so cancel-in-progress kills the run that is
    # mid-flight. Without it, a PR you have explicitly pulled back keeps
    # burning a runner slot to completion.
    #
    # Note what the replacement run does, since `build` here is ungated: it
    # re-runs `build`, then stops before the regression. Usually cheap: every
    # emsdk/GENie/emcc step is gated on the wasm cache key, so a hit means only
    # a conway-geom submodule bump pays a real compile. The exception is
    # withdrawing during a cold-cache build — the cancelled run never reaches
    # the save step, so the replacement pays the full emcc compile.
    #
    # Whether that is worth it depends on when you withdraw. During the
    # regression it clearly is: you stop the longer job and pay at most a
    # rebuild. During `build` it is pure loss — `run-ifc-regression` needs
    # `build`, so nothing had started yet and you have bought back nothing.
    # Not free the way it is in Share, where every job is gated and the
    # replacement run skips outright.
    #
    # reopened was missing before the draft gate landed. Leaving it out means
    # a reopened PR keeps whatever conclusions sat on its head SHA -- possibly
    # a `skipped` regression, which reads as passing -- with nothing to
    # re-run it.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    # Skip the heavy build + IFC regression on doc-only PRs. paths-ignore
    # skips the workflow only when EVERY changed file matches — a PR that
    # also touches code/config still runs the full suite. Push-to-main
    # (auto-publish) and rc-tag pushes (perf) are intentionally left
    # unfiltered below.
    # NOTE: if `build` / `run-ifc-regression` are *required* status checks
    # in branch protection, a path-skipped run reports nothing and the PR
    # waits forever — switch to a per-job `if:` gate instead (a skipped-by-if
    # job satisfies a required check; a path-skipped workflow does not).
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'docs/**'
  push:
    branches: [main]
    # Release-candidate tags trigger the EXTENDED suite (the perf-three-*
    # benchmarks). Those benchmarks used to run on every merge — the largest
    # CI cost line (~38 large-runner-min/merge, mostly the 24-min private H3
    # run) — but per-commit perf is redundant while perf is actively reviewed
    # per-model at PR time. Now a full perf sweep runs only when a human
    # blesses a prod-worthy point by pushing an `rc-*` tag. auto-publish's
    # own `<version>` tags start with the major segment (e.g.
    # 1.1556.546-g3eae7637) and do NOT match `rc-*`, so continuous-release
    # tagging never triggers this path.
    tags:
      - 'rc-*'
  # Manual runs from any branch (Actions > CI > Run workflow) so the
  # perf jobs — normally rc-tag only — can be exercised and debugged on a
  # branch without cutting a tag. auto-publish stays push:main-only.
  workflow_dispatch:

# Cancel superseded runs so a rapid series of pushes to the same PR doesn't
# leave N full build+regression(+visual-diff) pipelines running to completion
# in parallel on the shared runners — only the newest commit's result matters.
# Grouped by ref (refs/pull/<n>/merge is unique per PR) so PRs never cancel
# each other. cancel-in-progress is scoped to pull_request ONLY: push-to-main
# runs must run to completion — auto-publish tags + publishes to npm, and each
# main commit ships its own version, so cancelling a main run mid-publish (or
# skipping a commit's release) is not acceptable.
#
# Keep this keyed on the REF for push:main, not on github.sha, even though the
# ref key has a known cost. Because every main push shares one ref they all
# land in one group and run one at a time — and `cancel-in-progress: false`
# does not mean "never cancel": GitHub cancels a run still PENDING in a group
# when a newer one joins, so merging three commits inside one pipeline window
# drops the middle one's run and skips that commit's release.
#
# That is the lesser problem. The serialization is what keeps npm's `latest`
# pointing at the newest commit: auto-publish publishes with an unconditional
# `--tag latest` (see the publish step), so two main runs racing can land out
# of order and leave `latest` on the OLDER commit, shipping it to every
# consumer. Since conway#533 the version's minor segment is the commit count,
# so an out-of-order publish no longer *fails* — it just mis-points the tag.
#
# Same caveat for a dropped commit's release: re-running it later publishes a
# version below the one already on `latest` and, with `--tag latest`
# unconditional, drags the tag backwards. Skip the release, or make the
# publish step ordering-safe (which is what making these parallel needs
# anyway). Both tracked in conway#468.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EMSDK_VERSION: '6.0.2'
  EMSDK_CACHE_FOLDER: 'cache/emsdk'
  # Public test-models git ref to track. Resolved to a concrete commit SHA per
  # run (recorded in the PR comment + job summary) so the regression baseline is
  # reproducible without test-models having to cut tags. Override via the
  # repo/environment variable TEST_MODELS_REF (a branch, tag, or full commit SHA).
  TEST_MODELS_REF: ${{ vars.TEST_MODELS_REF || 'main' }}
  TEST_MODELS_PRIVATE_TAG: ${{ vars.TEST_MODELS_PRIVATE_TAG || 'main' }}

jobs:
  build:
    # Paid 150 GB SKU: emcc's working set does not fit the public
    # runner's 14 GB disk. 4 vCPU is enough (the old 2-vCPU image is
    # what failed the compile); disk is why this job stays billed.
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The compat/web-ifc constant tables are generated from the web-ifc
      # devDependency (scripts/gen-web-ifc-types.cjs). Regenerate and fail if
      # the committed files drift — catches a web-ifc bump that forgot
      # `yarn gen-web-ifc-types`, or a hand-edit of a generated file. Pure
      # JS + web-ifc, so it runs right after install (no WASM/build needed).
      - name: Check web-ifc tables are up to date
        run: |
          yarn gen-web-ifc-types
          git diff --exit-code -- src/compat/web-ifc/ifc2x4.ts src/compat/web-ifc/types-map.ts \
            || { echo "::error::Generated web-ifc tables are stale. Run 'yarn gen-web-ifc-types' and commit the result."; exit 1; }

      # --- WASM cache: keyed on conway-geom submodule SHA + EMSDK version.
      # On hit, the heavy WASM build (GENie + EMSDK + emcc) is skipped entirely.
      # The regression job depends on this job and consumes the same cache.
      - name: Restore WASM build cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      # --- GENie + EMSDK setup (skipped on WASM cache hit)
      - name: Restore GENie cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        id: genie-cache
        uses: actions/cache@v4
        with:
          path: bin/linux/genie
          key: genie-${{ runner.os }}

      - name: Build GENie
        if: steps.wasm-cache.outputs.cache-hit != 'true' && steps.genie-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/bkaradzic/GENie.git GENie
          (cd GENie && make)
          mkdir -p bin/linux
          cp GENie/bin/linux/genie bin/linux/genie

      - name: Cache Emscripten system libraries
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK_CACHE_FOLDER }}
          key: ${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}

      - name: Export EMSDK paths for subsequent steps
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          which em++
          em++ -v
          EMSDK=$(which em++ | sed 's|upstream/emscripten/em++||')
          EMSCRIPTEN=$(which em++ | sed 's|/em++||')
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSCRIPTEN=$EMSCRIPTEN" >> "$GITHUB_ENV"

      - name: Extract WASM build dependencies
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn extract-wasm-dependencies

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build-GHA-all

      # tsc --build always runs from scratch here. Earlier we cached
      # compiled/src + compiled/examples + tsbuildinfo, but that subset
      # left compiled/dependencies/conway-geom/index.js missing — the
      # buildinfo claimed everything was up to date and tsc skipped
      # recompiling the conway-geom shim, so the test runner couldn't
      # resolve '../../dependencies/conway-geom/index.js'. A correct TS
      # cache strategy can come back as a separate iteration.
      - name: TypeScript build (incremental)
        run: yarn build-incremental

      - name: Test
        run: yarn test

      - name: Lint
        run: yarn lint

      # --- Tier A: in-repo quick-check geometry goldens (data/ models) ---
      # A hermetic geometry gate that runs in `build` (no test-models clone, no
      # token) so it protects every PR including forks. Each data/ model's digest
      # is compared against a committed golden (data/<name>.csv):
      #   - golden present & matches -> pass
      #   - golden present & differs -> FAIL with a re-bless hint (the gate)
      #   - golden absent            -> warn + emit candidate, exit 0 (bootstrap)
      # Goldens must be produced by CI's pinned EMSDK toolchain to match, so the
      # first run uploads the candidate digests as an artifact; committing them
      # to data/ turns the gate on. Uses the same `ifc_regression_main.js -d`
      # the batch job spawns, so the digest format is identical, and WASM is
      # already loadable here (the jest `yarn test` step above exercises it via
      # the same conway-geom import).
      - name: Tier A quick-check geometry goldens (data/)
        run: |
          set -uo pipefail
          OUT="${GITHUB_WORKSPACE}/tierA-goldens"
          mkdir -p "$OUT"
          shopt -s nullglob
          status=0
          count=0
          # Cover every in-repo quick-check model; deriving the list from
          # data/*.ifc (vs a hard-coded set) means a newly added model is gated
          # as soon as its golden is committed, with no edit here.
          for f in data/*.ifc; do
            count=$((count + 1))
            m=$(basename "$f" .ifc)
            node --experimental-specifier-resolution=node \
              ./compiled/src/ifc/ifc_regression_main.js -d "$f" "$OUT/$m"
            cand="$OUT/$m.csv"
            golden="data/$m.csv"
            if [ ! -f "$cand" ]; then
              echo "::error::No digest produced for $f -- parsing or geometry extraction likely failed for this model (see log above)."
              status=1; continue
            fi
            if [ ! -f "$golden" ]; then
              echo "::warning::No golden for $f yet -- download the tierA-goldens artifact and commit $m.csv to data/$m.csv to enable gating."
              continue
            fi
            if diff -u "$golden" "$cand"; then
              echo "$f: geometry digest matches golden."
            else
              echo "::error::Geometry digest changed for $f. If intended, re-bless: replace data/$m.csv with $m.csv from this run's tierA-goldens artifact."
              status=1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No data/*.ifc quick-check models found."
            status=1
          fi
          exit $status

      - name: Upload Tier A digest candidates
        if: ${{ always() && hashFiles('tierA-goldens/*.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tierA-goldens-${{ github.run_id }}
          path: tierA-goldens/*.csv

  # ---------------------------------------------------------------------------
  # PR regression: digest batch, sharded, on free ubuntu-24.04.
  #
  # Ten shards max (see regression/shards/README.md):
  #   coverage-1..3  public small models (union = smoke_models.txt)
  #   psb, d3d, ilna, dowa, orbiter, blsn, hospital
  #                  one private headline model each
  #
  # A few-minute load gets its own machine so a regression there cannot
  # hide behind a short coverage batch. Skip-smudge + LFS-pull of the
  # shard list only: PSB is ~900 MB and the public runner has 14 GB disk.
  #
  # regression-pack produces the npm tarball perf jobs consume, in
  # parallel with the shards (both need: build). The aggregator keeps
  # the check name `run-ifc-regression`.
  #
  # Visual-diff is public coverage only — rendering private models would
  # publish them onto visual-diff-assets.
  # ---------------------------------------------------------------------------
  regression-pack:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package_tgz: ${{ steps.npm_pack.outputs.package_tgz }}
      test_models_sha: ${{ steps.tmsha.outputs.sha }}
    steps:
      - name: Checkout Conway Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Restore WASM build cache (populated by build)
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      - name: Fail if WASM cache miss
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::WASM cache miss in regression-pack; build should have populated it."
          exit 1

      - name: TypeScript build
        run: yarn build-incremental

      - name: Bump minor for artifact naming
        run: yarn bumpMinor

      - name: Bundle examples
        run: yarn bundle-examples

      - name: Resolve test-models SHA
        id: tmsha
        run: |
          set -euo pipefail
          URL=https://github.com/bldrs-ai/test-models.git
          REFS=$(git ls-remote "$URL" "$TEST_MODELS_REF")
          SHA=$(printf '%s\n' "$REFS" | awk '$2 ~ /\^\{\}$/ { print $1; found=1; exit } NR==1 { first=$1 } END { if (!found && first) print first }')
          if [ -z "$SHA" ]; then SHA="$TEST_MODELS_REF"; fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve TEST_MODELS_REF='$TEST_MODELS_REF' to a commit SHA (got '$SHA')."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create NPM Package
        id: npm_pack
        run: |
          PACKAGE_TGZ=$(npm pack 2>&1 | grep "filename:" | sed 's/.*filename: //')
          echo "package_tgz=${PACKAGE_TGZ}" >> "$GITHUB_OUTPUT"

      - name: Upload NPM Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.npm_pack.outputs.package_tgz }}
          path: ${{ steps.npm_pack.outputs.package_tgz }}

  regression-shard:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: coverage-1
            corpus: public
            concurrency: '2'
          - id: coverage-2
            corpus: public
            concurrency: '2'
          - id: coverage-3
            corpus: public
            concurrency: '2'
          - id: psb
            corpus: private
            concurrency: '1'
          - id: d3d
            corpus: private
            concurrency: '1'
          - id: ilna
            corpus: private
            concurrency: '1'
          - id: dowa
            corpus: private
            concurrency: '1'
          - id: orbiter
            corpus: private
            concurrency: '1'
          - id: blsn
            corpus: private
            concurrency: '1'
          - id: hospital
            corpus: private
            concurrency: '1'
    name: regression-shard ${{ matrix.id }}
    env:
      TOKEN_PRESENT: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN != '' }}
    steps:
      - name: Checkout Conway Repo
        if: matrix.corpus == 'public' || env.TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        if: matrix.corpus == 'public' || env.TOKEN_PRESENT == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        if: matrix.corpus == 'public' || env.TOKEN_PRESENT == 'true'
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: matrix.corpus == 'public' || env.TOKEN_PRESENT == 'true'
        run: yarn install --frozen-lockfile

      - name: Restore WASM build cache (populated by build)
        if: matrix.corpus == 'public' || env.TOKEN_PRESENT == 'true'
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      - name: Fail if WASM cache miss
        if: (matrix.corpus == 'public' || env.TOKEN_PRESENT == 'true') && steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::WASM cache miss in regression shard; build should have populated it."
          exit 1

      - name: TypeScript build
        if: matrix.corpus == 'public' || env.TOKEN_PRESENT == 'true'
        run: yarn build-incremental

      - name: Run shard
        if: matrix.corpus == 'public' || env.TOKEN_PRESENT == 'true'
        uses: ./.github/actions/regression-shard
        with:
          shard-id: ${{ matrix.id }}
          shard-file: regression/shards/${{ matrix.id }}.txt
          corpus: ${{ matrix.corpus }}
          models-ref: ${{ matrix.corpus == 'public' && env.TEST_MODELS_REF || env.TEST_MODELS_PRIVATE_TAG }}
          models-repo: ${{ matrix.corpus == 'public' && 'bldrs-ai/test-models' || 'bldrs-ai/test-models-private' }}
          models-token: ${{ matrix.corpus == 'private' && secrets.TEST_MODELS_PRIVATE_TOKEN || '' }}
          concurrency: ${{ matrix.concurrency }}
          allow-visual-diff: ${{ matrix.corpus == 'public' && 'true' || 'false' }}

  # Required check name. Must stay `run-ifc-regression` — README and any
  # status-check consumers match on it. Tiny: it AND-reduces the shards
  # and merges public visual-diff lists.
  run-ifc-regression:
    name: run-ifc-regression
    needs: [regression-pack, regression-shard]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_tgz: ${{ needs.regression-pack.outputs.package_tgz }}
      test_models_sha: ${{ needs.regression-pack.outputs.test_models_sha }}
      visual_diff_count: ${{ steps.concat.outputs.count }}
    steps:
      - name: Merge public visual-diff lists
        id: merge
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: visual-diff-models-*
          path: vdiff-in
          merge-multiple: false

      - name: Concatenate changed-model lists
        id: concat
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path('vdiff-in')
          lines = []
          if root.is_dir():
              for p in sorted(root.rglob('changed_models.txt')):
                  lines.extend(l.strip() for l in p.read_text().splitlines() if l.strip())
          uniq = sorted(set(lines))
          Path('changed_models.txt').write_text(('\n'.join(uniq) + '\n') if uniq else '')
          count = len(uniq)
          print(f'{count} public digest-changed model(s)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'count={count}\n')
          PY

      - name: Upload merged changed-model list
        if: steps.concat.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-models-${{ github.run_id }}
          path: changed_models.txt

      - name: All shards passed
        run: |
          echo "regression-pack: ${{ needs.regression-pack.result }}"
          echo "regression-shard: ${{ needs.regression-shard.result }}"
          test "${{ needs.regression-pack.result }}" = "success"
          test "${{ needs.regression-shard.result }}" = "success"

  # ---------------------------------------------------------------------------
  # Visual diff: render before/after images for every model whose regression
  # digest changed, so digest churn is reviewable as pictures instead of hex.
  # Base engine = the published @bldrs-ai/conway (what main ships today);
  # candidate = this run's tarball. Rendering is scripts/render_glb.cjs, a
  # pure-JS rasterizer — no headless-gl, no Xvfb, no Node pin — so this runs
  # on a stock runner. Each pair shares one camera (framed on the union of
  # both bounds): a geometry regression that moves the bounds reads as an
  # obvious scale/shape difference. Images are pushed to the
  # visual-diff-assets branch because PR comments can only embed hosted
  # files; the comment links them by commit SHA so rows stay immutable.
  # ---------------------------------------------------------------------------
  visual-diff:
    needs: run-ifc-regression
    # The draft clause is redundant today — a skipped `needs` job skips this
    # one regardless — but it is stated so the draft rule is greppable from
    # every job it governs, and so this stays correct if visual-diff ever
    # gains an always()/!cancelled() guard.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.run-ifc-regression.outputs.visual_diff_count != '0'
    # Public ubuntu-24.04 is 4 vCPU / 16 GB — more RAM than the paid
    # 8 GB SKU this used to share. The allocation crash that forced the
    # large runner was on the old 2-vCPU/7 GB image; disk is handled by
    # restoring the smoke-sized test-models cache (or skip-smudge +
    # LFS-pull of changed_models.txt only).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write       # push rendered PNGs to visual-diff-assets
      pull-requests: write  # post the before/after comment
    steps:
      - name: Checkout conway (render scripts)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download candidate tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.run-ifc-regression.outputs.package_tgz }}
          path: artifacts

      - name: Download changed-model list
        uses: actions/download-artifact@v4
        with:
          name: visual-diff-models-${{ github.run_id }}

      - name: Unpack candidate + fetch base package
        run: |
          mkdir -p engines/cand engines/base
          tar -xzf "artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}" \
            -C engines/cand --strip-components=1
          BASE_TGZ=$(npm pack @bldrs-ai/conway@latest --silent)
          tar -xzf "$BASE_TGZ" -C engines/base --strip-components=1
          # npm tarballs ship no node_modules, but the CLIs import runtime
          # deps (yargs, gl-matrix, three, seedrandom) at startup — without
          # this every export dies on ERR_MODULE_NOT_FOUND. legacy-peer-deps
          # because the shipped package.json's devDependencies carry a
          # typedoc/typescript peer conflict npm would otherwise refuse on
          # (even with --omit=dev); ignore-scripts skips the husky prepare
          # hook, which isn't in the tarball.
          (cd engines/cand && npm install --omit=dev --legacy-peer-deps \
            --ignore-scripts --no-audit --no-fund --silent)
          (cd engines/base && npm install --omit=dev --legacy-peer-deps \
            --ignore-scripts --no-audit --no-fund --silent)

      - name: Restore Test Models Cache
        id: cache-test-models
        uses: actions/cache/restore@v4
        with:
          path: test-models
          key: ${{ runner.os }}-test-models-smoke-${{ needs.run-ifc-regression.outputs.test_models_sha }}-${{ hashFiles('regression/smoke_models.txt') }}

      - name: Checkout Test Models Repo if Not Cached
        if: steps.cache-test-models.outputs.cache-hit != 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          SHA="${{ needs.run-ifc-regression.outputs.test_models_sha }}"
          git init test-models
          git -C test-models remote add origin https://github.com/bldrs-ai/test-models.git
          git -C test-models fetch --depth 1 origin "$SHA"
          git -C test-models checkout "$SHA"

      # Pull LFS only for the models this job will render. A full
      # `ifc/**,step/**` pull is ~3 GB and does not fit on 14 GB disk.
      # Stubs used to be tolerated as "no geometry"; that blessed two
      # pointer files as engine bugs (#477). The batch now fails a stub
      # (#486). This job still continues on a leftover stub — one blank
      # image, not a committed falsehood — but the warning says that.
      - name: Materialize LFS model files
        run: |
          python3 - <<'EOF'
          import subprocess
          from pathlib import Path
          root = Path('test-models')
          rels = []
          for line in open('changed_models.txt'):
              rel = line.split('\t', 1)[0].strip()
              if rel:
                  rels.append(rel)
          stubs = []
          for rel in rels:
              p = root / rel
              if not p.is_file():
                  print(f'::warning::changed model missing: {rel}')
                  continue
              head = p.read_bytes()[:200]
              if head.startswith(b'version https://git-lfs') or b'git-lfs.github.com' in head:
                  stubs.append(rel)
          print(f'{len(rels)} changed models, {len(stubs)} LFS stubs to pull')
          if not stubs:
              raise SystemExit(0)
          subprocess.check_call(['git', 'lfs', 'install', '--local'], cwd=root)
          subprocess.check_call(
              ['git', 'lfs', 'pull', '--include=' + ','.join(stubs)], cwd=root)
          left = []
          for rel in stubs:
              head = (root / rel).read_bytes()[:200]
              if head.startswith(b'version https://git-lfs') or b'git-lfs.github.com' in head:
                  left.append(rel)
          if left:
              print('::warning::unsmudged LFS pointer stub(s) after pull — '
                    'blank renders for these are a missing file, not a geometry '
                    'regression: ' + ', '.join(left))
          EOF

      - name: Render before/after pairs
        run: |
          sed "s|^|$PWD/test-models/|" changed_models.txt > abs_models.txt
          node scripts/visual_diff_report.cjs \
            --models abs_models.txt \
            --base engines/base --cand engines/cand \
            --out vdout --max 24 \
            --diff-threshold 0.0005

      - name: Publish images to assets branch
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          DEST="pr-${{ github.event.pull_request.number }}/${{ github.run_id }}"
          if git clone --depth 1 --branch visual-diff-assets "$REPO_URL" assets 2>/dev/null; then
            cd assets
          else
            # First ever visual diff: the assets branch doesn't exist yet.
            mkdir assets && cd assets
            git init -b visual-diff-assets
            git remote add origin "$REPO_URL"
          fi
          mkdir -p "$DEST"
          cp ../vdout/*.png "$DEST"/ 2>/dev/null || true
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Visual diff assets for PR #${{ github.event.pull_request.number }} (run ${{ github.run_id }})" \
            || true
          # Another PR's visual-diff job can push between our clone and push;
          # rebase (assets commits never conflict — disjoint run-id dirs).
          for i in 1 2 3; do
            git push origin visual-diff-assets && break
            git pull --rebase origin visual-diff-assets || true
            sleep $((i * 2))
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Finalize report
        run: |
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.assets.outputs.sha }}/${{ steps.assets.outputs.dest }}"
          sed "s|RAW_URL_BASE|$RAW|g" vdout/report.md > report_final.md
          {
            echo "## Visual Diff (digest-changed & new models)"
            echo ""
            echo "Base: published \`@bldrs-ai/conway\` (main). Candidate: this PR's build."
            echo "Each row shares one camera framed on the union of both bounds — scale differences are real."
            echo ""
            cat report_final.md
          } > comment.md

      - name: Comment on Pull Request
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment.md

  # ---------------------------------------------------------------------------
  # Headless-three perf benchmark (public models).
  #
  # Runs scripts/benchmark.cjs against bldrs-ai/test-models (public) using the
  # candidate conway tarball produced by run-ifc-regression. The adapter
  # (@bldrs-ai/conway-web-ifc-adapter) ships unbundled — it does runtime
  # `import '@bldrs-ai/conway'` — so a yarn `resolutions` override in H3's
  # package.json forces the entire chain (H3 → adapter → conway) onto our
  # candidate without rebuilding the adapter.
  #
  # Info-only: results are posted as a PR comment for visibility. Future
  # iterations will diff perf vs a golden baseline and may gate on it.
  # ---------------------------------------------------------------------------
  perf-three-public:
    needs: run-ifc-regression
    # Extended suite: runs on an `rc-*` release-candidate tag (a manual
    # prod-blessing) or on-demand via workflow_dispatch — NOT on plain merges
    # to main. build + run-ifc-regression (ungated) still run on the tag, so
    # the candidate tarball this job benchmarks is produced; auto-publish is
    # main-branch-only and does not fire on a tag ref.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    # Full set locally takes ~10 min; H3 build + clone adds ~5-10 min. Cap at
    # 60 to bound runner-minute cost on a hung benchmark.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      actions: read    # required by download-artifact@v4 to fetch from prior runs
    env:
      # Pinned to a SHA so perf is reproducible. Override via repo variable
      # `H3_SHA` when bumping the H3 baseline.
      H3_SHA: ${{ vars.H3_SHA || '76f9ab686e08e58e7fe798e6a11ed0ad52b38c4b' }}
    steps:
      - name: Checkout conway (for scripts/benchmark.cjs)
        uses: actions/checkout@v4
        with:
          # No submodules — perf doesn't build conway, it consumes the tarball.
          submodules: false
          fetch-depth: 1

      # Unlike the other jobs (pure JS/wasm on Node 26), perf builds
      # headless-three's native addons — `gl` and `canvas`. Neither ships a
      # prebuilt for Node 26, and `gl` won't even compile against Node 26's V8
      # (GetAlignedPointerFromInternalField signature change). Pin Node 20,
      # which has prebuilt binaries for both; it's also the runtime the 1.361
      # perf baseline was measured under, so the comparison stays apples-to-apples.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download conway candidate tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.run-ifc-regression.outputs.package_tgz }}
          path: artifacts

      - name: Clone headless-three at pinned SHA
        run: |
          git clone https://github.com/bldrs-ai/headless-three.git h3
          git -C h3 checkout "$H3_SHA"

      - name: Override conway via yarn resolutions
        env:
          CANDIDATE_TGZ: ${{ github.workspace }}/artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}
        run: |
          test -f "$CANDIDATE_TGZ" || { echo "::error::Candidate tarball missing: $CANDIDATE_TGZ"; exit 1; }
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('h3/package.json', 'utf8'));
            p.resolutions = Object.assign({}, p.resolutions, { '@bldrs-ai/conway': 'file:' + process.env.CANDIDATE_TGZ });
            fs.writeFileSync('h3/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # headless-three pulls in `canvas`, which has no prebuilt binary for this
      # runner's Node, so the `yarn install` below compiles it from source. Its
      # node-gyp build needs cairo/pixman/pango/etc. dev headers present *before*
      # install — the GL libraries installed further down (for headless-gl) come
      # too late and don't include these. Without this, `yarn install` dies with
      # "Package pixman-1 was not found" and every perf run is skipped.
      - name: Install canvas native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config build-essential \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install H3 + build
        working-directory: h3
        run: |
          yarn install
          yarn build
          # The bundled server resolves the conway wasm from <cwd>/Dist at
          # runtime; without this every render 500s with ERR_MODULE_NOT_FOUND.
          ln -sfn node_modules/@bldrs-ai/conway/compiled/dependencies/conway-geom/Dist Dist

      # Safety check: if the resolutions override didn't take effect, H3 would
      # silently benchmark whatever conway version its lockfile pins instead of
      # our candidate. Compare the version in node_modules against the version
      # baked into the candidate tarball's package.json.
      - name: Verify candidate conway is resolved in H3
        env:
          CANDIDATE_TGZ: ${{ github.workspace }}/artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}
        run: |
          EXPECTED=$(tar -xzOf "$CANDIDATE_TGZ" package/package.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s).version))")
          ACTUAL=$(node -p "require('./h3/node_modules/@bldrs-ai/conway/package.json').version")
          echo "Expected conway: $EXPECTED"
          echo "Actual conway:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::yarn resolutions override did not take effect. Expected '$EXPECTED', got '$ACTUAL'."
            exit 1
          fi

      # headless-gl (the `gl` package H3 renders through) needs an X/GLX
      # display plus the GL libraries H3's own Dockerfile installs
      # (libxi/libGLU/GLEW); with only xvfb the server can die at startup
      # and every render fails.
      - name: Install Xvfb + GL libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb pkg-config build-essential \
            libxi-dev libglu1-mesa-dev libglew-dev

      # Prove the `gl` native module can actually create a context on this
      # runner before spending minutes benchmarking. The npm prebuilt binary
      # is built on a different image; if it can't initialize here, rebuild
      # it from source against this runner's libraries and re-verify.
      - name: GL smoke test (rebuild gl from source if prebuilt is broken)
        working-directory: h3
        run: |
          SMOKE='const gl=require("gl")(8,8); if(!gl){throw new Error("gl context creation returned null")}; console.log("gl OK:", gl.getParameter(gl.VERSION))'
          if ! xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" node -e "$SMOKE"; then
            echo "::warning::Prebuilt gl failed to initialize; rebuilding from source."
            npm rebuild gl --build-from-source
            xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" node -e "$SMOKE"
          fi

      - name: Restore Test Models Cache
        id: cache-test-models
        uses: actions/cache@v4
        with:
          path: test-models
          # Full public corpus, not the smoke-sized cache the PR
          # regression job writes. This job is rc-only on the 150 GB
          # SKU; a miss re-clones.
          key: ${{ runner.os }}-test-models-${{ needs.run-ifc-regression.outputs.test_models_sha }}

      - name: Checkout Test Models Repo if Not Cached
        if: steps.cache-test-models.outputs.cache-hit != 'true'
        run: |
          SHA="${{ needs.run-ifc-regression.outputs.test_models_sha }}"
          # Same exact commit run-ifc-regression diffed against (fetch-by-SHA).
          git init test-models
          git -C test-models remote add origin https://github.com/bldrs-ai/test-models.git
          git -C test-models fetch --depth 1 origin "$SHA"
          git -C test-models checkout "$SHA"

      - name: Run H3 benchmark (public)
        env:
          # Keep outputs OUT of the test-models checkout: it contains
          # committed benchmark snapshot CSVs, and reporting used to pick
          # those up instead of this run's results.
          BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/bench-public
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" \
            node scripts/benchmark.cjs ./h3 ./test-models

      - name: Locate detail CSV
        id: detail
        run: |
          # benchmark.cjs writes to $BENCHMARK_OUTPUT_DIR/<engine>_<modelDirName>/performance-detail.csv
          CSV=$(find "${{ runner.temp }}/bench-public" -name performance-detail.csv -type f | head -1)
          test -n "$CSV" || { echo "::error::performance-detail.csv not produced"; exit 1; }
          echo "csv=${CSV}" >> "$GITHUB_OUTPUT"

      - name: Build perf table (all models, alpha sort)
        id: table
        env:
          CSV_PATH: ${{ steps.detail.outputs.csv }}
        run: |
          TABLE=$(python - "$CSV_PATH" <<'EOF'
          import csv, os, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          if not rows:
              print("performance-detail.csv is empty.")
              sys.exit(0)
          rows.sort(key=lambda r: r.get('filename',''))
          cols = ['filename','loadStatus','schemaVersion','parseTimeMs','geometryTimeMs','totalTimeMs','geometryMemoryMb','peakWasmHeapMb','rssMb','peakRssMb','heapUsedMb','retainedRssMb']
          print("| " + " | ".join(cols) + " |")
          print("|" + " --- |" * len(cols))
          for r in rows:
              print("| " + " | ".join(str(r.get(c,'')) for c in cols) + " |")
          print("")
          print(f"_Total: {len(rows)} models._")
          EOF
          )
          {
            echo "table<<EOF"
            echo "$TABLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload public perf detail CSV
        uses: actions/upload-artifact@v4
        with:
          name: perf-three-public-${{ github.run_id }}
          path: ${{ steps.detail.outputs.csv }}

      # Full bench output (per-model PNGs, 00-rendering-server.log.txt) even —
      # especially — when the benchmark fails, so render failures are
      # diagnosable from the artifact instead of being lost with the runner.
      - name: Upload bench output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-three-public-benchdir-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-public
          if-no-files-found: ignore

      # --- Cross-version delta vs the most recent prior push:main run ---
      # See .github/actions/perf-delta for the shared find/download/compute/
      # upload pipeline. Non-fatal: if anything goes wrong (no prior, expired,
      # format change, script error), the delta section is omitted from the
      # comment and the snapshot still posts.
      - name: Compute public perf delta
        id: perf_delta
        uses: ./.github/actions/perf-delta
        with:
          artifact-prefix: 'perf-three-public-'
          current-csv: ${{ steps.detail.outputs.csv }}
          delta-artifact-name: perf-delta-public-${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build delta section (sorted by abs %change)
        id: delta_table
        if: steps.perf_delta.outputs.csv != ''
        env:
          DELTA_CSV: ${{ steps.perf_delta.outputs.csv }}
          PREV_RUN_ID: ${{ steps.perf_delta.outputs.prev_run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SECTION=$(python - "$DELTA_CSV" "$PREV_RUN_ID" "$RUN_ID" <<'EOF'
          import csv, sys
          delta_csv, prev_run_id, run_id = sys.argv[1], sys.argv[2], sys.argv[3]
          def pct(s):
              s = (s or '').strip().rstrip('%')
              if s == '' or s == 'Infinity' or s == 'N/A': return float('inf') if s == 'Infinity' else 0.0
              try: return float(s)
              except ValueError: return 0.0
          rows = list(csv.DictReader(open(delta_csv)))
          if not rows:
              sys.exit(0)
          rows.sort(key=lambda r: abs(pct(r.get('totalTimeMsPercentageChange',''))), reverse=True)
          # Δ peak RSS is the process high-water mark, Δ RSS a single end-of-load
          # sample; both are N/A against a baseline blessed before conway#552.
          # Δ external is off-heap bytes heapUsed cannot see. Its arrayBuffers
          # subset is in the CSV rather than here, to keep this table readable.
          # Δ retained RSS is a delta OF a delta: each side is already what one
          # load/teardown cycle left behind (conway#554), so a positive number
          # here means the cycle got leakier. N/A before #554, and in any run
          # whose children had no --expose-gc. Its heapUsed/external siblings
          # are in the CSV rather than here, same readability trade.
          cols = ['filename','engine1TotalTimeMs','engine2TotalTimeMs','totalTimeMsDelta','totalTimeMsPercentageChange','geometryMemoryMbDelta','peakWasmHeapMbDelta','rssMbDelta','peakRssMbDelta','externalMbDelta','retainedRssMbDelta']
          headers = ['file','prev ms','curr ms','Δ ms','Δ %','Δ geomMem MB','Δ wasm heap MB','Δ RSS MB','Δ peak RSS MB','Δ external MB','Δ retained RSS MB']
          print(f"### Δ vs previous run [#{prev_run_id}](https://github.com/bldrs-ai/conway/actions/runs/{prev_run_id})")
          print()
          print("| " + " | ".join(headers) + " |")
          print("|" + " --- |" * len(headers))
          for r in rows:
              print("| " + " | ".join(str(r.get(c,'')) for c in cols) + " |")
          print()
          print(f"_Δ rows: {len(rows)} (sorted by |Δ %| desc). Negative = improvement._")
          print(f"_Delta CSV in run artifacts (`perf-delta-public-{run_id}`)._")
          EOF
          )
          {
            echo "section<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Parse PR# from the merge commit message — same trick auto-publish uses.
      # Squash-merge embeds it as "... (#N)", merge commit as "Merge pull
      # request #N from ...". If no PR# parses, skip the comment (artifact is
      # still uploaded for manual inspection).
      - name: Resolve PR number for comment target
        id: pr
        run: |
          MSG=$(git log -1 --format=%B HEAD)
          PR_NUM=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"

      # Look up an existing perf comment by hidden marker and upsert. Without
      # this, every re-run of push:main would post a new duplicate comment.
      - name: Find existing public perf comment
        id: find_comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- perf-three-public -->'

      - name: Create or update public perf comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- perf-three-public -->
            ## Headless-three Performance (public models)

            **Setup**: conway `${{ needs.run-ifc-regression.outputs.package_tgz }}` against H3 `${{ env.H3_SHA }}` over `test-models@${{ needs.run-ifc-regression.outputs.test_models_sha }}`.

            ${{ steps.table.outputs.table }}

            ${{ steps.delta_table.outputs.section }}

            _Full `performance-detail.csv` in run artifacts (`perf-three-public-${{ github.run_id }}`)._

  # ---------------------------------------------------------------------------
  # Headless-three perf benchmark (private models).
  #
  # Same setup as perf-three-public but against bldrs-ai/test-models-private.
  # conway is a PUBLIC repo, so Actions logs and artifacts are world-readable.
  # Private model names are therefore anonymized to stable path hashes
  # (BENCHMARK_ANONYMIZE) everywhere the benchmark could surface them, the
  # posted comment is aggregate-only, and the raw bench dir (server log / PNGs
  # that carry the real path) is not uploaded — so no private model name
  # reaches a public sink.
  #
  # Fail-fast on missing TEST_MODELS_PRIVATE_TOKEN: surfaces config problems
  # immediately instead of silently skipping coverage.
  # ---------------------------------------------------------------------------
  perf-three-private:
    needs: run-ifc-regression
    # Extended suite: runs on an `rc-*` release-candidate tag (a manual
    # prod-blessing) or on-demand via workflow_dispatch — NOT on plain merges
    # to main. build + run-ifc-regression (ungated) still run on the tag, so
    # the candidate tarball this job benchmarks is produced; auto-publish is
    # main-branch-only and does not fire on a tag ref.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      actions: read    # required by download-artifact@v4 to fetch from prior runs
    env:
      H3_SHA: ${{ vars.H3_SHA || '76f9ab686e08e58e7fe798e6a11ed0ad52b38c4b' }}
      # Default to main; override via repo variable once a stable tag exists.
      TEST_MODELS_PRIVATE_TAG: ${{ vars.TEST_MODELS_PRIVATE_TAG || 'main' }}
    steps:
      - name: Fail fast if private models token missing
        env:
          TOKEN_PRESENT: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::TEST_MODELS_PRIVATE_TOKEN secret is not set. Required to clone bldrs-ai/test-models-private."
            exit 1
          fi

      - name: Checkout conway (for scripts/benchmark.cjs)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # See the public perf job — Node 20 so headless-three's native `gl` /
      # `canvas` addons resolve prebuilts instead of failing to compile on Node 26.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download conway candidate tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.run-ifc-regression.outputs.package_tgz }}
          path: artifacts

      - name: Clone headless-three at pinned SHA
        run: |
          git clone https://github.com/bldrs-ai/headless-three.git h3
          git -C h3 checkout "$H3_SHA"

      - name: Override conway via yarn resolutions
        env:
          CANDIDATE_TGZ: ${{ github.workspace }}/artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}
        run: |
          test -f "$CANDIDATE_TGZ" || { echo "::error::Candidate tarball missing: $CANDIDATE_TGZ"; exit 1; }
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('h3/package.json', 'utf8'));
            p.resolutions = Object.assign({}, p.resolutions, { '@bldrs-ai/conway': 'file:' + process.env.CANDIDATE_TGZ });
            fs.writeFileSync('h3/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # See the public perf job — canvas compiles from source here and needs
      # cairo/pixman/pango dev headers before `yarn install`, ahead of the
      # GL libraries installed further down.
      - name: Install canvas native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config build-essential \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install H3 + build
        working-directory: h3
        run: |
          yarn install
          yarn build
          # The bundled server resolves the conway wasm from <cwd>/Dist at
          # runtime; without this every render 500s with ERR_MODULE_NOT_FOUND.
          ln -sfn node_modules/@bldrs-ai/conway/compiled/dependencies/conway-geom/Dist Dist

      - name: Verify candidate conway is resolved in H3
        env:
          CANDIDATE_TGZ: ${{ github.workspace }}/artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}
        run: |
          EXPECTED=$(tar -xzOf "$CANDIDATE_TGZ" package/package.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s).version))")
          ACTUAL=$(node -p "require('./h3/node_modules/@bldrs-ai/conway/package.json').version")
          echo "Expected conway: $EXPECTED"
          echo "Actual conway:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::yarn resolutions override did not take effect. Expected '$EXPECTED', got '$ACTUAL'."
            exit 1
          fi

      # headless-gl needs an X/GLX display + GL libraries; see the public
      # perf job for details.
      - name: Install Xvfb + GL libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb pkg-config build-essential \
            libxi-dev libglu1-mesa-dev libglew-dev

      - name: GL smoke test (rebuild gl from source if prebuilt is broken)
        working-directory: h3
        run: |
          SMOKE='const gl=require("gl")(8,8); if(!gl){throw new Error("gl context creation returned null")}; console.log("gl OK:", gl.getParameter(gl.VERSION))'
          if ! xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" node -e "$SMOKE"; then
            echo "::warning::Prebuilt gl failed to initialize; rebuilding from source."
            npm rebuild gl --build-from-source
            xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" node -e "$SMOKE"
          fi

      - name: Clone private test models
        env:
          GH_TOKEN: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN }}
        run: |
          git clone --depth 1 --branch "$TEST_MODELS_PRIVATE_TAG" \
            "https://x-access-token:${GH_TOKEN}@github.com/bldrs-ai/test-models-private.git" test-models-private

      - name: Run H3 benchmark (private)
        env:
          # Keep outputs OUT of the model checkout (it may contain committed
          # benchmark snapshot CSVs that reporting would pick up instead).
          BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/bench-private
          # conway is a PUBLIC repo — Actions logs and artifacts are
          # world-readable. Anonymize private model names to stable path
          # hashes everywhere they could surface (console, detail CSV, PNG
          # names, log tail) so private names never leak. The cross-version
          # delta still joins by the stable hash.
          BENCHMARK_ANONYMIZE: '1'
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" \
            node scripts/benchmark.cjs ./h3 ./test-models-private

      - name: Locate detail CSV
        id: detail
        run: |
          CSV=$(find "${{ runner.temp }}/bench-private" -name performance-detail.csv -type f | head -1)
          test -n "$CSV" || { echo "::error::performance-detail.csv not produced"; exit 1; }
          echo "csv=${CSV}" >> "$GITHUB_OUTPUT"

      - name: Build aggregate stats (no filenames)
        id: stats
        env:
          CSV_PATH: ${{ steps.detail.outputs.csv }}
        run: |
          STATS=$(python - "$CSV_PATH" <<'EOF'
          import csv, statistics, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          total = len(rows)
          # Treat any loadStatus other than 'ok' (case-insensitive) as failing.
          ok_rows = [r for r in rows if (r.get('loadStatus','').strip().lower() == 'ok')]
          fail = total - len(ok_rows)
          def col_stats(col):
              vals = []
              for r in ok_rows:
                  v = r.get(col, '')
                  try:
                      vals.append(float(v))
                  except (TypeError, ValueError):
                      pass
              if not vals:
                  return {'count': '0', 'min': '-', 'median': '-', 'mean': '-', 'max': '-', 'stddev': '-'}
              return {
                  'count': str(len(vals)),
                  'min': f"{min(vals):.0f}",
                  'median': f"{statistics.median(vals):.0f}",
                  'mean': f"{statistics.mean(vals):.0f}",
                  'max': f"{max(vals):.0f}",
                  'stddev': f"{(statistics.stdev(vals) if len(vals) > 1 else 0):.0f}",
              }
          cols = ['parseTimeMs', 'geometryTimeMs', 'totalTimeMs', 'geometryMemoryMb', 'peakWasmHeapMb', 'rssMb', 'peakRssMb', 'retainedRssMb']
          s = {c: col_stats(c) for c in cols}
          print(f"**Pass/fail**: {len(ok_rows)} passing / {fail} failing of {total} total.")
          print()
          print("| stat | " + " | ".join(cols) + " |")
          print("| --- |" + " --- |" * len(cols))
          for stat in ['count', 'min', 'median', 'mean', 'max', 'stddev']:
              print(f"| {stat} | " + " | ".join(s[c][stat] for c in cols) + " |")
          EOF
          )
          {
            echo "stats<<EOF"
            echo "$STATS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The detail CSV carries only anonymized identifiers (BENCHMARK_ANONYMIZE
      # above), so it's safe to upload on this public repo.
      - name: Upload private perf detail CSV
        uses: actions/upload-artifact@v4
        with:
          name: perf-three-private-${{ github.run_id }}
          path: ${{ steps.detail.outputs.csv }}

      # NOTE: the full bench dir (per-model PNGs, 00-rendering-server.log.txt)
      # is deliberately NOT uploaded for the private job. The server log
      # records the real model file path and the PNGs would be named by it,
      # and conway is a PUBLIC repo where artifacts are world-readable. Private
      # render failures therefore can't be diagnosed from a public artifact —
      # re-run against a private runner if needed. (The public job uploads its
      # bench dir; those model names are already public.)

      # --- Cross-version delta vs previous push:main run ---
      # Mirrors the public-job logic but emits aggregate stats over the delta
      # columns (no identifiers in the comment). The delta CSV carries only the
      # anonymized identifiers, so the uploaded artifact leaks no model names.
      - name: Compute private perf delta
        id: perf_delta
        uses: ./.github/actions/perf-delta
        with:
          artifact-prefix: 'perf-three-private-'
          current-csv: ${{ steps.detail.outputs.csv }}
          delta-artifact-name: perf-delta-private-${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Aggregate-only stats over the delta columns — no filenames leak into
      # the comment body. Pct change is a string like "12.34%"; strip the
      # suffix for the numeric stats. Models present in only one side
      # contribute N/A delta values which parseValue() in gen_delta_csv
      # collapses to 0; we skip them here so the stats reflect real changes.
      - name: Build delta stats section
        id: delta_stats
        if: steps.perf_delta.outputs.csv != ''
        env:
          DELTA_CSV: ${{ steps.perf_delta.outputs.csv }}
          PREV_RUN_ID: ${{ steps.perf_delta.outputs.prev_run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SECTION=$(python - "$DELTA_CSV" "$PREV_RUN_ID" "$RUN_ID" <<'EOF'
          import csv, statistics, sys
          delta_csv, prev_run_id, run_id = sys.argv[1], sys.argv[2], sys.argv[3]
          rows = list(csv.DictReader(open(delta_csv)))
          # Only models that ran successfully on BOTH sides have meaningful
          # numeric deltas. loadStatus1/2 are 'OK' (uppercase) from benchmark.cjs.
          common = [r for r in rows
                    if r.get('loadStatus1','').strip().upper() == 'OK'
                    and r.get('loadStatus2','').strip().upper() == 'OK']
          def parse_pct(s):
              s = (s or '').strip().rstrip('%')
              if s in ('', 'N/A', 'Infinity'): return None
              try: return float(s)
              except ValueError: return None
          def parse_num(s):
              s = (s or '').strip()
              if s in ('', 'N/A'): return None
              try: return float(s)
              except ValueError: return None
          def col_stats(label, vals, suffix=''):
              vals = [v for v in vals if v is not None]
              if not vals:
                  return {'count': '0', 'min': '-', 'median': '-', 'mean': '-', 'max': '-', 'stddev': '-'}
              # Match precision to the column's unit (% gets 2 decimals; ms is integer)
              # and use the same suffix so the cells in a column read uniformly.
              prec = 2 if suffix == '%' else 0
              signed = lambda v: f"{v:+.{prec}f}{suffix}"
              unsigned = lambda v: f"{v:.{prec}f}{suffix}"
              return {
                  'count': str(len(vals)),
                  'min': signed(min(vals)),
                  'median': signed(statistics.median(vals)),
                  'mean': signed(statistics.mean(vals)),
                  'max': signed(max(vals)),
                  'stddev': unsigned(statistics.stdev(vals) if len(vals) > 1 else 0),
              }
          parse_d  = col_stats('parseTimeMsDelta',   [parse_num(r.get('parseTimeMsDelta','')) for r in common])
          geom_d   = col_stats('geometryTimeMsDelta',[parse_num(r.get('geometryTimeMsDelta','')) for r in common])
          total_d  = col_stats('totalTimeMsDelta',   [parse_num(r.get('totalTimeMsDelta','')) for r in common])
          pct_d    = col_stats('pct',                [parse_pct(r.get('totalTimeMsPercentageChange','')) for r in common], suffix='%')
          gmem_d   = col_stats('geometryMemoryMbDelta', [parse_num(r.get('geometryMemoryMbDelta','')) for r in common])
          rss_d    = col_stats('rssMbDelta',         [parse_num(r.get('rssMbDelta','')) for r in common])
          peak_d   = col_stats('peakRssMbDelta',    [parse_num(r.get('peakRssMbDelta','')) for r in common])
          ext_d    = col_stats('externalMbDelta',   [parse_num(r.get('externalMbDelta','')) for r in common])
          wasm_d   = col_stats('peakWasmHeapMbDelta', [parse_num(r.get('peakWasmHeapMbDelta','')) for r in common])
          ret_d    = col_stats('retainedRssMbDelta', [parse_num(r.get('retainedRssMbDelta','')) for r in common])
          # Track regressions/improvements at a glance.
          pct_vals = [parse_pct(r.get('totalTimeMsPercentageChange','')) for r in common]
          pct_vals = [v for v in pct_vals if v is not None]
          regr = sum(1 for v in pct_vals if v > 0)
          impr = sum(1 for v in pct_vals if v < 0)
          flat = sum(1 for v in pct_vals if v == 0)
          print(f"### Δ vs previous run [#{prev_run_id}](https://github.com/bldrs-ai/conway/actions/runs/{prev_run_id})")
          print()
          print(f"**Models compared (OK on both sides)**: {len(common)} of {len(rows)} delta rows.")
          print(f"**Regressed / improved / flat (by totalTimeMs)**: {regr} / {impr} / {flat}.")
          print()
          cols = ['parseTimeMsDelta','geometryTimeMsDelta','totalTimeMsDelta','totalTimeMsPercentageChange','geometryMemoryMbDelta','peakWasmHeapMbDelta','rssMbDelta','peakRssMbDelta','externalMbDelta','retainedRssMbDelta']
          headers = ['stat','Δ parse ms','Δ geom ms','Δ total ms','Δ total %','Δ geomMem MB','Δ wasm heap MB','Δ RSS MB','Δ peak RSS MB','Δ external MB','Δ retained RSS MB']
          s = {'parseTimeMsDelta': parse_d, 'geometryTimeMsDelta': geom_d, 'totalTimeMsDelta': total_d, 'totalTimeMsPercentageChange': pct_d, 'geometryMemoryMbDelta': gmem_d, 'peakWasmHeapMbDelta': wasm_d, 'rssMbDelta': rss_d, 'peakRssMbDelta': peak_d, 'externalMbDelta': ext_d, 'retainedRssMbDelta': ret_d}
          print("| " + " | ".join(headers) + " |")
          print("|" + " --- |" * len(headers))
          for stat in ['count', 'min', 'median', 'mean', 'max', 'stddev']:
              print(f"| {stat} | " + " | ".join(s[c][stat] for c in cols) + " |")
          print()
          print(f"_Delta CSV in run artifacts (`perf-delta-private-{run_id}`); model identifiers are anonymized._")
          EOF
          )
          {
            echo "section<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR number for comment target
        id: pr
        run: |
          MSG=$(git log -1 --format=%B HEAD)
          PR_NUM=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"

      # Look up an existing perf comment by hidden marker and upsert. Without
      # this, every re-run of push:main would post a new duplicate comment.
      - name: Find existing private perf comment
        id: find_comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- perf-three-private -->'

      - name: Create or update private perf comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- perf-three-private -->
            ## Headless-three Performance (private models)

            **Setup**: conway `${{ needs.run-ifc-regression.outputs.package_tgz }}` against H3 `${{ env.H3_SHA }}` over `test-models-private@${{ env.TEST_MODELS_PRIVATE_TAG }}`.

            ${{ steps.stats.outputs.stats }}

            ${{ steps.delta_stats.outputs.section }}

            _Detail CSV in run artifacts (`perf-three-private-${{ github.run_id }}`); model identifiers are anonymized._

  # ---------------------------------------------------------------------------
  # Continuous release: on every successful push to main, publish to npm and
  # tag the commit. Version is <major>.<commit>.<issue>-g<shorthash>:
  #   major  - first segment of package.json's version (manual bump). The
  #            minor/patch in package.json/version.ts are an unstamped 1.0.0
  #            placeholder on main and are ignored here - both are recomputed
  #            below, so only edit the major segment to roll a major version.
  #   commit - 'git rev-list HEAD --count' at the merge commit. In the MINOR
  #            slot because it is the only strictly monotonic segment we have,
  #            and npm compares a new version against the HIGHEST-EVER
  #            published one. It used to sit in the patch slot behind the
  #            non-monotonic issue/PR number, which let an out-of-order merge
  #            compute a version below the all-time max and hard-fail the
  #            publish (conway#533).
  #   issue  - the FIRST '#N' in the merge commit message. Under this repo's
  #            title convention, '#<issue>: description (#<pr>)', that is the
  #            ISSUE number, not the PR number; a title with no issue ref
  #            yields the PR number the squash-merge appended, and one with
  #            neither falls back to 0. Non-monotonic either way (issues and
  #            PRs both land out of order), so it is informational only and
  #            lives in the patch slot where it can't invert the ordering.
  #            No PR number is encoded, and none is needed: the hash below
  #            resolves to the commit, which resolves to its PR.
  #   hash   - the first 8 characters of 'git rev-parse HEAD', prefixed with a
  #            literal 'g' as `git describe` does. The prefix is load-bearing,
  #            not cosmetic: semver forbids leading zeros in a purely numeric
  #            prerelease identifier, so a hash like 0512345 would be an
  #            INVALID version and hard-fail the publish (~0.4% of commits).
  #            Truncated rather than abbreviated by git, because EVERY git
  #            abbreviation - auto-abbrev and '--short=N' alike - is a
  #            MINIMUM width that grows to stay unique against the current
  #            object database ('git rev-parse --short=1 HEAD' returns 4
  #            characters here, not 1). Either would compute a DIFFERENT
  #            version string for the same commit as the repo grows; a
  #            version must be recomputable from the commit alone.
  #            The tradeoff: a fixed truncation can collide, which a git
  #            abbreviation cannot. Acceptable here - the commit count in the
  #            minor segment is already unique per commit on main, so the hash
  #            is a convenience ref for a human, not the identifying key. A
  #            collision would make two versions share a suffix; it would not
  #            make them equal or misorder them.
  # So every green merge ships a uniquely-traceable, strictly increasing
  # version to @latest.
  #
  # Consequence: the '-g...' suffix makes every published version a semver
  # PRERELEASE, which '^'/'~' ranges never match. Consumers must pin exactly
  # (Share does) or install via the 'latest' dist-tag.
  #
  # Auth: npm Trusted Publishing via GitHub OIDC. The trusted publisher must
  # be configured on npmjs.com (Package → Settings → Trusted Publisher) and
  # bound to repo+workflow. No NPM_TOKEN secret needed.
  # ---------------------------------------------------------------------------
  auto-publish:
    needs: [build, run-ifc-regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    permissions:
      contents: write    # tag push
      id-token: write    # OIDC token for npm Trusted Publishing
    steps:
      - name: Checkout (full history for rev-list)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      # Trusted Publishing requires npm >= 11.5.1. Node 26 ships an older npm,
      # so upgrade the global npm binary before the publish step. On Node 26 the
      # current npm@latest (12.x) installs cleanly and has OIDC, so the earlier
      # 11.x pin (needed while this job ran Node 20) is no longer required.
      - name: Upgrade npm to a version that supports OIDC
        run: npm install -g npm@latest

      - name: Compute next version
        id: ver
        run: |
          MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          # Takes the FIRST '#N' in the merge commit message. Under this
          # repo's title convention, '#<issue>: description (#<pr>)', that is
          # the ISSUE number the merge closes - NOT the PR number, which the
          # squash-merge appends second. A title carrying no issue ref leaves
          # the appended '(#N)' first, so the PR number is what lands; a
          # message with neither (a direct push to main, say) falls back to 0
          # and warns.
          #
          # Deliberately unchanged since conway#533 renamed this variable: the
          # published numbers must not move. Only the name and the docs were
          # wrong, claiming a PR number this never held.
          MSG=$(git log -1 --format=%B HEAD)
          ISSUE_NUM=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -z "$ISSUE_NUM" ]; then
            echo "::warning::Could not parse an issue or PR number from the commit message; using 0."
            ISSUE_NUM=0
          fi
          COMMIT=$(git rev-list HEAD --count)
          # 'g' prefix per git-describe convention. Required: semver rejects a
          # leading zero in an all-numeric prerelease identifier, and ~0.4% of
          # short hashes are all digits with a leading zero.
          #
          # Truncate the full hash; do NOT use 'git rev-parse --short[=N]'.
          # Every git abbreviation is a MINIMUM width that git widens to keep
          # the result unique against the current object database - on git
          # 2.43 '--short=1 HEAD' returns 4 characters, not 1 - so '--short=8'
          # starts returning 9 as soon as two objects share an 8-character
          # prefix. Truncation depends only on the commit, so the same commit
          # always computes the same version string, which is the whole point
          # of putting a hash in the version.
          #
          # The tradeoff is that a fixed truncation CAN collide where a git
          # abbreviation cannot. That is fine here: COMMIT above is already
          # unique per commit on main, so this hash is a convenience ref for a
          # human, not the identifying key. Colliding versions would share a
          # suffix - they would not be equal, and would not misorder.
          HASH="g$(git rev-parse HEAD | cut -c1-8)"
          NEW_VERSION="${MAJOR}.${COMMIT}.${ISSUE_NUM}-${HASH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Auto-release version: ${NEW_VERSION}  (major=${MAJOR}, commit=${COMMIT}, issue=${ISSUE_NUM}, hash=${HASH})"

      - name: Stamp version into package.json + version.ts
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          perl -i -pe "s/(\"version\":\s*)\"[^\"]+\"/\$1\"$NEW_VERSION\"/" package.json
          # Version shape is <major>.<commit>.<issue>-g<shorthash>; the optional
          # trailing group must accept the prerelease suffix or the stamp
          # silently leaves the 1.0.0 placeholder in place.
          perl -i -pe "s/Conway( Web-Ifc Shim)? v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?/Conway v$NEW_VERSION/" src/version/version.ts

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # WASM cache is populated by the build job earlier in this run.
      - name: Restore WASM build cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      - name: Fail if WASM cache miss
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::WASM cache miss in auto-publish; build should have populated it."
          exit 1

      - name: TypeScript build
        run: yarn build-incremental

      - name: Bundle examples
        run: yarn bundle-examples

      # Publish BEFORE tagging. If publish fails, no stranded tag.
      # npm CLI 11.5.1+ picks up the OIDC token from GHA automatically.
      - name: Publish to npm
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # --tag latest is unconditional. npm only applies `latest`
          # implicitly when the new version beats the HIGHEST-EVER published
          # one (not the current `latest` dist-tag), and it never applies it
          # implicitly to a prerelease — which every version is now, thanks to
          # the -g<hash> suffix. So the implicit path can only ever abort the
          # publish; naming the tag is the whole contract.
          npm publish --access public --tag latest

      # Idempotent tag: skip if already on origin (e.g. on a re-run).
      - name: Create and push tag
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if git ls-remote --tags origin "$NEW_VERSION" | grep -q "refs/tags/$NEW_VERSION$"; then
            echo "Tag $NEW_VERSION already exists on origin; skipping."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$NEW_VERSION" -m "Auto-release $NEW_VERSION"
          git push origin "$NEW_VERSION"
