name: CI

on:
  pull_request:
    # ready_for_review is what makes the draft gate on run-ifc-regression
    # usable: without it, flipping a draft to ready fires no event and the PR
    # would sit with no regression result until the next push.
    #
    # converted_to_draft is the other half of that gate, and it works by
    # cancellation: pushing a PR back to draft fires an event in the same
    # concurrency group below, so cancel-in-progress kills the run that is
    # mid-flight. Without it, a PR you have explicitly pulled back keeps
    # burning a runner slot to completion.
    #
    # Note what the replacement run does, since `build` here is ungated: it
    # re-runs `build`, then stops before the regression. Usually cheap: every
    # emsdk/GENie/emcc step is gated on the wasm cache key, so a hit means only
    # a conway-geom submodule bump pays a real compile. The exception is
    # withdrawing during a cold-cache build — the cancelled run never reaches
    # the save step, so the replacement pays the full emcc compile.
    #
    # Whether that is worth it depends on when you withdraw. During the
    # regression it clearly is: you stop the longer job and pay at most a
    # rebuild. During `build` it is pure loss — `run-ifc-regression` needs
    # `build`, so nothing had started yet and you have bought back nothing.
    # Not free the way it is in Share, where every job is gated and the
    # replacement run skips outright.
    #
    # reopened was missing before the draft gate landed. Leaving it out means
    # a reopened PR keeps whatever conclusions sat on its head SHA -- possibly
    # a `skipped` regression, which reads as passing -- with nothing to
    # re-run it.
    #
    # `edited` is deliberately NOT here, although the `alsocheck:` line
    # lives in the PR description (see resolve-models). It fires on every
    # title, body and base edit, and in this concurrency group each one
    # would cancel the regression in flight and restart `build` on the
    # paid runner - a typo fix in the description would cost a full
    # pipeline. Gating the edited runs off does not rescue it: the
    # cancelled run's replacement would report `skipped`, which satisfies
    # a required check, so editing the description would turn
    # `run-ifc-regression` green without running it.
    #
    # Nothing is lost for the normal lifecycle: the line is written while
    # the PR is a draft, and ready_for_review reads it. resolve-models
    # reads the description LIVE from the API rather than from this event's
    # payload, so after a later edit "Re-run all jobs" picks it up (a
    # re-run replays the original payload, which would not); so does the
    # next push.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    # Skip the heavy build + IFC regression on doc-only PRs. paths-ignore
    # skips the workflow only when EVERY changed file matches — a PR that
    # also touches code/config still runs the full suite. Push-to-main
    # (auto-publish) and rc-tag pushes (perf) are intentionally left
    # unfiltered below.
    # NOTE: if `build` / `run-ifc-regression` are *required* status checks
    # in branch protection, a path-skipped run reports nothing and the PR
    # waits forever — switch to a per-job `if:` gate instead (a skipped-by-if
    # job satisfies a required check; a path-skipped workflow does not).
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'docs/**'
  push:
    branches: [main]
    # Release-candidate tags trigger the EXTENDED suite (the perf-three-*
    # benchmarks). Those benchmarks used to run on every merge — the largest
    # CI cost line (~38 large-runner-min/merge, mostly the 24-min private H3
    # run) — but per-commit perf is redundant while perf is actively reviewed
    # per-model at PR time. Now a full perf sweep runs only when a human
    # blesses a prod-worthy point by pushing an `rc-*` tag. auto-publish's
    # own `<version>` tags start with the major segment (e.g.
    # 1.1556.546-g3eae7637) and do NOT match `rc-*`, so continuous-release
    # tagging never triggers this path.
    tags:
      - 'rc-*'
  # Manual runs from any branch (Actions > CI > Run workflow) so the
  # perf jobs — normally rc-tag only — can be exercised and debugged on a
  # branch without cutting a tag. auto-publish stays push:main-only.
  workflow_dispatch:
    inputs:
      run_private_shards:
        description: >-
          Also run the seven private headline shards (~2.6 GB of private
          LFS, uncached). Off by default: a dispatch is normally for
          debugging perf-three-* on a branch, which needs none of them.
          Turn it on to exercise them before a merge.
        type: boolean
        default: false
      alsocheck:
        description: >-
          Models to also regress and render before/after, as on a PR's
          `alsocheck:` line: private models by shard CODE only (e.g.
          ILNA250), public ones by path in bldrs-ai/test-models (e.g.
          ifc/foo/bar.ifc). Comma or space separated, at most 5. See
          regression/shards/README.md.
        type: string
        default: ''

# Cancel superseded runs so a rapid series of pushes to the same PR doesn't
# leave N full build+regression(+visual-diff) pipelines running to completion
# in parallel on the shared runners — only the newest commit's result matters.
# Grouped by ref (refs/pull/<n>/merge is unique per PR) so PRs never cancel
# each other. cancel-in-progress is scoped to pull_request ONLY: push-to-main
# runs must run to completion — auto-publish tags + publishes to npm, and each
# main commit ships its own version, so cancelling a main run mid-publish (or
# skipping a commit's release) is not acceptable.
#
# Keep this keyed on the REF for push:main, not on github.sha, even though the
# ref key has a known cost. Because every main push shares one ref they all
# land in one group and run one at a time — and `cancel-in-progress: false`
# does not mean "never cancel": GitHub cancels a run still PENDING in a group
# when a newer one joins, so merging three commits inside one pipeline window
# drops the middle one's run and skips that commit's release.
#
# That is the lesser problem. The serialization is what keeps npm's `latest`
# pointing at the newest commit: auto-publish publishes with an unconditional
# `--tag latest` (see the publish step), so two main runs racing can land out
# of order and leave `latest` on the OLDER commit, shipping it to every
# consumer. Since conway#533 the version's minor segment is the commit count,
# so an out-of-order publish no longer *fails* — it just mis-points the tag.
#
# Same caveat for a dropped commit's release: re-running it later publishes a
# version below the one already on `latest` and, with `--tag latest`
# unconditional, drags the tag backwards. Skip the release, or make the
# publish step ordering-safe (which is what making these parallel needs
# anyway). Both tracked in conway#468.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EMSDK_VERSION: '6.0.2'
  EMSDK_CACHE_FOLDER: 'cache/emsdk'
  # Public test-models git ref to track. Resolved to a concrete commit SHA per
  # run (recorded in the PR comment + job summary) so the regression baseline is
  # reproducible without test-models having to cut tags. Override via the
  # repo/environment variable TEST_MODELS_REF (a branch, tag, or full commit SHA).
  TEST_MODELS_REF: ${{ vars.TEST_MODELS_REF || 'main' }}
  TEST_MODELS_PRIVATE_TAG: ${{ vars.TEST_MODELS_PRIVATE_TAG || 'main' }}

jobs:
  build:
    # Paid 150 GB SKU: emcc's working set does not fit the public
    # runner's 14 GB disk. 4 vCPU is enough (the old 2-vCPU image is
    # what failed the compile); disk is why this job stays billed.
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Hermetic, seconds, and deliberately in `build` rather than in the
      # shards it describes: a shard list with no matrix entry never runs,
      # so the job that would catch the mistake is the one that is missing.
      # Checks the <=10 cap, that no model is claimed by two shards, that
      # coverage shards stay public, that the coverage union is still
      # exactly regression/smoke_models.txt, and that each list's
      # `# corpus:` header matches its matrix entry.
      # actionlint, because `shard_list.py check` structurally CANNOT see
      # this class of defect. A duplicate `steps:` key shipped on 099ce94
      # and stopped this file parsing at all - both runs on that SHA were
      # `failure` with ZERO jobs and ZERO check runs, which is the
      # required-check-never-reports trap the paths-ignore note above
      # warns about. `yaml.safe_load` accepted it (PyYAML takes last-wins
      # on a duplicate key) and the include-block scanner only reads
      # `include:` lines, so the check printed "10 shard list(s) OK" over
      # a workflow GitHub could not read. A purpose-built linter is the
      # thing that catches it; pinned so a new actionlint release cannot
      # redden an unrelated PR.
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # shellcheck and pyflakes integrations OFF, deliberately:
          # actionlint shells out to whatever shellcheck the runner image
          # ships, which nothing here pins, so a new shellcheck release
          # can redden an unrelated PR - the exact failure the pinned
          # ACTIONLINT_VERSION prevents for actionlint itself, which
          # pinning actionlint does not extend to shellcheck. A gate has
          # to be deterministic. What remains is actionlint's own pinned,
          # schema-driven checking, which is the defect class this step
          # exists for: duplicate keys, bad `needs`, unknown contexts,
          # malformed expressions.
          #
          # Correcting the record, since this step was first added with a
          # wrong reason attached: the SC2013 that CI reported here was
          # NOT a version-skew false positive. CI lints the pull_request
          # MERGE ref, and #718 had already landed, so the merged tree
          # contained main's `for listed in $(grep ...)` in the Tier A
          # step - a real SC2013 that this branch alone did not have.
          # Running shellcheck against the unmerged branch could not see
          # it. The integration still stays off for the pinning reason
          # above, but turning it back on would mean fixing that line,
          # not arguing about versions.
          /tmp/actionlint -shellcheck= -pyflakes= -color

      - name: Validate regression shard lists
        run: python3 .github/actions/regression-shard/shard_list.py check

      # The alsocheck parser reads attacker-controlled PR text, so its
      # rejection rules are pinned by tests rather than by review alone.
      # Hermetic and about a second; covers shard_list.py and
      # merge_summaries.py too.
      - name: Test the regression-shard scripts (alsocheck parser included)
        run: python3 -m unittest discover -s .github/actions/regression-shard -p 'test_*.py'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The compat/web-ifc constant tables are generated from the web-ifc
      # devDependency (scripts/gen-web-ifc-types.cjs). Regenerate and fail if
      # the committed files drift — catches a web-ifc bump that forgot
      # `yarn gen-web-ifc-types`, or a hand-edit of a generated file. Pure
      # JS + web-ifc, so it runs right after install (no WASM/build needed).
      - name: Check web-ifc tables are up to date
        run: |
          yarn gen-web-ifc-types
          git diff --exit-code -- src/compat/web-ifc/ifc2x4.ts src/compat/web-ifc/types-map.ts \
            || { echo "::error::Generated web-ifc tables are stale. Run 'yarn gen-web-ifc-types' and commit the result."; exit 1; }

      # --- WASM cache: keyed on conway-geom submodule SHA + EMSDK version.
      # On hit, the heavy WASM build (GENie + EMSDK + emcc) is skipped entirely.
      # The regression job depends on this job and consumes the same cache.
      - name: Restore WASM build cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      # --- GENie + EMSDK setup (skipped on WASM cache hit)
      - name: Restore GENie cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        id: genie-cache
        uses: actions/cache@v4
        with:
          path: bin/linux/genie
          key: genie-${{ runner.os }}

      - name: Build GENie
        if: steps.wasm-cache.outputs.cache-hit != 'true' && steps.genie-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/bkaradzic/GENie.git GENie
          (cd GENie && make)
          mkdir -p bin/linux
          cp GENie/bin/linux/genie bin/linux/genie

      - name: Cache Emscripten system libraries
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK_CACHE_FOLDER }}
          key: ${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}

      - name: Export EMSDK paths for subsequent steps
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          which em++
          em++ -v
          EMSDK=$(which em++ | sed 's|upstream/emscripten/em++||')
          EMSCRIPTEN=$(which em++ | sed 's|/em++||')
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSCRIPTEN=$EMSCRIPTEN" >> "$GITHUB_ENV"

      - name: Extract WASM build dependencies
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn extract-wasm-dependencies

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: yarn build-GHA-all

      # tsc --build always runs from scratch here. Earlier we cached
      # compiled/src + compiled/examples + tsbuildinfo, but that subset
      # left compiled/dependencies/conway-geom/index.js missing — the
      # buildinfo claimed everything was up to date and tsc skipped
      # recompiling the conway-geom shim, so the test runner couldn't
      # resolve '../../dependencies/conway-geom/index.js'. A correct TS
      # cache strategy can come back as a separate iteration.
      - name: TypeScript build (incremental)
        run: yarn build-incremental

      - name: Test
        run: yarn test

      - name: Lint
        run: yarn lint

      # --- Tier A: in-repo quick-check geometry goldens (data/ models) ---
      # A hermetic geometry gate that runs in `build` (no test-models clone, no
      # token) so it protects every PR including forks. Each data/ model's digest
      # is compared against a committed golden (data/<name>.csv):
      #   - golden present & matches -> pass
      #   - golden present & differs -> FAIL with a re-bless hint (the gate)
      #   - golden absent            -> warn + emit candidate, exit 0 (bootstrap)
      # Goldens must be produced by CI's pinned EMSDK toolchain to match, so the
      # first run uploads the candidate digests as an artifact; committing them
      # to data/ turns the gate on. Uses the same `ifc_regression_main.js -d`
      # the batch job spawns, so the digest format is identical, and WASM is
      # already loadable here (the jest `yarn test` step above exercises it via
      # the same conway-geom import).
      - name: Tier A quick-check geometry goldens (data/)
        run: |
          set -uo pipefail
          OUT="${GITHUB_WORKSPACE}/tierA-goldens"
          mkdir -p "$OUT"
          shopt -s nullglob
          status=0
          count=0
          refused=0
          # Cover every in-repo quick-check model; deriving the list from
          # data/*.ifc (vs a hard-coded set) means a newly added model is gated
          # as soon as its golden is committed, with no edit here.
          for f in data/*.ifc; do
            count=$((count + 1))
            m=$(basename "$f" .ifc)
            # IFC4X3 fixtures come in two kinds (bldrs-ai/conway#280). One kind
            # is eligible for the IFC4-compatible route (src/ifc/ifc4x3_ifc4_compat.ts),
            # produces a digest, and is gated below like any other model. The
            # other must be REFUSED: those are listed in
            # data/ifc4x3_expected_refusals.txt and asserted refused here (no
            # digest, output naming IFC4X3, non-zero exit). They are asserted
            # rather than excluded, which keeps this loop's "derive the list
            # from data/*.ifc" property and gives the regression binary's
            # refusal its only end-to-end coverage; a silent skip would let it
            # rot unnoticed.
            # Output is captured to a file and echoed, rather than teed through
            # process substitution: the grep below reads this log, and a tee
            # subshell is not guaranteed to have flushed by then.
            log="$OUT/$m.log"
            # Captured via if/else (not `|| true` on the command itself) so
            # `rc` holds the CHILD's real exit status rather than `true`'s: a
            # bare `cmd || true` under this step's `-e` shell discards `cmd`'s
            # status entirely, which is exactly the gap that let the 4X3
            # refusal below regress to exiting 0 while this assertion kept
            # passing (codex review of bldrs-ai/conway#713, P2 -- the
            # `exit()`-with-no-argument defect e5696915 fixed for the gate
            # itself, reintroduced one layer up in this assertion). The
            # if/else still keeps `|| true`'s purpose: a non-zero child exit
            # here must not abort the step.
            if node --experimental-specifier-resolution=node \
              ./compiled/src/ifc/ifc_regression_main.js -d "$f" "$OUT/$m" \
              > "$log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            cat "$log"
            cand="$OUT/$m.csv"
            golden="data/$m.csv"
            if grep -v '^#' data/ifc4x3_expected_refusals.txt | grep -qxF "$m.ifc"; then
              if ! grep -qiE "FILE_SCHEMA[^;]*IFC4X3" "$f"; then
                echo "::error::$f is listed in data/ifc4x3_expected_refusals.txt but does not declare an IFC4X3 FILE_SCHEMA -- the refusal asserted here would not be the IFC4X3 gate's."
                status=1
              elif [ -f "$cand" ]; then
                echo "::error::$f must be refused (data/ifc4x3_expected_refusals.txt) but produced a digest -- IFC4X3 eligibility admitted a file IFC4 cannot decode."
                status=1
              elif ! grep -q "IFC4X3" "$log"; then
                echo "::error::$f produced no digest, but nothing in the output names IFC4X3 -- it failed for some other reason than the IFC4X3 refusal."
                status=1
              elif [ "$rc" -eq 0 ]; then
                echo "::error::$f was refused (no digest; log names IFC4X3) but the regression binary exited 0 -- a refusal must exit non-zero so a caller/script can tell it apart from success."
                status=1
              else
                echo "$f: refused as expected (IFC4X3 refusal, exit $rc)."
                refused=$((refused + 1))
              fi
              continue
            fi
            if [ ! -f "$cand" ]; then
              echo "::error::No digest produced for $f -- parsing or geometry extraction likely failed for this model (see log above)."
              status=1; continue
            fi
            if [ ! -f "$golden" ]; then
              echo "::warning::No golden for $f yet -- download the tierA-goldens artifact and commit $m.csv to data/$m.csv to enable gating."
              continue
            fi
            if diff -u "$golden" "$cand"; then
              echo "$f: geometry digest matches golden."
            else
              echo "::error::Geometry digest changed for $f. If intended, re-bless: replace data/$m.csv with $m.csv from this run's tierA-goldens artifact."
              status=1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No data/*.ifc quick-check models found."
            status=1
          fi
          # The refusal branch above is the regression binary's only end-to-end
          # IFC4X3 refusal coverage. Removing the last fixture together with
          # its list entry would run it zero times and still pass, so require
          # at least one (codex review of bldrs-ai/conway#718, P2). Counted on
          # the "refused as expected" outcome, not on listing, so a listed
          # fixture that failed its assertions does not satisfy it either.
          if [ "$refused" -eq 0 ]; then
            echo "::error::No IFC4X3 refusal was asserted -- data/ifc4x3_expected_refusals.txt must list at least one data/*.ifc fixture that is refused."
            status=1
          fi
          # A listed refusal whose fixture is gone would otherwise stop being
          # asserted without anything failing.
          for listed in $(grep -v '^#' data/ifc4x3_expected_refusals.txt); do
            if [ ! -f "data/$listed" ]; then
              echo "::error::data/ifc4x3_expected_refusals.txt lists $listed, which is not in data/."
              status=1
            fi
          done
          exit $status

      - name: Upload Tier A digest candidates
        if: ${{ always() && hashFiles('tierA-goldens/*.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tierA-goldens-${{ github.run_id }}
          path: tierA-goldens/*.csv

  # ---------------------------------------------------------------------------
  # PR regression: digest batch, sharded, on free ubuntu-24.04.
  #
  # Ten shards max (see regression/shards/README.md):
  #   coverage-1..3  public small models (union = smoke_models.txt)
  #   PSB900, D3D224, ILNA250, DOWA418, O10, BLSN282, AHMAC555
  #                  one private headline model each (codes, not names)
  #
  # A few-minute load gets its own machine so a regression there cannot
  # hide behind a short coverage batch. Skip-smudge + LFS-pull of the
  # shard list only: PSB is ~900 MB and the public runner has 14 GB disk.
  #
  # resolve-models pins one corpus commit for the whole run, so ten
  # shards cannot straddle two states of a moving `main`.
  # regression-pack produces the npm tarball perf jobs consume, in
  # parallel with the shards (both need: build). The aggregator keeps
  # the check name `run-ifc-regression`, AND-reduces the shards, and
  # stitches their summary fragments into the PR comment.
  #
  # A private shard publishes no model bytes, no renders and no model
  # internals in the PR comment: visual-diff is public coverage only,
  # only public corpora are cached (an Actions cache on the default
  # branch is restorable from a fork's pull_request run), and a private
  # fragment is counts only. Its artifact and job log DO carry
  # errors.csv rows, which is a public repo's normal exposure and is
  # recorded as accepted in regression/shards/README.md.
  # ---------------------------------------------------------------------------
  # One corpus commit for the whole run. Each shard used to resolve
  # TEST_MODELS_REF itself, so eleven independent `git ls-remote` calls
  # against a moving `main` could straddle two corpus states: shards
  # digesting against one baseline while visual-diff rendered models
  # pinned from another. Resolving once here makes the run reproducible
  # and is the SHA every downstream job reports.
  resolve-models:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pull-requests: read is for the live description read below; nothing
    # here writes.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      public_sha: ${{ steps.public.outputs.sha }}
      private_sha: ${{ steps.private.outputs.sha }}
      # Whether regression-shard-private runs at all. Consumed by its
      # `if:` and by run-ifc-regression's assert, so the three cannot
      # drift apart. Now also 'true' on a PR whose alsocheck names a
      # headline code; private_scope says which kind of run it is.
      private_expected: ${{ steps.scope.outputs.private_expected }}
      # all: every headline shard (merge, rc, run_private_shards).
      # selected: only the codes in private_selected (alsocheck).
      # none: no headline shard runs.
      private_scope: ${{ steps.scope.outputs.private_scope }}
      private_selected: ${{ steps.scope.outputs.private_selected }}
      # alsocheck. Every value below was validated by alsocheck.py
      # (codes, or public paths found in the pinned public corpus), and
      # consumers still pass them through `env:` and re-validate rather
      # than interpolate them: they started life as PR-body text.
      alsocheck_public: ${{ steps.scope.outputs.alsocheck_public }}
      alsocheck_public_count: ${{ steps.scope.outputs.alsocheck_public_count }}
      alsocheck_private: ${{ steps.scope.outputs.alsocheck_private }}
      alsocheck_private_count: ${{ steps.scope.outputs.alsocheck_private_count }}
      alsocheck_private_extra: ${{ steps.scope.outputs.alsocheck_private_extra }}
      alsocheck_private_requested: ${{ steps.scope.outputs.alsocheck_private_requested }}
      alsocheck_private_skipped: ${{ steps.scope.outputs.alsocheck_private_skipped }}
      alsocheck_matrix: ${{ steps.scope.outputs.alsocheck_matrix }}
      # true | skipped (fork, or a PR without the read token) | none.
      # Whether the write token exists is decided by visual-diff-private,
      # the only job that can see its environment.
      private_render: ${{ steps.scope.outputs.private_render }}
    # `secrets` is not an allowed context in a step-level `if:`; a
    # job-level `env` is how it reaches one. Same trick as
    # regression-shard below. IS_FORK is 'false' on push and
    # workflow_dispatch, where `github.event.pull_request` is null and
    # the `&&` short-circuits - those runs are internal by definition.
    #
    # IS_FORK means "the PR's head is not this repository", compared by
    # name rather than read from `head.repo.fork`: a PR whose head repo
    # was deleted has `head.repo` null, which `.fork` reads as false
    # (internal) and this reads as external, the safe answer.
    #
    # The write token is not checked here: visual-diff-private checks it
    # itself, as the only job that uses it.
    env:
      TOKEN_PRESENT: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN != '' }}
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # The alsocheck parser and the shard lists it reads the headline
      # codes from. Sparse: this job has a 5-minute budget.
      - name: Checkout alsocheck parser and shard lists
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/regression-shard
            regression/shards

      # Recording a SHA (not a tag) is what makes the baseline
      # reproducible: test-models does not tag reliably, so we track its
      # main branch and pin per-run to the commit we actually tested.
      # Run ls-remote as its own command (errexit) so a transient network
      # failure aborts loudly instead of being masked by a pipeline and
      # silently falling back to a moving ref. Annotated tags advertise a
      # peeled "<ref>^{}" commit line, preferred over the tag-object id.
      - name: Resolve public test-models SHA
        id: public
        run: |
          set -euo pipefail
          REF="$TEST_MODELS_REF"
          REFS=$(git ls-remote https://github.com/bldrs-ai/test-models.git "$REF")
          SHA=$(printf '%s\n' "$REFS" | awk '$2 ~ /\^\{\}$/ { print $1; found=1; exit } NR==1 { first=$1 } END { if (!found && first) print first }')
          # No advertised match -> REF is itself a raw commit SHA.
          if [ -z "$SHA" ]; then SHA="$REF"; fi
          # Refuse anything that is not a 40-hex commit SHA rather than
          # poisoning cache keys and git-diff targets with a moving ref.
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve TEST_MODELS_REF='$REF' to a commit SHA (got '$SHA'). Use an existing branch, tag, or full 40-char commit SHA."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "**Models:** test-models @ \`$SHA\` (ref \`$REF\`)" >> "$GITHUB_STEP_SUMMARY"

      # What an alsocheck path is checked against: the public corpus's
      # file list at the pinned commit. Trees only (blob:none), so this is
      # a few hundred KB however large the corpus is. A path that is not
      # in it is rejected without being repeated - it may be a private
      # filename typed by mistake.
      - name: List public corpus files at the pinned commit
        if: github.event_name != 'push'
        env:
          SHA: ${{ steps.public.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q public-tree
          git -C public-tree remote add origin https://github.com/bldrs-ai/test-models.git
          git -C public-tree fetch -q --depth 1 --filter=blob:none origin "$SHA"
          git -C public-tree ls-tree -r -z --name-only "$SHA" > public_tree.z

      # The PR description is attacker-controlled (a fork's author writes
      # it). It reaches the parser only through a file, never through a
      # `${{ }}` in this script. Read LIVE from the API so that "Re-run
      # all jobs" after an edit sees the edit (a re-run replays the
      # original event payload; see `edited` at the top of this file).
      # The payload is the fallback if the API read fails.
      - name: Read the PR description
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if ! gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' > pr_body.txt; then
            echo "::warning::Could not read the PR description from the API; using the copy in this run's event payload, which predates any edit since the event."
            printf '%s' "$EVENT_BODY" > pr_body.txt
          fi

      # Which private work this run does, and what alsocheck asked for.
      # alsocheck.py prints a rejected entry by position and reason only.
      - name: Scope of this run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ALSOCHECK: ${{ inputs.alsocheck }}
          RUN_PRIVATE_SHARDS: ${{ inputs.run_private_shards }}
        run: |
          set -euo pipefail
          ARGS=(--shard-dir regression/shards)
          if [ -f pr_body.txt ]; then ARGS+=(--body-file pr_body.txt); fi
          if [ -f public_tree.z ]; then ARGS+=(--public-tree public_tree.z); fi
          python3 .github/actions/regression-shard/alsocheck.py resolve "${ARGS[@]}"

      # Where private shards DO run, a missing token is a
      # misconfiguration wearing a skip's clothes: a matrix entry whose
      # every step skips still reports success, so a push to main could
      # reach auto-publish having tested none of the seven headline
      # models. Fail here instead - before seven jobs start, and loudly
      # enough to name the cause. On a pull_request alsocheck.py has
      # already dropped the private entries of any run without the token
      # - a fork, or a same-repo bot PR such as Dependabot's - with a
      # note, so this fires only on push and dispatch.
      - name: Require the private-models token where private shards run
        if: steps.scope.outputs.private_needed == 'true' && env.TOKEN_PRESENT != 'true' && env.IS_FORK != 'true'
        run: |
          echo "::error::TEST_MODELS_PRIVATE_TOKEN is empty or unset on a run that executes private shards (event: ${{ github.event_name }}, ref: ${{ github.ref }}, scope: ${{ steps.scope.outputs.private_scope }})."
          echo "::error::Those shards would skip every step and still report success, so this fails instead."
          echo "::error::Set the secret, or if the private corpus is deliberately unavailable, remove the entries from the regression-shard-private matrix (or the private codes from this PR's alsocheck line)."
          exit 1

      # Skipped when no private work is needed (a PR without private
      # alsocheck entries) and on a fork (no token); an empty output is
      # the expected quiet path in both, not a failure.
      - name: Resolve private test-models SHA
        id: private
        if: steps.scope.outputs.private_needed == 'true' && env.TOKEN_PRESENT == 'true'
        env:
          TOKEN: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          REF="$TEST_MODELS_PRIVATE_TAG"
          # Per-process header, not a URL: nothing on disk or in argv.
          B64=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$B64"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $B64"
          URL="https://github.com/bldrs-ai/test-models-private.git"
          REFS=$(git ls-remote "$URL" "$REF")
          SHA=$(printf '%s\n' "$REFS" | awk '$2 ~ /\^\{\}$/ { print $1; found=1; exit } NR==1 { first=$1 } END { if (!found && first) print first }')
          if [ -z "$SHA" ]; then SHA="$REF"; fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve TEST_MODELS_PRIVATE_TAG='$REF' to a commit SHA (got '$SHA')."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "**Private models:** test-models-private @ \`$SHA\` (ref \`$REF\`)" >> "$GITHUB_STEP_SUMMARY"

  regression-pack:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package_tgz: ${{ steps.npm_pack.outputs.package_tgz }}
    steps:
      - name: Checkout Conway Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Restore WASM build cache (populated by build)
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      - name: Fail if WASM cache miss
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::WASM cache miss in regression-pack; build should have populated it."
          exit 1

      - name: TypeScript build
        run: yarn build-incremental

      - name: Bump minor for artifact naming
        run: yarn bumpMinor

      - name: Bundle examples
        run: yarn bundle-examples

      - name: Create NPM Package
        id: npm_pack
        run: |
          PACKAGE_TGZ=$(npm pack 2>&1 | grep "filename:" | sed 's/.*filename: //')
          echo "package_tgz=${PACKAGE_TGZ}" >> "$GITHUB_OUTPUT"

      - name: Upload NPM Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.npm_pack.outputs.package_tgz }}
          path: ${{ steps.npm_pack.outputs.package_tgz }}

  # Public coverage, on every ready PR and every merge. These are the
  # small/fast models; their union is regression/smoke_models.txt.
  regression-shard:
    needs: [build, resolve-models]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: coverage-1
            concurrency: '2'
          - id: coverage-2
            concurrency: '2'
          - id: coverage-3
            concurrency: '2'
    name: regression-shard ${{ matrix.id }}
    steps:
      - name: Checkout Conway Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Restore WASM build cache (populated by build)
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      - name: Fail if WASM cache miss
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::WASM cache miss in regression shard; build should have populated it."
          exit 1

      - name: TypeScript build
        run: yarn build-incremental

      - name: Run shard
        uses: ./.github/actions/regression-shard
        with:
          shard-id: ${{ matrix.id }}
          shard-file: regression/shards/${{ matrix.id }}.txt
          corpus: public
          models-ref: ${{ needs.resolve-models.outputs.public_sha }}
          models-repo: bldrs-ai/test-models
          models-token: ''
          concurrency: ${{ matrix.concurrency }}
          allow-visual-diff: 'true'

  # Private headline models: one shard each, and deliberately NOT on
  # pull_request.
  #
  # Each of these is a few-minute load that gets its own machine, so a
  # regression cannot hide behind a short coverage batch. But none of
  # them can be cached: Conway is public, an Actions cache written on the
  # default branch is restorable from a fork's pull_request run, and a
  # cached private shard would hand over the model bytes (the token is
  # no longer on disk: the composite passes it per process as an
  # http.extraheader, never in a remote URL). Uncached means ~2.6 GB of private LFS per run,
  # and on every ready-PR push that is the dominant cost of the whole
  # pipeline for coverage that did not exist before sharding.
  #
  # So they run on merge to main and on rc tags, where the traffic is
  # paid per landed change rather than per push. A headline regression is
  # caught before a release rather than at review time, which is the
  # trade. See regression/shards/README.md.
  #
  # A job-level `if:` on the run's scope, rather than per-step gates in
  # one combined matrix: a matrix entry whose every step skips still
  # reports `success`, which is exactly how a private shard could have
  # gone green without digesting anything.
  #
  # alsocheck CHANGES that invariant, for one case. A PR that names a
  # headline code (`alsocheck: ILNA250`) runs this job (private_expected
  # is 'true') with private_scope 'selected', and the entries it did not
  # name gate their own steps off in the first step below - the matrix
  # has to stay static, because `shard_list.py check` reads it. So an
  # unselected entry DOES report `success` having digested nothing. Two
  # things keep that from hiding a real skip: its job summary says "not
  # selected" in so many words, and run-ifc-regression asserts at the
  # ARTIFACT level that exactly the selected shards uploaded results (a
  # selected entry that skipped by mistake has none; an unselected one
  # that ran anyway has one). On merge, rc and run_private_shards the
  # scope is 'all' and every entry runs, as before.
  regression-shard-private:
    needs: [build, resolve-models]
    if: needs.resolve-models.outputs.private_expected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Codes, not filenames: leading capitals plus size in MB. This
          # repo is public and the matrix is committed in it. The mapping
          # to real paths lives in regression/shard_codes.txt inside
          # bldrs-ai/test-models-private.
          - id: PSB900
            concurrency: '1'
          - id: D3D224
            concurrency: '1'
          - id: ILNA250
            concurrency: '1'
          - id: DOWA418
            concurrency: '1'
          - id: O10
            concurrency: '1'
          - id: BLSN282
            concurrency: '1'
          - id: AHMAC555
            concurrency: '1'
    name: regression-shard-private ${{ matrix.id }}
    steps:
      # First, and before anything that costs: on an alsocheck PR most
      # entries are not selected and stop here in seconds. Every later
      # step is gated on `run`.
      - name: Is this shard selected?
        id: select
        env:
          ID: ${{ matrix.id }}
          SCOPE: ${{ needs.resolve-models.outputs.private_scope }}
          SELECTED: ${{ needs.resolve-models.outputs.private_selected }}
        run: |
          set -euo pipefail
          RUN=false
          if [ "$SCOPE" = all ]; then
            RUN=true
          elif [ "$SCOPE" = selected ]; then
            case " $SELECTED " in *" $ID "*) RUN=true ;; esac
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if [ "$RUN" = true ]; then
            echo "$ID: selected (scope $SCOPE)."
          else
            # Says so where a reader of a green check looks first.
            echo "::notice::$ID: NOT SELECTED this run - nothing digested. This run's alsocheck selected only: ${SELECTED:-none}."
            printf '### %s: not selected\n\nThis shard did **not** run: the success it reports means nothing was digested. This run (scope: %s) selected only: %s.\n' \
              "$ID" "$SCOPE" "${SELECTED:-none}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout Conway Repo
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        if: steps.select.outputs.run == 'true'
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.select.outputs.run == 'true'
        run: yarn install --frozen-lockfile

      - name: Restore WASM build cache (populated by build)
        if: steps.select.outputs.run == 'true'
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      - name: Fail if WASM cache miss
        if: steps.select.outputs.run == 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::WASM cache miss in regression shard; build should have populated it."
          exit 1

      - name: TypeScript build
        if: steps.select.outputs.run == 'true'
        run: yarn build-incremental

      - name: Run shard
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/regression-shard
        with:
          shard-id: ${{ matrix.id }}
          shard-file: regression/shards/${{ matrix.id }}.txt
          corpus: private
          models-ref: ${{ needs.resolve-models.outputs.private_sha }}
          models-repo: bldrs-ai/test-models-private
          models-token: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN }}
          concurrency: ${{ matrix.concurrency }}
          allow-visual-diff: 'false'


  # alsocheck: models a PR named on its `alsocheck:` line (or a dispatch
  # in its `alsocheck` input) that are not a whole headline shard -
  # public corpus paths, and private codes outside the seven. Up to two
  # entries, built by resolve-models: `alsocheck-public` and
  # `alsocheck-private`, each running ONE generated shard list through
  # the same composite action as every other shard, so the same digest,
  # failed.csv and zero-geometry gates apply.
  #
  # Outside the "at most 10 shards" cap, deliberately: the cap is on the
  # FIXED matrices `shard_list.py check` reads, and this one is dynamic,
  # never more than two entries, and runs only when asked. `check`
  # reserves the `alsocheck*` ids so no committed list can collide with
  # these artifacts.
  #
  # A private entry is uncached and never renders here (the private
  # visual diff is visual-diff-private, which publishes nothing to this
  # repo). On a fork resolve-models drops private entries, so the private
  # entry never exists without the token.
  regression-alsocheck:
    needs: [build, resolve-models]
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.resolve-models.outputs.alsocheck_matrix != '[]' &&
      needs.resolve-models.outputs.alsocheck_matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-models.outputs.alsocheck_matrix) }}
    name: regression-alsocheck ${{ matrix.id }}
    steps:
      - name: Checkout Conway Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The list is generated, not committed. ENTRIES crosses from
      # resolve-models through `env:` and is validated again before it is
      # written: it began as PR-body text.
      - name: Write this run's alsocheck list
        env:
          CORPUS: ${{ matrix.corpus }}
          ID: ${{ matrix.id }}
          ENTRIES: ${{ matrix.corpus == 'private' && needs.resolve-models.outputs.alsocheck_private_extra || needs.resolve-models.outputs.alsocheck_public }}
        run: |
          set -euo pipefail
          case "$ID:$CORPUS" in
            alsocheck-public:public|alsocheck-private:private) ;;
            *) echo "::error::unexpected alsocheck matrix entry"; exit 1 ;;
          esac
          python3 .github/actions/regression-shard/alsocheck.py write-list \
            --corpus "$CORPUS" --out "alsocheck/$ID.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Restore WASM build cache (populated by build)
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      - name: Fail if WASM cache miss
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::WASM cache miss in regression shard; build should have populated it."
          exit 1

      - name: TypeScript build
        run: yarn build-incremental

      # allow-visual-diff is 'false' for BOTH entries. Private: never
      # rendered here, as for every private shard. Public: its models are
      # rendered unconditionally by visual-diff's alsocheck section, so a
      # digest-changed list from this shard would only duplicate them.
      #
      # by-code for the private entry: it may name ANY code in the
      # manifest, and only the seven headline basenames are accepted in
      # public logs and artifacts. The batch runs on <CODE><ext> hard
      # links, so its log, every CSV row and the artifact carry the code.
      # require-rows: a generated list is new every run, so prove the
      # batch read each model rather than trusting its exit status.
      - name: Run shard
        uses: ./.github/actions/regression-shard
        with:
          shard-id: ${{ matrix.id }}
          shard-file: alsocheck/${{ matrix.id }}.txt
          corpus: ${{ matrix.corpus }}
          models-ref: ${{ matrix.corpus == 'private' && needs.resolve-models.outputs.private_sha || needs.resolve-models.outputs.public_sha }}
          models-repo: ${{ matrix.corpus == 'private' && 'bldrs-ai/test-models-private' || 'bldrs-ai/test-models' }}
          models-token: ${{ matrix.corpus == 'private' && secrets.TEST_MODELS_PRIVATE_TOKEN || '' }}
          concurrency: '1'
          allow-visual-diff: 'false'
          by-code: ${{ matrix.corpus == 'private' }}
          require-rows: 'true'

  # Required check name. Must stay `run-ifc-regression` — README and any
  # status-check consumers match on it. Tiny: it AND-reduces the shards
  # and merges public visual-diff lists.
  run-ifc-regression:
    name: run-ifc-regression
    needs: [resolve-models, regression-pack, regression-shard, regression-shard-private, regression-alsocheck]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # post the regression comment
    outputs:
      package_tgz: ${{ needs.regression-pack.outputs.package_tgz }}
      test_models_sha: ${{ needs.resolve-models.outputs.public_sha }}
      visual_diff_count: ${{ steps.concat.outputs.count }}
    steps:
      # For the shard lists and the merge script only.
      - name: Checkout Conway Repo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download public visual-diff lists
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: visual-diff-models-*
          path: vdiff-in
          merge-multiple: false

      # Shards that died before uploading simply have no fragment;
      # merge_summaries.py names them in the comment.
      - name: Download shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: regression-shard-*
          path: shards-in
          merge-multiple: false

      - name: Concatenate changed-model lists
        id: concat
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path('vdiff-in')
          lines = []
          if root.is_dir():
              for p in sorted(root.rglob('changed_models.txt')):
                  lines.extend(l.strip() for l in p.read_text().splitlines() if l.strip())
          uniq = sorted(set(lines))
          Path('changed_models.txt').write_text(('\n'.join(uniq) + '\n') if uniq else '')
          count = len(uniq)
          print(f'{count} public digest-changed model(s)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'count={count}\n')
          PY

      - name: Upload merged changed-model list
        if: steps.concat.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-models-${{ github.run_id }}
          path: changed_models.txt

      # Rebuilds the report the single-job version posted: per-shard
      # failed.csv (full) and errors.csv (delta vs the pinned corpus
      # commit, scoped to the shard), plus the slowest models. Built
      # BEFORE the AND-reduce below so a red shard still gets its rows
      # quoted on the PR - a crash used to produce no comment at all and
      # you had to open the job log to see WHICH model died.
      # alsocheck values go through env: they began as PR-body text,
      # validated or not.
      - name: Build regression comment
        env:
          PRIVATE_SCOPE: ${{ needs.resolve-models.outputs.private_scope }}
          PRIVATE_SELECTED: ${{ needs.resolve-models.outputs.private_selected }}
          ALSOCHECK_PUBLIC: ${{ needs.resolve-models.outputs.alsocheck_public }}
          ALSOCHECK_PRIVATE: ${{ needs.resolve-models.outputs.alsocheck_private_requested }}
          ALSOCHECK_PRIVATE_SKIPPED: ${{ needs.resolve-models.outputs.alsocheck_private_skipped }}
          PRIVATE_RENDER: ${{ needs.resolve-models.outputs.private_render }}
          EXTERNAL_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -uo pipefail
          # Non-fatal for the same reason as the per-shard fragment: the
          # AND-reduce below is the gate, and a broken report must not
          # stand in for a broken shard.
          python3 .github/actions/regression-shard/merge_summaries.py \
            --artifacts shards-in \
            --out regression_comment.md \
            --public-sha "${{ needs.resolve-models.outputs.public_sha }}" \
            --private-sha "${{ needs.resolve-models.outputs.private_sha }}" \
            --package "${{ needs.regression-pack.outputs.package_tgz }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --visual-diff-count "${{ steps.concat.outputs.count }}" \
            --private-reason "${{ needs.resolve-models.outputs.private_expected == 'true' && 'no-token' || 'not-on-prs' }}" \
            --private-scope "$PRIVATE_SCOPE" \
            --private-selected "$PRIVATE_SELECTED" \
            --alsocheck-public "${ALSOCHECK_PUBLIC:-[]}" \
            --alsocheck-private "${ALSOCHECK_PRIVATE:-[]}" \
            --alsocheck-private-skipped "$ALSOCHECK_PRIVATE_SKIPPED" \
            --private-render "${PRIVATE_RENDER:-none}" \
            --external-pr "$EXTERNAL_PR" \
            || echo "::warning::Could not build the regression comment; the regression-shard-* artifacts still hold every shard's CSVs."

      # The same report in the job summary, so a dispatch (which has no PR
      # to comment on) still shows it, alsocheck section included. It is
      # the PR comment's content, so it publishes nothing new.
      - name: Regression report in the job summary
        if: ${{ !cancelled() && hashFiles('regression_comment.md') != '' }}
        run: cat regression_comment.md >> "$GITHUB_STEP_SUMMARY"

      # Not on a cancelled run. This job is always(), so a superseding
      # push still starts it after the shards were cancelled, and the
      # comment then reports every shard as "failed before it could
      # report" — run 45344173663 posted exactly that. The guard is on
      # this step, not the job: a job skipped on cancel reports
      # `skipped`, which satisfies a required check, so the AND-reduce
      # below must keep running and stay red.
      #
      # success() is spelled out because naming any status function
      # drops the implicit one, and this step should still not post
      # after an earlier step in this job failed.
      #
      # Not on a PR whose head is another repository either: its
      # GITHUB_TOKEN is read-only whatever `permissions:` says, so the
      # comment would 403 and turn this required check red on every fork
      # PR. The report is in the job summary above instead.
      - name: Comment on Pull Request with regression results
        if: ${{ success() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('regression_comment.md') != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: regression_comment.md

      # Runs LAST, so a failing shard does not take the comment with it.
      #
      # regression-shard-private is asserted BOTH ways on purpose. Where
      # it was expected - merge, rc, run_private_shards, or a PR whose
      # alsocheck named a headline code - it must be `success`; anywhere
      # else (a pull_request that asked for nothing private) it must be
      # `skipped`. So neither a private shard that quietly stopped running
      # on merge, nor one that started running on PRs and spending private
      # LFS, can pass unnoticed. regression-alsocheck is held the same way.
      #
      # The job result is no longer enough on its own: under an alsocheck
      # selection the unselected entries report success having run
      # nothing, so a selected entry that skipped by mistake would look
      # identical. `verify-artifacts` closes that at the artifact level:
      # exactly the expected shards uploaded results - none missing, and
      # no unselected headline shard spent private LFS.
      - name: All shards passed
        env:
          PRIVATE_EXPECTED: ${{ needs.resolve-models.outputs.private_expected }}
          PRIVATE_SCOPE: ${{ needs.resolve-models.outputs.private_scope }}
          PRIVATE_SELECTED: ${{ needs.resolve-models.outputs.private_selected }}
          ALSOCHECK_MATRIX: ${{ needs.resolve-models.outputs.alsocheck_matrix }}
          RESOLVE_RESULT: ${{ needs.resolve-models.result }}
          PACK_RESULT: ${{ needs.regression-pack.result }}
          SHARD_RESULT: ${{ needs.regression-shard.result }}
          PRIVATE_RESULT: ${{ needs.regression-shard-private.result }}
          ALSO_RESULT: ${{ needs.regression-alsocheck.result }}
        run: |
          set -euo pipefail
          echo "resolve-models:           $RESOLVE_RESULT"
          echo "regression-pack:          $PACK_RESULT"
          echo "regression-shard:         $SHARD_RESULT"
          echo "regression-shard-private: $PRIVATE_RESULT (event: $GITHUB_EVENT_NAME, scope: ${PRIVATE_SCOPE:-?}, selected: ${PRIVATE_SELECTED:-none})"
          echo "regression-alsocheck:     $ALSO_RESULT (matrix: ${ALSOCHECK_MATRIX:-?})"
          test "$RESOLVE_RESULT" = "success"
          test "$PACK_RESULT" = "success"
          test "$SHARD_RESULT" = "success"
          if [ "$PRIVATE_EXPECTED" = "true" ]; then
            test "$PRIVATE_RESULT" = "success"
          else
            test "$PRIVATE_RESULT" = "skipped"
          fi
          if [ -n "$ALSOCHECK_MATRIX" ] && [ "$ALSOCHECK_MATRIX" != "[]" ]; then
            test "$ALSO_RESULT" = "success"
          else
            test "$ALSO_RESULT" = "skipped"
          fi
          python3 .github/actions/regression-shard/alsocheck.py verify-artifacts \
            --artifacts shards-in --shard-dir regression/shards

  # ---------------------------------------------------------------------------
  # Visual diff: render before/after images for every model whose regression
  # digest changed, so digest churn is reviewable as pictures instead of hex.
  # Base engine = the published @bldrs-ai/conway (what main ships today);
  # candidate = this run's tarball. Rendering is scripts/render_glb.cjs, a
  # pure-JS rasterizer — no headless-gl, no Xvfb, no Node pin — so this runs
  # on a stock runner. Each pair shares one camera (framed on the union of
  # both bounds): a geometry regression that moves the bounds reads as an
  # obvious scale/shape difference. Images are pushed to the
  # visual-diff-assets branch because PR comments can only embed hosted
  # files; the comment links them by commit SHA so rows stay immutable.
  # ---------------------------------------------------------------------------
  visual-diff:
    needs: [resolve-models, run-ifc-regression]
    # The draft clause is redundant today — a skipped `needs` job skips this
    # one regardless — but it is stated so the draft rule is greppable from
    # every job it governs, and so this stays correct now that the job has
    # a !cancelled() guard.
    #
    # The guard is load-bearing, not tidy. An `if:` with no status
    # function gets an implicit success(), and GitHub evaluates that over
    # the WHOLE dependency chain, not just `needs`: "a failure or skip
    # applies to all jobs in the dependency chain from the point of
    # failure or skip onwards" (workflow syntax, jobs.<job_id>.needs).
    # run-ifc-regression needs regression-shard-private, which is
    # `skipped` on every pull request, so since #707 this job was skipped
    # on every PR even with digest-changed models to render (bldrs-ai/conway#801,
    # run 45560353673: visual_diff_count=1, visual-diff skipped). So the
    # condition names the one result it depends on instead:
    # run-ifc-regression is the AND-reduce gate, and its success already
    # means every shard came out as expected (including "skipped where
    # it should be"). Same shape on every job downstream of it.
    #
    # Two lists, two sections. Digest-changed models, on a pull request,
    # as before. alsocheck PUBLIC models, on a pull request or a dispatch,
    # rendered whether or not their digest moved. Private alsocheck
    # models are never rendered here: see visual-diff-private.
    #
    # Not for a PR whose head is another repository (a fork, or a
    # deleted head): its GITHUB_TOKEN is read-only, so it can neither
    # push the images nor comment, and the job would go red at the
    # first. The regression comment says the visual diff was not run.
    if: >-
      !cancelled() &&
      needs.resolve-models.result == 'success' &&
      needs.run-ifc-regression.result == 'success' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (needs.run-ifc-regression.outputs.visual_diff_count != '0' ||
         needs.resolve-models.outputs.alsocheck_public_count != '0')) ||
       (github.event_name == 'workflow_dispatch' &&
        needs.resolve-models.outputs.alsocheck_public_count != '0'))
    # Public ubuntu-24.04 is 4 vCPU / 16 GB — more RAM than the paid
    # 8 GB SKU this used to share. The allocation crash that forced the
    # large runner was on the old 2-vCPU/7 GB image. Disk fits because
    # this job never materializes the corpus: skip-smudge clone, then an
    # LFS pull of the listed models only.
    #
    # 45 minutes: the 30 this job had was sized for --max 24 digest-changed
    # models; alsocheck adds up to 5 more at the same 180 s export
    # timeout, which is up to 15 more minutes when every one hangs.
    # Neither figure is a worst case for all 29 hanging (that is 87
    # minutes); like the 30 before it, this budgets for a few.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write       # push rendered PNGs to visual-diff-assets
      pull-requests: write  # post the before/after comment
    env:
      # Digest-changed models are a pull-request section only; a dispatch
      # renders just what its alsocheck input named.
      CHANGED_SECTION: ${{ github.event_name == 'pull_request' && needs.run-ifc-regression.outputs.visual_diff_count != '0' }}
    steps:
      - name: Checkout conway (render scripts)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download changed-model list
        if: env.CHANGED_SECTION == 'true'
        uses: actions/download-artifact@v4
        with:
          name: visual-diff-models-${{ github.run_id }}

      # Public paths only (resolve-models checked each is a file in the
      # pinned public corpus); re-validated on the way in, via env. A
      # model in both lists is rendered once, in the alsocheck section,
      # where it is never threshold-suppressed.
      - name: Write alsocheck model list
        env:
          ENTRIES: ${{ needs.resolve-models.outputs.alsocheck_public }}
        run: |
          set -euo pipefail
          touch changed_models.txt
          if [ "$CHANGED_SECTION" != true ]; then : > changed_models.txt; fi
          if [ -n "$ENTRIES" ] && [ "$ENTRIES" != "[]" ]; then
            python3 .github/actions/regression-shard/alsocheck.py write-list \
              --corpus public --out alsocheck_list.txt
            grep -v '^#' alsocheck_list.txt > also_models.txt
            # Drop alsocheck models from the changed list (its lines may
            # carry a `\tnew` marker, so compare the path field only).
            awk -F'\t' 'NR==FNR { also[$0]=1; next } !($1 in also)' \
              also_models.txt changed_models.txt > changed_rest.txt
            mv changed_rest.txt changed_models.txt
          else
            : > also_models.txt
          fi
          echo "$(wc -l < changed_models.txt) digest-changed, $(wc -l < also_models.txt) alsocheck model(s) to render"

      - name: Engines (candidate + published base)
        uses: ./.github/actions/visual-diff-engines
        with:
          package-tgz: ${{ needs.run-ifc-regression.outputs.package_tgz }}

      # No cache to restore: the shards cache `models` keyed on their own
      # list, which is neither this path nor this content. A skip-smudge
      # clone is a few seconds and a few MB, so there is nothing here
      # worth a cache entry - the expensive part is the LFS pull below,
      # and that is already narrowed to the listed models.
      - name: Checkout Test Models Repo
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          SHA: ${{ needs.run-ifc-regression.outputs.test_models_sha }}
        run: |
          git init test-models
          git -C test-models remote add origin https://github.com/bldrs-ai/test-models.git
          git -C test-models fetch --depth 1 origin "$SHA"
          git -C test-models checkout "$SHA"

      # Pull LFS only for the models this job will render. A full
      # `ifc/**,step/**` pull is ~3 GB and does not fit on 14 GB disk.
      # Stubs used to be tolerated as "no geometry"; that blessed two
      # pointer files as engine bugs (#477). The batch now fails a stub
      # (#486). This job still continues on a leftover stub — one blank
      # image, not a committed falsehood — but the warning says that.
      - name: Materialize LFS model files
        run: |
          python3 - <<'EOF'
          import subprocess
          from pathlib import Path

          def is_stub(path):
              # Pointer-sized prefix only: these models run to hundreds of
              # MB and read_bytes()[:200] allocates the whole file.
              with path.open('rb') as fh:
                  head = fh.read(200)
              return (head.startswith(b'version https://git-lfs')
                      or b'git-lfs.github.com' in head)

          root = Path('test-models')
          rels = []
          for listing in ('changed_models.txt', 'also_models.txt'):
              for line in open(listing):
                  rel = line.split('\t', 1)[0].strip()
                  if rel and rel not in rels:
                      rels.append(rel)
          stubs = []
          for rel in rels:
              p = root / rel
              if not p.is_file():
                  print(f'::warning::listed model missing: {rel}')
                  continue
              if is_stub(p):
                  stubs.append(rel)
          print(f'{len(rels)} listed models, {len(stubs)} LFS stubs to pull')
          if not stubs:
              raise SystemExit(0)
          subprocess.check_call(['git', 'lfs', 'install', '--local'], cwd=root)
          subprocess.check_call(
              ['git', 'lfs', 'pull', '--include=' + ','.join(stubs)], cwd=root)
          left = [rel for rel in stubs if is_stub(root / rel)]
          if left:
              print('::warning::unsmudged LFS pointer stub(s) after pull — '
                    'blank renders for these are a missing file, not a geometry '
                    'regression: ' + ', '.join(left))
          EOF

      # --export-timeout matches rc-regression's rather than taking the
      # script's 600 s default. The default exists to preserve this job's
      # historical 10 minutes, but 600 s is not a cap this job can afford:
      # rc has 120 minutes for --max 60, so one hung export costs it ~2.5%
      # of its budget, while this job had 30 minutes for --max 24, where
      # the same hang costs ~45% and two end the job. Same runner class as
      # rc (4 vCPU) with more RAM (16 GB vs 8), the same renderer and the
      # same threshold, so rc's 180 s carries over. conway#792 is the case
      # it guards: a GLB writer that hit bad_alloc and never exited.
      #
      # alsocheck models render with --diff-threshold -1, which no pixel
      # fraction is below: a model a PR asked about is shown even when it
      # renders identically - "no visible change" is the answer it asked
      # for. At most five (alsocheck.py's cap), so the 30 minutes holds.
      - name: Render before/after pairs
        run: |
          set -euo pipefail
          mkdir -p vdout
          if [ -s changed_models.txt ]; then
            sed "s|^|$PWD/test-models/|" changed_models.txt > abs_models.txt
            node scripts/visual_diff_report.cjs \
              --models abs_models.txt \
              --base engines/base --cand engines/cand \
              --out vdout --max 24 \
              --diff-threshold 0.0005 \
              --export-timeout 180
          fi
          if [ -s also_models.txt ]; then
            sed "s|^|$PWD/test-models/|" also_models.txt > abs_also.txt
            node scripts/visual_diff_report.cjs \
              --models abs_also.txt \
              --base engines/base --cand engines/cand \
              --out vdout/alsocheck --max 5 \
              --diff-threshold -1 \
              --export-timeout 180
          fi

      - name: Publish images to assets branch
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A dispatch has no PR number; its renders go under dispatch/.
          DEST: ${{ github.event_name == 'pull_request' && format('pr-{0}/{1}', github.event.pull_request.number, github.run_id) || format('dispatch/{0}', github.run_id) }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git clone --depth 1 --branch visual-diff-assets "$REPO_URL" assets 2>/dev/null; then
            cd assets
          else
            # First ever visual diff: the assets branch doesn't exist yet.
            mkdir assets && cd assets
            git init -b visual-diff-assets
            git remote add origin "$REPO_URL"
          fi
          mkdir -p "$DEST/alsocheck"
          cp ../vdout/*.png "$DEST"/ 2>/dev/null || true
          cp ../vdout/alsocheck/*.png "$DEST/alsocheck"/ 2>/dev/null || true
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Visual diff assets for ${DEST} (run ${{ github.run_id }})" \
            || true
          # Another PR's visual-diff job can push between our clone and push;
          # rebase (assets commits never conflict — disjoint run-id dirs).
          for i in 1 2 3; do
            git push origin visual-diff-assets && break
            git pull --rebase origin visual-diff-assets || true
            sleep $((i * 2))
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Finalize report
        run: |
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.assets.outputs.sha }}/${{ steps.assets.outputs.dest }}"
          {
            if [ -f vdout/report.md ]; then
              echo "## Visual Diff (digest-changed & new models)"
            else
              echo "## Visual Diff (alsocheck)"
            fi
            echo ""
            echo "Base: published \`@bldrs-ai/conway\` (main). Candidate: this PR's build."
            echo "Each row shares one camera framed on the union of both bounds — scale differences are real."
            echo ""
            if [ -f vdout/alsocheck/report.md ]; then
              echo "### alsocheck (public models this PR named; always shown)"
              echo ""
              sed "s|RAW_URL_BASE|$RAW/alsocheck|g" vdout/alsocheck/report.md
              echo ""
            fi
            if [ -f vdout/report.md ]; then
              if [ -f vdout/alsocheck/report.md ]; then
                echo "### Digest-changed models"
                echo ""
              fi
              sed "s|RAW_URL_BASE|$RAW|g" vdout/report.md
            fi
          } > comment.md

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment.md

      # A dispatch has no PR to comment on; the report goes here instead.
      - name: Report in the job summary
        if: github.event_name != 'pull_request'
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Visual diff for PRIVATE alsocheck models. Renders never reach anything
  # public: not this repo's visual-diff-assets branch, not an Actions
  # artifact (this job uploads none), not the job log (the renderer only
  # ever sees the models as code-named hard links, so what it prints and
  # the PNG names say the code, and --quiet-child-stderr keeps the
  # engines' error text out of the log), and not the PR comment, which
  # carries codes and links only - no embedded image, no pixel figure.
  #
  # The images and the renderer's full report are pushed to the
  # `visual-diff-assets` branch of bldrs-ai/test-models-private, under
  # conway/pr-<N>/<run id>/ (conway/dispatch/<run id>/ for a dispatch).
  # There is no fallback destination: without the write token the job
  # renders nothing, says so in its comment and summary, and passes.
  #
  # TEST_MODELS_PRIVATE_WRITE_TOKEN is a plain repo secret, an ACCEPTED
  # RISK (maintainer decision, #803): a pull_request run uses the
  # BRANCH's own workflow file, so anyone who can push a branch here can
  # read it, and so can write to test-models-private. Acceptable only
  # while the people with push access here are the people trusted with
  # write access there. To tighten it later, move the secret into a
  # GitHub Environment with required reviewers and add `environment:` to
  # this job; nothing else needs to change.
  #
  # Inside the job, the order is the hardening: every step that runs PR
  # code (the engines and their npm installs, the renderer, alsocheck.py)
  # comes first, and the write token appears in exactly one step's env -
  # the last one, which runs only git (absolute /usr/bin/git, an emptied
  # environment, no global or system config, no hooks) and cp. That
  # stops a script from simply reading the token. It is not a sandbox:
  # an earlier step's code can still poison later steps (GITHUB_ENV,
  # GITHUB_PATH, sudo, a leftover process), so it narrows the exposure
  # but does not remove it (see above). The read token, likewise, travels only as a
  # per-process http.extraheader and is never written to .git/config.
  #
  # Not on a fork (no secrets; resolve-models dropped its private
  # entries) and not on a draft. Like visual-diff, it needs
  # run-ifc-regression to have passed - named explicitly, with
  # !cancelled(), for the reason on visual-diff: under an implicit
  # success() a skipped ancestor (regression-alsocheck on a run with no
  # public alsocheck entries, say) would skip this job too.
  # ---------------------------------------------------------------------------
  visual-diff-private:
    needs: [resolve-models, run-ifc-regression]
    if: >-
      !cancelled() &&
      needs.resolve-models.result == 'success' &&
      needs.run-ifc-regression.result == 'success' &&
      needs.resolve-models.outputs.private_render == 'true' &&
      needs.resolve-models.outputs.private_sha != '' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # Up to 5 models, the big ones exported one engine at a time with a
    # 900 s timeout each: 5 x 2 x 15 min is 150 minutes if every export
    # hangs. Typical is a few minutes per model.
    timeout-minutes: 160
    permissions:
      contents: read
      pull-requests: write  # post the codes-and-links comment
    env:
      WRITE_TOKEN_PRESENT: ${{ secrets.TEST_MODELS_PRIVATE_WRITE_TOKEN != '' }}
      PRIVATE_REPO: bldrs-ai/test-models-private
      ASSETS_BRANCH: visual-diff-assets
      DEST: ${{ github.event_name == 'pull_request' && format('conway/pr-{0}/{1}', github.event.pull_request.number, github.run_id) || format('conway/dispatch/{0}', github.run_id) }}
    steps:
      - name: Checkout conway (render scripts)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Write the private model list
        env:
          ENTRIES: ${{ needs.resolve-models.outputs.alsocheck_private }}
        run: |
          python3 .github/actions/regression-shard/alsocheck.py write-list \
            --corpus private --out private_render.txt

      - name: Note a missing write token
        if: env.WRITE_TOKEN_PRESENT != 'true'
        run: |
          echo "::warning::TEST_MODELS_PRIVATE_WRITE_TOKEN is not set; private renders have no destination, so nothing is rendered."

      - name: Setup Node
        if: env.WRITE_TOKEN_PRESENT == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Engines (candidate + published base)
        if: env.WRITE_TOKEN_PRESENT == 'true'
        uses: ./.github/actions/visual-diff-engines
        with:
          package-tgz: ${{ needs.run-ifc-regression.outputs.package_tgz }}

      # Read token as a per-process header (see the job comment), then
      # LFS for the named codes only, then code-named hard links for the
      # renderer. Not cached, as for every private shard.
      - name: Checkout private corpus
        if: env.WRITE_TOKEN_PRESENT == 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          TOKEN: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN }}
          SHA: ${{ needs.resolve-models.outputs.private_sha }}
        run: |
          set -euo pipefail
          B64=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$B64"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $B64"
          git init -q models
          git -C models remote add origin "https://github.com/${PRIVATE_REPO}.git"
          git -C models fetch -q --depth 1 origin "$SHA"
          git -C models checkout -q "$SHA"
          python3 .github/actions/regression-shard/shard_list.py pull private_render.txt models
          python3 .github/actions/regression-shard/shard_list.py link \
            private_render.txt models by-code --out abs_private.txt
          if grep -qiE 'x-access-token|authorization' models/.git/config; then
            echo "::error::a credential reached models/.git/config"; exit 1
          fi

      # Same engines and threshold as visual-diff's alsocheck section:
      # always shown, at most five. Sized for the headline models (PSB900
      # is ~900 MB and peaks at roughly twelve times that): a model over
      # 300 MB is exported one engine at a time rather than two side by
      # side on the 16 GB runner, and each export gets 900 s, not 180.
      # --quiet-child-stderr: the engines' error text describes the
      # model's internals; it stays in the private report.
      - name: Render before/after pairs
        if: env.WRITE_TOKEN_PRESENT == 'true'
        run: |
          node scripts/visual_diff_report.cjs \
            --models abs_private.txt \
            --base engines/base --cand engines/cand \
            --out vdout-private --max 5 \
            --diff-threshold -1 \
            --export-timeout 900 \
            --serial-over-mb 300 \
            --quiet-child-stderr true

      # The payload the push step copies, as plain files. The renderer's
      # report, with image links made relative, becomes the directory's
      # README so it renders in the private repo's tree view.
      - name: Stage the private payload
        if: env.WRITE_TOKEN_PRESENT == 'true'
        run: |
          set -euo pipefail
          mkdir -p payload
          cp vdout-private/*.png payload/ 2>/dev/null || true
          {
            echo "# conway visual diff (alsocheck, private models)"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            if [ -f vdout-private/report.md ]; then
              sed "s|RAW_URL_BASE|.|g" vdout-private/report.md
            else
              echo "_The renderer wrote no report; see the run's job log._"
            fi
          } > payload/README.md

      # Built before the push, so no PR-branch script runs once the write
      # token is in the job; it links the branch path, not a commit.
      - name: Build the codes-and-links comment
        id: comment
        if: ${{ !cancelled() }}
        env:
          ENTRIES: ${{ needs.resolve-models.outputs.alsocheck_private }}
        run: |
          python3 .github/actions/regression-shard/alsocheck.py private-render-comment \
            --png-dir payload --repo "$PRIVATE_REPO" \
            --branch "$ASSETS_BRANCH" --dest "$DEST" \
            --write-token "$WRITE_TOKEN_PRESENT" \
            --out private_comment.md
          cat private_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on Pull Request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('private_comment.md') != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: private_comment.md

      # LAST, and the only step that sees the write token. git and cp
      # only, through G(): /usr/bin/git in an emptied environment with no
      # global or system config and hooks off, so neither PATH, a
      # GITHUB_ENV variable, ~/.gitconfig nor a planted hook can reroute
      # or capture the push. A fresh clone made here, not one an earlier
      # step could have touched. Fails after pushing if any requested
      # code rendered nothing.
      - name: Push renders to the private repo
        if: env.WRITE_TOKEN_PRESENT == 'true'
        env:
          WRITE_TOKEN: ${{ secrets.TEST_MODELS_PRIVATE_WRITE_TOKEN }}
          UNRENDERED: ${{ steps.comment.outputs.unrendered }}
        run: |
          set -euo pipefail
          B64=$(printf 'x-access-token:%s' "$WRITE_TOKEN" | /usr/bin/base64 -w0)
          echo "::add-mask::$B64"
          unset WRITE_TOKEN
          PUSH_HOME=$(/usr/bin/mktemp -d)
          REPO_DIR="$PUSH_HOME/assets"
          URL="https://github.com/${PRIVATE_REPO}.git"
          G() {
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$PUSH_HOME" \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
              GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1 \
              GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]" \
              GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
              GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
              GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $B64" \
              GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null \
              /usr/bin/git "$@"
          }
          # Missing branch (first private render ever) vs a failed read:
          # ls-remote errors on the second, and an orphan branch is made
          # only on the first, so it carries none of the corpus's history
          # or LFS objects.
          # A plain assignment, so a failed ls-remote stops the step
          # under `set -e` instead of reading as "no branch".
          HEADS=$(G ls-remote --heads "$URL" "$ASSETS_BRANCH")
          if [ -n "$HEADS" ]; then
            G clone -q --depth 1 --branch "$ASSETS_BRANCH" "$URL" "$REPO_DIR"
          else
            G init -q -b "$ASSETS_BRANCH" "$REPO_DIR"
          fi
          /usr/bin/mkdir -p "$REPO_DIR/$DEST"
          /usr/bin/cp -R payload/. "$REPO_DIR/$DEST/"
          G -C "$REPO_DIR" add -A
          G -C "$REPO_DIR" commit -q -m "conway visual diff assets: ${DEST}" || true
          pushed=false
          for i in 1 2 3; do
            if G -C "$REPO_DIR" push -q "$URL" "HEAD:refs/heads/${ASSETS_BRANCH}"; then
              pushed=true; break
            fi
            # Another run pushed first; its files are in another run's
            # directory, so the rebase cannot conflict.
            G -C "$REPO_DIR" pull -q --rebase "$URL" "$ASSETS_BRANCH" || true
            /usr/bin/sleep $((i * 2))
          done
          /usr/bin/rm -rf "$PUSH_HOME"
          if [ "$pushed" != true ]; then
            echo "::error::Could not push private renders to ${PRIVATE_REPO}@${ASSETS_BRANCH}. Nothing was published anywhere else; the comment's links will not resolve."
            exit 1
          fi
          if [ -n "$UNRENDERED" ]; then
            echo "::error::Rendered nothing for: ${UNRENDERED}. A requested model with no image cannot pass."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Headless-three perf benchmark (public models).
  #
  # Runs scripts/benchmark.cjs against bldrs-ai/test-models (public) using the
  # candidate conway tarball produced by run-ifc-regression. The adapter
  # (@bldrs-ai/conway-web-ifc-adapter) ships unbundled — it does runtime
  # `import '@bldrs-ai/conway'` — so a yarn `resolutions` override in H3's
  # package.json forces the entire chain (H3 → adapter → conway) onto our
  # candidate without rebuilding the adapter.
  #
  # Info-only: results are posted as a PR comment for visibility. Future
  # iterations will diff perf vs a golden baseline and may gate on it.
  # ---------------------------------------------------------------------------
  perf-three-public:
    needs: run-ifc-regression
    # Extended suite: runs on an `rc-*` release-candidate tag (a manual
    # prod-blessing) or on-demand via workflow_dispatch — NOT on plain merges
    # to main. build + run-ifc-regression (ungated) still run on the tag, so
    # the candidate tarball this job benchmarks is produced; auto-publish is
    # main-branch-only and does not fire on a tag ref.
    #
    # !cancelled() and the run-ifc-regression result, for the reason on
    # visual-diff: without a status function the implicit success() spans
    # the whole dependency chain, so on a plain dispatch (run_private_shards
    # off, private shards `skipped`) this job was skipped too - on exactly
    # the run the dispatch exists for.
    if: >-
      !cancelled() && needs.run-ifc-regression.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    # Full set locally takes ~10 min; H3 build + clone adds ~5-10 min. Cap at
    # 60 to bound runner-minute cost on a hung benchmark.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      actions: read    # required by download-artifact@v4 to fetch from prior runs
    env:
      # Pinned to a SHA so perf is reproducible. Override via repo variable
      # `H3_SHA` when bumping the H3 baseline.
      H3_SHA: ${{ vars.H3_SHA || '76f9ab686e08e58e7fe798e6a11ed0ad52b38c4b' }}
    steps:
      - name: Checkout conway (for scripts/benchmark.cjs)
        uses: actions/checkout@v4
        with:
          # No submodules — perf doesn't build conway, it consumes the tarball.
          submodules: false
          fetch-depth: 1

      # Unlike the other jobs (pure JS/wasm on Node 26), perf builds
      # headless-three's native addons — `gl` and `canvas`. Neither ships a
      # prebuilt for Node 26, and `gl` won't even compile against Node 26's V8
      # (GetAlignedPointerFromInternalField signature change). Pin Node 20,
      # which has prebuilt binaries for both; it's also the runtime the 1.361
      # perf baseline was measured under, so the comparison stays apples-to-apples.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download conway candidate tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.run-ifc-regression.outputs.package_tgz }}
          path: artifacts

      - name: Clone headless-three at pinned SHA
        run: |
          git clone https://github.com/bldrs-ai/headless-three.git h3
          git -C h3 checkout "$H3_SHA"

      - name: Override conway via yarn resolutions
        env:
          CANDIDATE_TGZ: ${{ github.workspace }}/artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}
        run: |
          test -f "$CANDIDATE_TGZ" || { echo "::error::Candidate tarball missing: $CANDIDATE_TGZ"; exit 1; }
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('h3/package.json', 'utf8'));
            p.resolutions = Object.assign({}, p.resolutions, { '@bldrs-ai/conway': 'file:' + process.env.CANDIDATE_TGZ });
            fs.writeFileSync('h3/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # headless-three pulls in `canvas`, which has no prebuilt binary for this
      # runner's Node, so the `yarn install` below compiles it from source. Its
      # node-gyp build needs cairo/pixman/pango/etc. dev headers present *before*
      # install — the GL libraries installed further down (for headless-gl) come
      # too late and don't include these. Without this, `yarn install` dies with
      # "Package pixman-1 was not found" and every perf run is skipped.
      - name: Install canvas native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config build-essential \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install H3 + build
        working-directory: h3
        run: |
          yarn install
          yarn build
          # The bundled server resolves the conway wasm from <cwd>/Dist at
          # runtime; without this every render 500s with ERR_MODULE_NOT_FOUND.
          ln -sfn node_modules/@bldrs-ai/conway/compiled/dependencies/conway-geom/Dist Dist

      # Safety check: if the resolutions override didn't take effect, H3 would
      # silently benchmark whatever conway version its lockfile pins instead of
      # our candidate. Compare the version in node_modules against the version
      # baked into the candidate tarball's package.json.
      - name: Verify candidate conway is resolved in H3
        env:
          CANDIDATE_TGZ: ${{ github.workspace }}/artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}
        run: |
          EXPECTED=$(tar -xzOf "$CANDIDATE_TGZ" package/package.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s).version))")
          ACTUAL=$(node -p "require('./h3/node_modules/@bldrs-ai/conway/package.json').version")
          echo "Expected conway: $EXPECTED"
          echo "Actual conway:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::yarn resolutions override did not take effect. Expected '$EXPECTED', got '$ACTUAL'."
            exit 1
          fi

      # headless-gl (the `gl` package H3 renders through) needs an X/GLX
      # display plus the GL libraries H3's own Dockerfile installs
      # (libxi/libGLU/GLEW); with only xvfb the server can die at startup
      # and every render fails.
      - name: Install Xvfb + GL libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb pkg-config build-essential \
            libxi-dev libglu1-mesa-dev libglew-dev

      # Prove the `gl` native module can actually create a context on this
      # runner before spending minutes benchmarking. The npm prebuilt binary
      # is built on a different image; if it can't initialize here, rebuild
      # it from source against this runner's libraries and re-verify.
      - name: GL smoke test (rebuild gl from source if prebuilt is broken)
        working-directory: h3
        run: |
          SMOKE='const gl=require("gl")(8,8); if(!gl){throw new Error("gl context creation returned null")}; console.log("gl OK:", gl.getParameter(gl.VERSION))'
          if ! xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" node -e "$SMOKE"; then
            echo "::warning::Prebuilt gl failed to initialize; rebuilding from source."
            npm rebuild gl --build-from-source
            xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" node -e "$SMOKE"
          fi

      - name: Restore Test Models Cache
        id: cache-test-models
        uses: actions/cache@v4
        with:
          path: test-models
          # Full public corpus, not the smoke-sized cache the PR
          # regression job writes. This job is rc-only on the 150 GB
          # SKU; a miss re-clones.
          key: ${{ runner.os }}-test-models-${{ needs.run-ifc-regression.outputs.test_models_sha }}

      - name: Checkout Test Models Repo if Not Cached
        if: steps.cache-test-models.outputs.cache-hit != 'true'
        run: |
          SHA="${{ needs.run-ifc-regression.outputs.test_models_sha }}"
          # Same exact commit run-ifc-regression diffed against (fetch-by-SHA).
          git init test-models
          git -C test-models remote add origin https://github.com/bldrs-ai/test-models.git
          git -C test-models fetch --depth 1 origin "$SHA"
          git -C test-models checkout "$SHA"

      - name: Run H3 benchmark (public)
        env:
          # Keep outputs OUT of the test-models checkout: it contains
          # committed benchmark snapshot CSVs, and reporting used to pick
          # those up instead of this run's results.
          BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/bench-public
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" \
            node scripts/benchmark.cjs ./h3 ./test-models

      - name: Locate detail CSV
        id: detail
        run: |
          # benchmark.cjs writes to $BENCHMARK_OUTPUT_DIR/<engine>_<modelDirName>/performance-detail.csv
          CSV=$(find "${{ runner.temp }}/bench-public" -name performance-detail.csv -type f | head -1)
          test -n "$CSV" || { echo "::error::performance-detail.csv not produced"; exit 1; }
          echo "csv=${CSV}" >> "$GITHUB_OUTPUT"

      - name: Build perf table (all models, alpha sort)
        id: table
        env:
          CSV_PATH: ${{ steps.detail.outputs.csv }}
        run: |
          TABLE=$(python - "$CSV_PATH" <<'EOF'
          import csv, os, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          if not rows:
              print("performance-detail.csv is empty.")
              sys.exit(0)
          rows.sort(key=lambda r: r.get('filename',''))
          cols = ['filename','loadStatus','schemaVersion','parseTimeMs','geometryTimeMs','totalTimeMs','geometryMemoryMb','peakWasmHeapMb','rssMb','peakRssMb','heapUsedMb','retainedRssMb']
          print("| " + " | ".join(cols) + " |")
          print("|" + " --- |" * len(cols))
          for r in rows:
              print("| " + " | ".join(str(r.get(c,'')) for c in cols) + " |")
          print("")
          print(f"_Total: {len(rows)} models._")
          EOF
          )
          {
            echo "table<<EOF"
            echo "$TABLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload public perf detail CSV
        uses: actions/upload-artifact@v4
        with:
          name: perf-three-public-${{ github.run_id }}
          path: ${{ steps.detail.outputs.csv }}

      # Full bench output (per-model PNGs, 00-rendering-server.log.txt) even —
      # especially — when the benchmark fails, so render failures are
      # diagnosable from the artifact instead of being lost with the runner.
      - name: Upload bench output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-three-public-benchdir-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-public
          if-no-files-found: ignore

      # --- Cross-version delta vs the most recent prior push:main run ---
      # See .github/actions/perf-delta for the shared find/download/compute/
      # upload pipeline. Non-fatal: if anything goes wrong (no prior, expired,
      # format change, script error), the delta section is omitted from the
      # comment and the snapshot still posts.
      - name: Compute public perf delta
        id: perf_delta
        uses: ./.github/actions/perf-delta
        with:
          artifact-prefix: 'perf-three-public-'
          current-csv: ${{ steps.detail.outputs.csv }}
          delta-artifact-name: perf-delta-public-${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build delta section (sorted by abs %change)
        id: delta_table
        if: steps.perf_delta.outputs.csv != ''
        env:
          DELTA_CSV: ${{ steps.perf_delta.outputs.csv }}
          PREV_RUN_ID: ${{ steps.perf_delta.outputs.prev_run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SECTION=$(python - "$DELTA_CSV" "$PREV_RUN_ID" "$RUN_ID" <<'EOF'
          import csv, sys
          delta_csv, prev_run_id, run_id = sys.argv[1], sys.argv[2], sys.argv[3]
          def pct(s):
              s = (s or '').strip().rstrip('%')
              if s == '' or s == 'Infinity' or s == 'N/A': return float('inf') if s == 'Infinity' else 0.0
              try: return float(s)
              except ValueError: return 0.0
          rows = list(csv.DictReader(open(delta_csv)))
          if not rows:
              sys.exit(0)
          rows.sort(key=lambda r: abs(pct(r.get('totalTimeMsPercentageChange',''))), reverse=True)
          # Δ peak RSS is the process high-water mark, Δ RSS a single end-of-load
          # sample; both are N/A against a baseline blessed before conway#552.
          # Δ external is off-heap bytes heapUsed cannot see. Its arrayBuffers
          # subset is in the CSV rather than here, to keep this table readable.
          # Δ retained RSS is a delta OF a delta: each side is already what one
          # load/teardown cycle left behind (conway#554), so a positive number
          # here means the cycle got leakier. N/A before #554, and in any run
          # whose children had no --expose-gc. Its heapUsed/external siblings
          # are in the CSV rather than here, same readability trade.
          cols = ['filename','engine1TotalTimeMs','engine2TotalTimeMs','totalTimeMsDelta','totalTimeMsPercentageChange','geometryMemoryMbDelta','peakWasmHeapMbDelta','rssMbDelta','peakRssMbDelta','externalMbDelta','retainedRssMbDelta']
          headers = ['file','prev ms','curr ms','Δ ms','Δ %','Δ geomMem MB','Δ wasm heap MB','Δ RSS MB','Δ peak RSS MB','Δ external MB','Δ retained RSS MB']
          print(f"### Δ vs previous run [#{prev_run_id}](https://github.com/bldrs-ai/conway/actions/runs/{prev_run_id})")
          print()
          print("| " + " | ".join(headers) + " |")
          print("|" + " --- |" * len(headers))
          for r in rows:
              print("| " + " | ".join(str(r.get(c,'')) for c in cols) + " |")
          print()
          print(f"_Δ rows: {len(rows)} (sorted by |Δ %| desc). Negative = improvement._")
          print(f"_Delta CSV in run artifacts (`perf-delta-public-{run_id}`)._")
          EOF
          )
          {
            echo "section<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Parse PR# from the merge commit message — same trick auto-publish uses.
      # Squash-merge embeds it as "... (#N)", merge commit as "Merge pull
      # request #N from ...". If no PR# parses, skip the comment (artifact is
      # still uploaded for manual inspection).
      - name: Resolve PR number for comment target
        id: pr
        run: |
          MSG=$(git log -1 --format=%B HEAD)
          PR_NUM=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"

      # Look up an existing perf comment by hidden marker and upsert. Without
      # this, every re-run of push:main would post a new duplicate comment.
      - name: Find existing public perf comment
        id: find_comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- perf-three-public -->'

      - name: Create or update public perf comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- perf-three-public -->
            ## Headless-three Performance (public models)

            **Setup**: conway `${{ needs.run-ifc-regression.outputs.package_tgz }}` against H3 `${{ env.H3_SHA }}` over `test-models@${{ needs.run-ifc-regression.outputs.test_models_sha }}`.

            ${{ steps.table.outputs.table }}

            ${{ steps.delta_table.outputs.section }}

            _Full `performance-detail.csv` in run artifacts (`perf-three-public-${{ github.run_id }}`)._

  # ---------------------------------------------------------------------------
  # Headless-three perf benchmark (private models).
  #
  # Same setup as perf-three-public but against bldrs-ai/test-models-private.
  # conway is a PUBLIC repo, so Actions logs and artifacts are world-readable.
  # Private model names are therefore anonymized to stable path hashes
  # (BENCHMARK_ANONYMIZE) everywhere the benchmark could surface them, the
  # posted comment is aggregate-only, and the raw bench dir (server log / PNGs
  # that carry the real path) is not uploaded — so no private model name
  # reaches a public sink.
  #
  # Fail-fast on missing TEST_MODELS_PRIVATE_TOKEN: surfaces config problems
  # immediately instead of silently skipping coverage.
  # ---------------------------------------------------------------------------
  perf-three-private:
    needs: run-ifc-regression
    # Extended suite: runs on an `rc-*` release-candidate tag (a manual
    # prod-blessing) or on-demand via workflow_dispatch — NOT on plain merges
    # to main. build + run-ifc-regression (ungated) still run on the tag, so
    # the candidate tarball this job benchmarks is produced; auto-publish is
    # main-branch-only and does not fire on a tag ref.
    # Status functions as on perf-three-public.
    if: >-
      !cancelled() && needs.run-ifc-regression.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rc-')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      actions: read    # required by download-artifact@v4 to fetch from prior runs
    env:
      H3_SHA: ${{ vars.H3_SHA || '76f9ab686e08e58e7fe798e6a11ed0ad52b38c4b' }}
      # TEST_MODELS_PRIVATE_TAG is workflow-level now that the PR shards
      # need it too; it used to be redeclared here with the same value.
    steps:
      - name: Fail fast if private models token missing
        env:
          TOKEN_PRESENT: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::TEST_MODELS_PRIVATE_TOKEN secret is not set. Required to clone bldrs-ai/test-models-private."
            exit 1
          fi

      - name: Checkout conway (for scripts/benchmark.cjs)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # See the public perf job — Node 20 so headless-three's native `gl` /
      # `canvas` addons resolve prebuilts instead of failing to compile on Node 26.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download conway candidate tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.run-ifc-regression.outputs.package_tgz }}
          path: artifacts

      - name: Clone headless-three at pinned SHA
        run: |
          git clone https://github.com/bldrs-ai/headless-three.git h3
          git -C h3 checkout "$H3_SHA"

      - name: Override conway via yarn resolutions
        env:
          CANDIDATE_TGZ: ${{ github.workspace }}/artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}
        run: |
          test -f "$CANDIDATE_TGZ" || { echo "::error::Candidate tarball missing: $CANDIDATE_TGZ"; exit 1; }
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('h3/package.json', 'utf8'));
            p.resolutions = Object.assign({}, p.resolutions, { '@bldrs-ai/conway': 'file:' + process.env.CANDIDATE_TGZ });
            fs.writeFileSync('h3/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # See the public perf job — canvas compiles from source here and needs
      # cairo/pixman/pango dev headers before `yarn install`, ahead of the
      # GL libraries installed further down.
      - name: Install canvas native build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config build-essential \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install H3 + build
        working-directory: h3
        run: |
          yarn install
          yarn build
          # The bundled server resolves the conway wasm from <cwd>/Dist at
          # runtime; without this every render 500s with ERR_MODULE_NOT_FOUND.
          ln -sfn node_modules/@bldrs-ai/conway/compiled/dependencies/conway-geom/Dist Dist

      - name: Verify candidate conway is resolved in H3
        env:
          CANDIDATE_TGZ: ${{ github.workspace }}/artifacts/${{ needs.run-ifc-regression.outputs.package_tgz }}
        run: |
          EXPECTED=$(tar -xzOf "$CANDIDATE_TGZ" package/package.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s).version))")
          ACTUAL=$(node -p "require('./h3/node_modules/@bldrs-ai/conway/package.json').version")
          echo "Expected conway: $EXPECTED"
          echo "Actual conway:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::yarn resolutions override did not take effect. Expected '$EXPECTED', got '$ACTUAL'."
            exit 1
          fi

      # headless-gl needs an X/GLX display + GL libraries; see the public
      # perf job for details.
      - name: Install Xvfb + GL libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb pkg-config build-essential \
            libxi-dev libglu1-mesa-dev libglew-dev

      - name: GL smoke test (rebuild gl from source if prebuilt is broken)
        working-directory: h3
        run: |
          SMOKE='const gl=require("gl")(8,8); if(!gl){throw new Error("gl context creation returned null")}; console.log("gl OK:", gl.getParameter(gl.VERSION))'
          if ! xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" node -e "$SMOKE"; then
            echo "::warning::Prebuilt gl failed to initialize; rebuilding from source."
            npm rebuild gl --build-from-source
            xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" node -e "$SMOKE"
          fi

      - name: Clone private test models
        env:
          GH_TOKEN: ${{ secrets.TEST_MODELS_PRIVATE_TOKEN }}
        run: |
          git clone --depth 1 --branch "$TEST_MODELS_PRIVATE_TAG" \
            "https://x-access-token:${GH_TOKEN}@github.com/bldrs-ai/test-models-private.git" test-models-private

      - name: Run H3 benchmark (private)
        env:
          # Keep outputs OUT of the model checkout (it may contain committed
          # benchmark snapshot CSVs that reporting would pick up instead).
          BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/bench-private
          # conway is a PUBLIC repo — Actions logs and artifacts are
          # world-readable. Anonymize private model names to stable path
          # hashes everywhere they could surface (console, detail CSV, PNG
          # names, log tail) so private names never leak. The cross-version
          # delta still joins by the stable hash.
          BENCHMARK_ANONYMIZE: '1'
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24 +extension GLX +render -noreset" \
            node scripts/benchmark.cjs ./h3 ./test-models-private

      - name: Locate detail CSV
        id: detail
        run: |
          CSV=$(find "${{ runner.temp }}/bench-private" -name performance-detail.csv -type f | head -1)
          test -n "$CSV" || { echo "::error::performance-detail.csv not produced"; exit 1; }
          echo "csv=${CSV}" >> "$GITHUB_OUTPUT"

      - name: Build aggregate stats (no filenames)
        id: stats
        env:
          CSV_PATH: ${{ steps.detail.outputs.csv }}
        run: |
          STATS=$(python - "$CSV_PATH" <<'EOF'
          import csv, statistics, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          total = len(rows)
          # Treat any loadStatus other than 'ok' (case-insensitive) as failing.
          ok_rows = [r for r in rows if (r.get('loadStatus','').strip().lower() == 'ok')]
          fail = total - len(ok_rows)
          def col_stats(col):
              vals = []
              for r in ok_rows:
                  v = r.get(col, '')
                  try:
                      vals.append(float(v))
                  except (TypeError, ValueError):
                      pass
              if not vals:
                  return {'count': '0', 'min': '-', 'median': '-', 'mean': '-', 'max': '-', 'stddev': '-'}
              return {
                  'count': str(len(vals)),
                  'min': f"{min(vals):.0f}",
                  'median': f"{statistics.median(vals):.0f}",
                  'mean': f"{statistics.mean(vals):.0f}",
                  'max': f"{max(vals):.0f}",
                  'stddev': f"{(statistics.stdev(vals) if len(vals) > 1 else 0):.0f}",
              }
          cols = ['parseTimeMs', 'geometryTimeMs', 'totalTimeMs', 'geometryMemoryMb', 'peakWasmHeapMb', 'rssMb', 'peakRssMb', 'retainedRssMb']
          s = {c: col_stats(c) for c in cols}
          print(f"**Pass/fail**: {len(ok_rows)} passing / {fail} failing of {total} total.")
          print()
          print("| stat | " + " | ".join(cols) + " |")
          print("| --- |" + " --- |" * len(cols))
          for stat in ['count', 'min', 'median', 'mean', 'max', 'stddev']:
              print(f"| {stat} | " + " | ".join(s[c][stat] for c in cols) + " |")
          EOF
          )
          {
            echo "stats<<EOF"
            echo "$STATS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The detail CSV carries only anonymized identifiers (BENCHMARK_ANONYMIZE
      # above), so it's safe to upload on this public repo.
      - name: Upload private perf detail CSV
        uses: actions/upload-artifact@v4
        with:
          name: perf-three-private-${{ github.run_id }}
          path: ${{ steps.detail.outputs.csv }}

      # NOTE: the full bench dir (per-model PNGs, 00-rendering-server.log.txt)
      # is deliberately NOT uploaded for the private job. The server log
      # records the real model file path and the PNGs would be named by it,
      # and conway is a PUBLIC repo where artifacts are world-readable. Private
      # render failures therefore can't be diagnosed from a public artifact —
      # re-run against a private runner if needed. (The public job uploads its
      # bench dir; those model names are already public.)

      # --- Cross-version delta vs previous push:main run ---
      # Mirrors the public-job logic but emits aggregate stats over the delta
      # columns (no identifiers in the comment). The delta CSV carries only the
      # anonymized identifiers, so the uploaded artifact leaks no model names.
      - name: Compute private perf delta
        id: perf_delta
        uses: ./.github/actions/perf-delta
        with:
          artifact-prefix: 'perf-three-private-'
          current-csv: ${{ steps.detail.outputs.csv }}
          delta-artifact-name: perf-delta-private-${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Aggregate-only stats over the delta columns — no filenames leak into
      # the comment body. Pct change is a string like "12.34%"; strip the
      # suffix for the numeric stats. Models present in only one side
      # contribute N/A delta values which parseValue() in gen_delta_csv
      # collapses to 0; we skip them here so the stats reflect real changes.
      - name: Build delta stats section
        id: delta_stats
        if: steps.perf_delta.outputs.csv != ''
        env:
          DELTA_CSV: ${{ steps.perf_delta.outputs.csv }}
          PREV_RUN_ID: ${{ steps.perf_delta.outputs.prev_run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SECTION=$(python - "$DELTA_CSV" "$PREV_RUN_ID" "$RUN_ID" <<'EOF'
          import csv, statistics, sys
          delta_csv, prev_run_id, run_id = sys.argv[1], sys.argv[2], sys.argv[3]
          rows = list(csv.DictReader(open(delta_csv)))
          # Only models that ran successfully on BOTH sides have meaningful
          # numeric deltas. loadStatus1/2 are 'OK' (uppercase) from benchmark.cjs.
          common = [r for r in rows
                    if r.get('loadStatus1','').strip().upper() == 'OK'
                    and r.get('loadStatus2','').strip().upper() == 'OK']
          def parse_pct(s):
              s = (s or '').strip().rstrip('%')
              if s in ('', 'N/A', 'Infinity'): return None
              try: return float(s)
              except ValueError: return None
          def parse_num(s):
              s = (s or '').strip()
              if s in ('', 'N/A'): return None
              try: return float(s)
              except ValueError: return None
          def col_stats(label, vals, suffix=''):
              vals = [v for v in vals if v is not None]
              if not vals:
                  return {'count': '0', 'min': '-', 'median': '-', 'mean': '-', 'max': '-', 'stddev': '-'}
              # Match precision to the column's unit (% gets 2 decimals; ms is integer)
              # and use the same suffix so the cells in a column read uniformly.
              prec = 2 if suffix == '%' else 0
              signed = lambda v: f"{v:+.{prec}f}{suffix}"
              unsigned = lambda v: f"{v:.{prec}f}{suffix}"
              return {
                  'count': str(len(vals)),
                  'min': signed(min(vals)),
                  'median': signed(statistics.median(vals)),
                  'mean': signed(statistics.mean(vals)),
                  'max': signed(max(vals)),
                  'stddev': unsigned(statistics.stdev(vals) if len(vals) > 1 else 0),
              }
          parse_d  = col_stats('parseTimeMsDelta',   [parse_num(r.get('parseTimeMsDelta','')) for r in common])
          geom_d   = col_stats('geometryTimeMsDelta',[parse_num(r.get('geometryTimeMsDelta','')) for r in common])
          total_d  = col_stats('totalTimeMsDelta',   [parse_num(r.get('totalTimeMsDelta','')) for r in common])
          pct_d    = col_stats('pct',                [parse_pct(r.get('totalTimeMsPercentageChange','')) for r in common], suffix='%')
          gmem_d   = col_stats('geometryMemoryMbDelta', [parse_num(r.get('geometryMemoryMbDelta','')) for r in common])
          rss_d    = col_stats('rssMbDelta',         [parse_num(r.get('rssMbDelta','')) for r in common])
          peak_d   = col_stats('peakRssMbDelta',    [parse_num(r.get('peakRssMbDelta','')) for r in common])
          ext_d    = col_stats('externalMbDelta',   [parse_num(r.get('externalMbDelta','')) for r in common])
          wasm_d   = col_stats('peakWasmHeapMbDelta', [parse_num(r.get('peakWasmHeapMbDelta','')) for r in common])
          ret_d    = col_stats('retainedRssMbDelta', [parse_num(r.get('retainedRssMbDelta','')) for r in common])
          # Track regressions/improvements at a glance.
          pct_vals = [parse_pct(r.get('totalTimeMsPercentageChange','')) for r in common]
          pct_vals = [v for v in pct_vals if v is not None]
          regr = sum(1 for v in pct_vals if v > 0)
          impr = sum(1 for v in pct_vals if v < 0)
          flat = sum(1 for v in pct_vals if v == 0)
          print(f"### Δ vs previous run [#{prev_run_id}](https://github.com/bldrs-ai/conway/actions/runs/{prev_run_id})")
          print()
          print(f"**Models compared (OK on both sides)**: {len(common)} of {len(rows)} delta rows.")
          print(f"**Regressed / improved / flat (by totalTimeMs)**: {regr} / {impr} / {flat}.")
          print()
          cols = ['parseTimeMsDelta','geometryTimeMsDelta','totalTimeMsDelta','totalTimeMsPercentageChange','geometryMemoryMbDelta','peakWasmHeapMbDelta','rssMbDelta','peakRssMbDelta','externalMbDelta','retainedRssMbDelta']
          headers = ['stat','Δ parse ms','Δ geom ms','Δ total ms','Δ total %','Δ geomMem MB','Δ wasm heap MB','Δ RSS MB','Δ peak RSS MB','Δ external MB','Δ retained RSS MB']
          s = {'parseTimeMsDelta': parse_d, 'geometryTimeMsDelta': geom_d, 'totalTimeMsDelta': total_d, 'totalTimeMsPercentageChange': pct_d, 'geometryMemoryMbDelta': gmem_d, 'peakWasmHeapMbDelta': wasm_d, 'rssMbDelta': rss_d, 'peakRssMbDelta': peak_d, 'externalMbDelta': ext_d, 'retainedRssMbDelta': ret_d}
          print("| " + " | ".join(headers) + " |")
          print("|" + " --- |" * len(headers))
          for stat in ['count', 'min', 'median', 'mean', 'max', 'stddev']:
              print(f"| {stat} | " + " | ".join(s[c][stat] for c in cols) + " |")
          print()
          print(f"_Delta CSV in run artifacts (`perf-delta-private-{run_id}`); model identifiers are anonymized._")
          EOF
          )
          {
            echo "section<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR number for comment target
        id: pr
        run: |
          MSG=$(git log -1 --format=%B HEAD)
          PR_NUM=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"

      # Look up an existing perf comment by hidden marker and upsert. Without
      # this, every re-run of push:main would post a new duplicate comment.
      - name: Find existing private perf comment
        id: find_comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- perf-three-private -->'

      - name: Create or update private perf comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- perf-three-private -->
            ## Headless-three Performance (private models)

            **Setup**: conway `${{ needs.run-ifc-regression.outputs.package_tgz }}` against H3 `${{ env.H3_SHA }}` over `test-models-private@${{ env.TEST_MODELS_PRIVATE_TAG }}`.

            ${{ steps.stats.outputs.stats }}

            ${{ steps.delta_stats.outputs.section }}

            _Detail CSV in run artifacts (`perf-three-private-${{ github.run_id }}`); model identifiers are anonymized._

  # ---------------------------------------------------------------------------
  # Continuous release: on every successful push to main, publish to npm and
  # tag the commit. Version is <major>.<commit>.<issue>-g<shorthash>:
  #   major  - first segment of package.json's version (manual bump). The
  #            minor/patch in package.json/version.ts are an unstamped 1.0.0
  #            placeholder on main and are ignored here - both are recomputed
  #            below, so only edit the major segment to roll a major version.
  #   commit - 'git rev-list HEAD --count' at the merge commit. In the MINOR
  #            slot because it is the only strictly monotonic segment we have,
  #            and npm compares a new version against the HIGHEST-EVER
  #            published one. It used to sit in the patch slot behind the
  #            non-monotonic issue/PR number, which let an out-of-order merge
  #            compute a version below the all-time max and hard-fail the
  #            publish (conway#533).
  #   issue  - the FIRST '#N' in the merge commit message. Under this repo's
  #            title convention, '#<issue>: description (#<pr>)', that is the
  #            ISSUE number, not the PR number; a title with no issue ref
  #            yields the PR number the squash-merge appended, and one with
  #            neither falls back to 0. Non-monotonic either way (issues and
  #            PRs both land out of order), so it is informational only and
  #            lives in the patch slot where it can't invert the ordering.
  #            No PR number is encoded, and none is needed: the hash below
  #            resolves to the commit, which resolves to its PR.
  #   hash   - the first 8 characters of 'git rev-parse HEAD', prefixed with a
  #            literal 'g' as `git describe` does. The prefix is load-bearing,
  #            not cosmetic: semver forbids leading zeros in a purely numeric
  #            prerelease identifier, so a hash like 0512345 would be an
  #            INVALID version and hard-fail the publish (~0.4% of commits).
  #            Truncated rather than abbreviated by git, because EVERY git
  #            abbreviation - auto-abbrev and '--short=N' alike - is a
  #            MINIMUM width that grows to stay unique against the current
  #            object database ('git rev-parse --short=1 HEAD' returns 4
  #            characters here, not 1). Either would compute a DIFFERENT
  #            version string for the same commit as the repo grows; a
  #            version must be recomputable from the commit alone.
  #            The tradeoff: a fixed truncation can collide, which a git
  #            abbreviation cannot. Acceptable here - the commit count in the
  #            minor segment is already unique per commit on main, so the hash
  #            is a convenience ref for a human, not the identifying key. A
  #            collision would make two versions share a suffix; it would not
  #            make them equal or misorder them.
  # So every green merge ships a uniquely-traceable, strictly increasing
  # version to @latest.
  #
  # Consequence: the '-g...' suffix makes every published version a semver
  # PRERELEASE, which '^'/'~' ranges never match. Consumers must pin exactly
  # (Share does) or install via the 'latest' dist-tag.
  #
  # Auth: npm Trusted Publishing via GitHub OIDC. The trusted publisher must
  # be configured on npmjs.com (Package → Settings → Trusted Publisher) and
  # bound to repo+workflow. No NPM_TOKEN secret needed.
  # ---------------------------------------------------------------------------
  auto-publish:
    needs: [build, run-ifc-regression]
    # Both results named, with !cancelled(), rather than the implicit
    # success() - which spans every ancestor, not just `needs` (see
    # visual-diff). Today every ancestor runs on a push to main, so this
    # changes nothing there; it stops a skipped ancestor ever silently
    # skipping a release. The publish still requires a green build and a
    # green regression gate, and still never runs on a cancelled run.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.run-ifc-regression.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-4vcpu-8gb-150gbssd
    permissions:
      contents: write    # tag push
      id-token: write    # OIDC token for npm Trusted Publishing
    steps:
      - name: Checkout (full history for rev-list)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      # Trusted Publishing requires npm >= 11.5.1. Node 26 ships an older npm,
      # so upgrade the global npm binary before the publish step. On Node 26 the
      # current npm@latest (12.x) installs cleanly and has OIDC, so the earlier
      # 11.x pin (needed while this job ran Node 20) is no longer required.
      - name: Upgrade npm to a version that supports OIDC
        run: npm install -g npm@latest

      - name: Compute next version
        id: ver
        run: |
          MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          # Takes the FIRST '#N' in the merge commit message. Under this
          # repo's title convention, '#<issue>: description (#<pr>)', that is
          # the ISSUE number the merge closes - NOT the PR number, which the
          # squash-merge appends second. A title carrying no issue ref leaves
          # the appended '(#N)' first, so the PR number is what lands; a
          # message with neither (a direct push to main, say) falls back to 0
          # and warns.
          #
          # Deliberately unchanged since conway#533 renamed this variable: the
          # published numbers must not move. Only the name and the docs were
          # wrong, claiming a PR number this never held.
          MSG=$(git log -1 --format=%B HEAD)
          ISSUE_NUM=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -z "$ISSUE_NUM" ]; then
            echo "::warning::Could not parse an issue or PR number from the commit message; using 0."
            ISSUE_NUM=0
          fi
          COMMIT=$(git rev-list HEAD --count)
          # 'g' prefix per git-describe convention. Required: semver rejects a
          # leading zero in an all-numeric prerelease identifier, and ~0.4% of
          # short hashes are all digits with a leading zero.
          #
          # Truncate the full hash; do NOT use 'git rev-parse --short[=N]'.
          # Every git abbreviation is a MINIMUM width that git widens to keep
          # the result unique against the current object database - on git
          # 2.43 '--short=1 HEAD' returns 4 characters, not 1 - so '--short=8'
          # starts returning 9 as soon as two objects share an 8-character
          # prefix. Truncation depends only on the commit, so the same commit
          # always computes the same version string, which is the whole point
          # of putting a hash in the version.
          #
          # The tradeoff is that a fixed truncation CAN collide where a git
          # abbreviation cannot. That is fine here: COMMIT above is already
          # unique per commit on main, so this hash is a convenience ref for a
          # human, not the identifying key. Colliding versions would share a
          # suffix - they would not be equal, and would not misorder.
          HASH="g$(git rev-parse HEAD | cut -c1-8)"
          NEW_VERSION="${MAJOR}.${COMMIT}.${ISSUE_NUM}-${HASH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Auto-release version: ${NEW_VERSION}  (major=${MAJOR}, commit=${COMMIT}, issue=${ISSUE_NUM}, hash=${HASH})"

      - name: Stamp version into package.json + version.ts
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          perl -i -pe "s/(\"version\":\s*)\"[^\"]+\"/\$1\"$NEW_VERSION\"/" package.json
          # Version shape is <major>.<commit>.<issue>-g<shorthash>; the optional
          # trailing group must accept the prerelease suffix or the stamp
          # silently leaves the 1.0.0 placeholder in place.
          perl -i -pe "s/Conway( Web-Ifc Shim)? v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?/Conway v$NEW_VERSION/" src/version/version.ts

      - name: Compute conway-geom submodule SHA
        id: subsha
        run: echo "sha=$(git -C dependencies/conway-geom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # WASM cache is populated by the build job earlier in this run.
      - name: Restore WASM build cache
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            dependencies/conway-geom/Dist
            dependencies/conway-geom/bin/release
            compiled/dependencies/conway-geom/Dist
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ steps.subsha.outputs.sha }}

      - name: Fail if WASM cache miss
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::WASM cache miss in auto-publish; build should have populated it."
          exit 1

      - name: TypeScript build
        run: yarn build-incremental

      - name: Bundle examples
        run: yarn bundle-examples

      # Publish BEFORE tagging. If publish fails, no stranded tag.
      # npm CLI 11.5.1+ picks up the OIDC token from GHA automatically.
      - name: Publish to npm
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # --tag latest is unconditional. npm only applies `latest`
          # implicitly when the new version beats the HIGHEST-EVER published
          # one (not the current `latest` dist-tag), and it never applies it
          # implicitly to a prerelease — which every version is now, thanks to
          # the -g<hash> suffix. So the implicit path can only ever abort the
          # publish; naming the tag is the whole contract.
          npm publish --access public --tag latest

      # Idempotent tag: skip if already on origin (e.g. on a re-run).
      - name: Create and push tag
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if git ls-remote --tags origin "$NEW_VERSION" | grep -q "refs/tags/$NEW_VERSION$"; then
            echo "Tag $NEW_VERSION already exists on origin; skipping."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$NEW_VERSION" -m "Auto-release $NEW_VERSION"
          git push origin "$NEW_VERSION"
